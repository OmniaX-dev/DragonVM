<script type="text/x-dsdoc" data-id="intro" data-group="Start" data-title="Introduction">
DScript is a compiled, statically typed language in the C family. If you know C, most of it will look familiar right away: there are functions (called **subs**), structs, pointers, arrays and the usual operators, and the compiled code is as direct as what a C compiler would produce. On top of that foundation DScript adds the things that make larger programs pleasant to write: namespaces, overloading, templates, classes with virtual subs and interfaces, references, operator overloading, destructors with automatic moves, compile-time evaluation, checked errors returned as values (`throws`, `try`, `catch`), a `switch` without accidental fallthrough that can also be a value, and a preprocessor that works on tokens.

The language was designed alongside DragonVM, a virtual machine with its own CPU and toolchain, and its compiler `dsc` produces programs for that machine. The language itself, however, is described here independently of it: everything under the language sections is about DScript as a language, while the [Toolchain](#tc-overview) section explains how to compile, link, run and debug programs on DragonVM.

```ds
namespace Geo {
    struct Vec {
        var x: i32;
        var y: i32;
        sub new(var x: i32, var y: i32) { this->x = x; this->y = y; }
        sub operator+(var o: const ref Vec) -> Vec { return Vec.new(this->x + o.x, this->y + o.y); }
    }
}

sub main() -> i32 {
    var a = Geo::Vec.new(1, 2);
    var b = a + Geo::Vec.new(3, 4);
    return b.x + b.y;               // 10
}
```

<script type="text/x-dsdoc" data-id="program" data-group="Start" data-title="A program">
A DScript program is a list of top-level declarations: subs, global variables, constants, types (structs, classes, interfaces, enums, aliases), namespaces and templates. When the program starts, its globals are set up first, and then the sub called `main` runs; the value `main` returns becomes the program's result.

One thing that sets DScript apart from C is that declaration order doesn't matter. Everything can be used before it is declared, in any file of the program, so you never need to write prototypes or arrange your code so that callees come first. You can still write a declaration without a body when it helps readability, but the compiler doesn't require it.

```ds
const GREETING = "hello";

sub main() -> i32 {
    return length(GREETING);    // length is declared below, and that's fine
}

sub length(var s: string) -> i32 {
    var n: i32 = 0;
    while (s[n] != 0) n++;
    return n;
}
```

::: The main sub
`main` is where the program starts. It can take no parameters, or take the program's arguments as a count and an array of strings, and it returns either an `i32` (the program's result) or nothing:

```ds
sub main() -> i32 { ... }
sub main() { ... }                                          // returns nothing
sub main(var argc: u32, var argv: string*) -> i32 { ... }   // argv[argc] is null
```

By convention `argv[0]` is the program itself and the real arguments follow it. If the program was started without arguments, `argc` is 0 and `argv` is null. `main` can't be overloaded, inline, variadic, or have default values for its parameters.
:::

::: What happens before and after main
Before `main` runs, every global variable gets its value, in the order the declarations appear in the source, and the constructors of globals declared with a constructor call (`var g: Point(1, 2);`) run in that same order. Static local variables are set up at that time too, not at their first use. Libraries the program imports are initialized before the program's own globals, so a program can rely on its libraries being ready.

After `main` returns, the destructors of the program's globals and static variables run, in the reverse order of their construction, and then the program ends with `main`'s value as its result.
:::

::: Comments
DScript has the two kinds of comments C has. A line comment runs to the end of the line, and a block comment can span several lines:

```ds
// to the end of the line
/* a block
   comment */
```
:::

::: The declarations at a glance
This is what can appear at the top level (or inside a namespace). Each kind has its own topic:

```ds
var count: u32 = 0;                 // a global variable
const LIMIT = 10;                   // a constant
enum Color { Red, Green, Blue }     // an enum
alias Handler = sub(i32) -> void;   // a name for a type
struct Point { var x: i32; var y: i32; }
class Dog ex Animal impl Pet { ... }
interface Pet { sub name() -> string; }
sub add(var a: i32, var b: i32) -> i32 { return a + b; }
namespace Gfx { ... }
template(T) { ... }
```

See [variables](#variables), [constants](#constants), [enums](#enums), [aliases](#aliases), [structs](#structs), [classes](#classes), [interfaces](#interfaces), [subs](#subs), [namespaces](#namespaces) and [templates](#templates).
:::

::: The statements at a glance
Inside subs you write statements: declarations with `var`, `auto` and `const`; `if` / `else`; the loops `while`, `do ... while`, `for` and `for (x in range)`; `switch`; `break`, `continue` and `return`; blocks; expression statements such as calls and assignments; `defer`; `assert` and `static_assert`; and `if constexpr`, which chooses a branch while compiling. They're described under [Control flow](#control) and [Assertions](#assert).
:::
</script>

<script type="text/x-dsdoc" data-id="types" data-group="Basics" data-title="Types">
DScript's built-in types are the ones you know from C, with one important difference: their sizes are fixed and the same everywhere. An `i32` is always 4 bytes and a pointer is always 4 bytes, so a struct's layout never depends on the machine you compile for.

Structs are also packed: a struct's size is exactly the sum of its fields' sizes, with no padding inserted between them. That makes structs suitable for describing binary formats and hardware registers directly, without compiler-specific attributes.

| Type | Size | What it is |
|---|---|---|
| `i8` `u8` `i16` `u16` `i32` `u32` | 1, 2, 4 | signed and unsigned integers |
| `f32` | 4 | an IEEE 754 single precision float |
| `bool` | 1 | `true` or `false` |
| `T*` | 4 | a pointer to a `T` (`void*` points to anything) |
| `string` | 4 | the same type as `const u8*`: zero-terminated text to read |
| `T[N]` | N × size of T | an array of N elements |
| `struct` / `class` | the sum of its fields | see [Structs](#structs) and [Classes](#classes) |
| `sub(T1, T2) -> R` | 4 | a pointer to a sub |
| enums | their integer type's | `i32` unless given: `enum Kind: u8 { ... }` |

::: Other names for the built-in types
For familiarity, a few other names are accepted: `char` is `u8`, `int` is `i32`, `uint` is `u32`, and `float` is `f32`. They are exactly the same types, not new ones, and you can mix them freely. To give your own names to types, use [aliases](#aliases).
:::

::: Arrays whose size comes from their value
When a declaration has a value, an array type can leave its size out and take it from the value: `{ 1, 2, 3 }` makes an array of 3 elements, and `"text"` makes an array of 5 bytes (the four characters plus the terminating zero). This saves counting by hand and keeps the size right when the value changes. See [Arrays and initializers](#arrays).
:::

::: Strings are pointers
`string` is not a separate string type: it is another name for `const u8*`, a pointer to zero-terminated bytes that it only reads, like `const char*` in C. A string literal gives such a pointer to text stored in the program, so the text can't be changed through it. A `u8*` (a buffer) converts to `string` for reading; a sub that writes text takes a `u8*` and returns it as a `u8*` (`strcpy`, `itoa`), so its result can be written further. Higher-level string types can be written as classes (with [implicit conversions](#implicit-conversions) from `string`), but the language itself only knows the pointer.
:::

::: Nameless structs as types
`struct { fields }` is a complete type that can be used wherever a type goes, without declaring a name for it first, for example `var cursor: struct { var x: i32; var y: i32; };`. Each such struct is its own type. See [Nested and nameless structs](#nested-structs).
:::

::: Types computed while compiling
A few type forms are computed by the compiler: `value_type(expr)` is the type of a value, and `base_type(T)` and `absolute_base_type(T)` find the classes a class extends. They are mostly useful in templates; see [Type functions](#type-functions).
:::
</script>

<script type="text/x-dsdoc" data-id="literals" data-group="Basics" data-title="Literals">
Literals are the values you write directly in the source: numbers, characters, strings, the two booleans and `null`. Integer literals can be written in decimal, hexadecimal or binary, and underscores can separate groups of digits to keep long numbers readable.

```ds
42   0x2A   0b101010   1_000_000            // integers
123u   0xFFu                                // u: unsigned (a u32)
1.5   2.   1e-3   2.5e+4   3f   0.5f        // f32
'a'   '\n'   '\x41'                         // characters (a u8)
"text"   "two " "parts"                     // strings (adjacent ones are joined)
true   false   null
```

::: The type of an integer literal
An integer literal is an `i32` if it fits in one, and a `u32` if it doesn't (so `0xFFFFFFFF` is a `u32`). With the `u` or `U` suffix, a literal is a `u32` whatever its value, just like `unsigned int` constants in C. This matters for arithmetic: `var h = 2166136261u;` gives `h` the type `u32`, and `x - 1u` stays unsigned instead of becoming signed. C code that uses `u` constants can usually be ported as it is.
:::

::: Characters and escapes
A character literal such as `'a'` is a `u8` holding that character's code. Inside character and string literals you can use these escapes: `\n` (new line), `\t` (tab), `\r` (carriage return), `\0` (zero), `\\`, `\'`, `\"`, and `\xNN` for any byte written in hexadecimal.
:::

::: String literals
A string literal is a `string` (a `const u8*`) pointing at the text, which is stored once in the program with a terminating zero. Two literals written next to each other are joined into one, which helps split long texts over several lines. String literals can also initialize `u8` arrays: `var name: u8[16] = "text";`.
:::

::: Float literals
A number with a decimal point, an exponent, or an `f` suffix is an `f32`: `1.5`, `2.`, `1e-3`, `3f`. There is no 64-bit floating point type in DScript, so there's no separate suffix for doubles. See [Floating point](#floats).
:::
</script>

<script type="text/x-dsdoc" data-id="variables" data-group="Basics" data-title="Variables">
A variable is declared with `var`, a name, a type and optionally a value: `var name: type = value;`. When a value is given, the type can be left out and the compiler takes it from the value. `auto` is a way to say explicitly that the type comes from the value, which some people prefer for readability.

Variables declared at the top level (or inside a namespace) are globals: they exist for the whole run of the program and are set up before `main`. Variables declared inside a sub are locals: they exist from their declaration to the end of the block they're in.

```ds
var count: u32 = 0;
var ratio = 0.5;            // f32, taken from the value
auto name = "dscript";      // string
var buffer: u8[64];
var origin: Point(0, 0);    // built by Point's constructor
```

::: Initial values
A global without a value starts at zero. A local scalar (an integer, float, bool or pointer) without a value is **not** initialized: its content is whatever was in that memory, as in C, so give it a value before reading it. A local struct or array without a value is different: it is zeroed, and then each field gets its default value if the struct declares one. That way structs always start in a known state.
:::

::: auto
`auto x = value;` declares a variable whose type is exactly the value's type. It requires a value, and writing a type as well (`auto x: i32 = 5;`) is an error, because the whole point of `auto` is to say "the value decides". An integer literal gives `i32` (`auto n = 5;`), and `5u` gives a `u32`. `auto` works for locals, globals, `for` loops and static variables, but not for parameters or fields, which always need their type written.
:::

::: Static local variables
A local declared with `static var` lives for the whole program, like a global, but its name is only visible in its block. It is set once, before `main` runs (not at its first use), so its value can't use the sub's locals or parameters, though it can use constants, globals and calls to other subs. A static variable keeps its value between calls, which makes it handy for counters and caches:

```ds
sub next_id() -> u32 {
    static var counter: u32 = 0;
    counter++;
    return counter;
}
```

Each sub, and each lambda, has its own static variables. An inline sub's static variable is shared by all the places where the sub is expanded.
:::

::: Scopes and shadowing
A declaration in an inner block hides one with the same name from an outer block or from the top level: a local can hide a global or a constant, and the other way around. Declaring the same name twice in the same block, however, is an error, because that is almost always a mistake.
:::

::: Constructor calls in declarations
`var p: Point(1, 2);` declares a variable and calls the struct's constructor on it with those arguments. The fields first get their zeroes and default values, then the constructor runs. A variable with a constructor call can't also have a value. See [Constructors](#constructors).
:::
</script>

<script type="text/x-dsdoc" data-id="constants" data-group="Basics" data-title="Constants">
`const` declares something whose value never changes once it is set. DScript makes a useful distinction here: if the value is known while compiling, the constant is a true **compile-time constant**, usable in array sizes, enum values, template arguments and other constants, and it costs nothing at run time. If the value is only known when the program runs (because it calls a sub, for example), the constant is a variable that simply can't be changed after its declaration.

When you want to be sure that a constant is computed while compiling, write `constexpr` instead: the compiler then reports an error if the value isn't a compile-time constant.

```ds
const LIMIT = 10;                       // a compile-time constant
const MASK: u32 = 0xFF;
const VERSION = "1.4";                  // a string constant
const START = read_clock();             // computed when the program runs
constexpr SIZE = 4 * 1024;              // must be known while compiling
constinit g_hits: u32 = SIZE;           // a variable whose initial value is known while compiling
```

::: const parameters, locals and fields
`const` can be written anywhere `var` can: for globals, locals, parameters and struct fields. A `const` parameter (`sub f(const n: u32)`) tells the reader and the compiler that the sub never changes it. A local `const` whose value isn't a compile-time constant is computed each time its declaration runs, for example on every iteration of a loop. For `const` fields of structs, see [Access](#access).
:::

::: constexpr and constinit
`constexpr NAME = value;` is a `const` that must be a compile-time constant. Use it for values that should never cost anything when the program runs, so that a mistake (such as calling a sub that can't be evaluated while compiling) is caught immediately.

`constinit` is meant for globals that do change, but whose initial value must be known while compiling. Such a global is stored in the program with its initial value, so no code runs before `main` to set it up. Changing it later is allowed, unlike a `const`.
:::

::: Struct constants
A `const` with a struct type is a group of compile-time values. Reading one of its fields is like reading a constant, with no memory access involved, so struct constants are a convenient way to group related configuration values:

```ds
const Origin: Point = { 3, 4 };             // the fields in order (the rest: defaults, then 0)
const Layout: struct {                      // no value: the fields' defaults
    var base: u32 = 0x1000;
    var size: u32 = 0x400;
};
const END = Layout.base + Layout.size;      // usable in other constants, array sizes...
```

The fields of a struct constant can be integers, floats, pointers (`null` or `cast<T*>(constant)`) and nested structs, but not arrays or strings, which would need memory. When a struct constant is used as a whole value (copied into a variable, passed to a sub, or when you take its address or call one of its readonly methods), the compiler stores one read-only copy of it in the program and uses that. A struct constant whose values aren't all constants is simply a variable that can't change.
:::

::: String constants
`const NAME = "text";` declares a string constant that is used exactly like the literal: in values, default values, `u8` array initializers and other constants (`const ALSO = VERSION;`). The text is stored once in the program and no code runs to set it up. Because its address is only decided when the program is assembled, it can't be used in integer constant expressions.
:::

::: Constant arrays
`const Name: T[N] = { ... }` (or `T[]`, sized by the value) is an array stored in the program and never written. It's the right way to declare lookup tables, names and similar fixed data:

```ds
const Primes: u16[] = { 2, 3, 5, 7, 11 };
const Names: string[] = { "red", "green", "blue" };
const Table: Entry[] = { { 'a', "alpha" }, { 'b', "beta" } };
```

Assigning to an element of a constant array is an error. If some values are only known when the program runs, a `const` array becomes a constant variable, set before `main` (or, for a local one, each time its declaration runs). `constexpr` arrays must be entirely made of constants.
:::

::: Local constants
A `const` declared in a sub with a compile-time value is stored just like a top-level constant, only with its name visible in its block. `static const` is a `const` whose value is computed once, before `main`, like a static variable, which is useful for values that are expensive to compute but don't change.
:::

::: Constants and pointers
Taking the address of a constant gives a `const` pointer (`&START` is a `const u32*`), so the constant can't be changed through it either. See [Pointers](#pointers).
:::
</script>

<script type="text/x-dsdoc" data-id="enums" data-group="Basics" data-title="Enums">
An enum gives names to a set of related integer constants. Its members are written `Enum.Member`, and each member's value is the previous one plus one, unless you give it a value explicitly.

```ds
enum Color { Red, Green = 5, Blue }         // Red == 0, Green == 5, Blue == 6
enum Kind: u8 { Command, Data = 0x80 }      // a typed enum: its values are u8s

var c: Color = Color.Blue;
var k: Kind = Kind.Data;
```

::: An enum is its integer type
In DScript an enum is not a separate type that needs casts to convert: it is its integer type, `i32` by default, or the type you give after a colon (`enum E: u16 { ... }`, one of `i8`, `i16`, `i32`, `u8`, `u16` and `u32`). Every member's value must fit that type. Because of this, enum members and integers mix freely in both directions: you can store an enum member in an integer, pass an integer where an enum is expected, and use enum members as [switch](#switch) cases on an integer, without writing a single cast.
:::

::: Typed enums and sizes
Giving an enum a type also decides its size: a variable, field or array element of type `Kind` above takes one byte. That's useful when enums are part of binary formats or tightly packed structs.
:::

::: Enums in namespaces and structs
An enum declared in a namespace or in a struct is named from there: `Gfx::Color.Red` or `List::Kind.Empty` from outside, and just `Kind.Empty` inside the struct. Declaring it `priv enum` in a struct makes it usable only by that struct.
:::
</script>

<script type="text/x-dsdoc" data-id="aliases" data-group="Basics" data-title="Aliases">
`alias Name = type;` gives an existing type another name. The alias is the same type, not a new one, so values convert freely between the alias and the original. Aliases are typically used to shorten long types (especially sub pointer types) or to give a meaningful name to a type that may change later.

```ds
alias Handler = sub(i32) -> void;
alias Word = u32;
alias Pair = struct { var key: u8; var value: i32; };
alias Con = Gfx::Console;           // aliases of structs and enums work as them
```

::: Aliases of structs and enums
An alias of a struct or enum behaves exactly like that struct or enum, including its scope. With `alias Con = Gfx::Console;`, you can write `Con::Cell` for a nested type, and `Con::make()` or `Con.make()` for a static sub. With `alias C = Gfx::Color;`, `C.White` is that enum's member.
:::

::: Aliases chosen while compiling
Combined with `if constexpr`, aliases can pick a type depending on a condition: `if constexpr (WIDE) { alias Word = u32; } else { alias Word = u16; }`. See [if constexpr](#if-constexpr).
:::
</script>

<script type="text/x-dsdoc" data-id="namespaces" data-group="Basics" data-title="Namespaces">
A namespace groups declarations under a name, so that names in different parts of a program (or in different libraries) never clash. From outside a namespace, its names are written `Namespace::name`; from inside, they can be used directly.

Namespaces can be nested, and a namespace can be reopened as many times as needed, in any file, to add more declarations to it. `namespace A::B { }` opens a nested namespace in one step.

```ds
namespace Gfx {
    const ROWS = 25;
    enum Color: u8 { Black, White = 15 }
    namespace Text {                            // nested: Gfx::Text
        sub print(var s: string) { ... }
        sub clear(var c: Color = Color.Black) { ... }
    }
}
namespace Gfx::Text {                           // reopened, anywhere
    sub lines() -> i32 { return ROWS; }         // Gfx::ROWS
}

Gfx::Text::print("hi");
var c: Gfx::Color = Gfx::Color.White;
```

::: How names are looked up
A name is looked up starting from the innermost namespace and moving outwards, then globally. Inside `Gfx::Text`, `print` finds `Gfx::Text::print` first, then `Gfx::print`, then a global `print`. When an inner namespace has a name that hides a global one, `::name` refers explicitly to the global one.
:::

::: :: for scopes, . for values
DScript uses `::` to go into scopes (namespaces, a struct's static subs and nested types) and `.` to reach values (enum members, the fields of struct constants, a struct's static members). That's why an enum member in a namespace is written `Gfx::Color.White`: `Gfx::Color` is the enum's scope, and `.White` its member.
:::

::: What a namespace can hold
Any top-level declaration can go in a namespace: subs, globals, constants, enums, aliases, structs, classes, interfaces, templates and other namespaces. A namespace and another declaration can't share the same full name. There is no `using namespace` statement; names from other namespaces are always written with their scope.
:::
</script>

<script type="text/x-dsdoc" data-id="pointers" data-group="Basics" data-title="Pointers">
A pointer `T*` holds the address of a `T`. As in C, `&x` takes the address of a variable, `*p` reads or writes the value a pointer points at, and `p->field` reaches a struct's field through a pointer to the struct. `null` is the pointer that points at nothing, and converts to every pointer type.

```ds
var n: i32 = 5;
var p: i32* = &n;
*p = 7;                     // n is now 7
var q: void* = p;           // void* takes any pointer...
var r: i32* = q;            // ...and converts back to any pointer
var none: Point* = null;
```

::: Pointer arithmetic
Adding an integer to a pointer moves it by that many elements, not bytes: if `p` is an `i32*`, `p + 2` points 8 bytes further. Subtracting two pointers gives the number of elements between them, and `p[i]` means `*(p + i)`. This works the same way as in C, and it's how arrays are traversed through pointers.
:::

::: const pointers
`const T*` is a pointer through which the value can't be changed, although the pointer itself can point elsewhere. It's important to see where `const` goes: written before a declaration's name, it's about the variable; written in a type, it's about what the pointer points at.

```ds
var p: const u8* = text;    // *p = 'x' is an error; p = other is fine
const q: u8* = buffer;      // *q = 'x' is fine; q = other is an error
const r: const u8* = text;  // neither is allowed
```

A `T*` converts to a `const T*` automatically, since adding a restriction is always safe, but going back to `T*` needs a cast. Through a `const T*`, `*p`, `p[i]` and `p->field` can't be changed. As in C, the protection is one level deep: a pointer field reached through a const pointer can still point at something changeable. Taking the address of something that can't change (a constant, a const or readonly field, a value reached through a const pointer) gives a `const` pointer.
:::

::: void pointers
`void*` points at memory of an unknown type. Any pointer converts to `void*` and back without a cast, which makes it suitable for generic memory routines. A `void*` can't be dereferenced or indexed directly: convert it to a typed pointer first.
:::

::: Pointers to pointers and to subs
Pointers can point to pointers (`u8**`, `Point**`), and `const u8**` is a pointer to a `const u8*`. Pointers to subs have their own type syntax, `sub(i32) -> i32`; see [Lambdas and sub pointers](#lambdas).
:::

::: References as an alternative
For parameters and results, DScript also has references: `ref T` refers to a value without writing `&` at the call and `*` in the sub. They're often clearer than pointers when a sub just needs to change or read an argument without copying it. See [References](#references).
:::
</script>

<script type="text/x-dsdoc" data-id="arrays" data-group="Basics" data-title="Arrays and initializers">
An array `T[N]` holds `N` values of type `T` next to each other in memory. Elements are reached with `a[i]`, counting from zero, and an array converts to a pointer to its first element wherever a pointer is expected, so arrays and pointers work together the way they do in C.

```ds
var a: i32[5] = { 1, 2, 3 };            // the remaining elements are 0
var grid: u8[4][8];                     // 4 rows of u8[8]
var name: u8[16] = "text";
var primes: u16[] = { 2, 3, 5 };        // 3 elements, counted from the value
sizeof(a)                               // 20 bytes
```

::: Initializer lists
A list in braces initializes arrays and structs, and lists can be nested for arrays of structs or structs containing other structs:

```ds
var p: Point = { 10, 20 };
var q: Point = { 5 };                   // q.y gets its default value
var r: Rect = { { 1, 2 }, { 5, 6 } };
var rows: Point[2] = { { 1, 2 }, { 3, 4 } };
```

Values are taken in order. Elements or fields that the list doesn't mention get their default value if they have one, or zero. Outside a struct, a list can only set the fields that come before the struct's first private field, so private state can't be set from outside.
:::

::: Strings in arrays
A string literal can initialize an array of `u8` or `i8`: `var buf: u8[16] = "text";` copies the text and fills the rest with zeros. The text must fit; the terminating zero may be left out only when the text fills the array exactly. With `u8[]`, the array is sized to fit the text and its zero.
:::

::: Multidimensional arrays
`u8[4][8]` is an array of 4 elements, each of which is a `u8[8]`. Sizes read from left to right in the declaration, and `grid[2][5]` is the sixth element of the third row. The total size is the product of the sizes times the element size.
:::

::: Arrays and subs
Arrays are passed to subs as pointers: a parameter is written `var a: i32*` (with the length passed separately if the sub needs it), and an array argument converts to that pointer automatically. Arrays can't be assigned as a whole either. Structs behave differently: they're passed and assigned by value. If you need to pass an array by value, wrap it in a struct. See [Structs by value](#struct-values).
:::

::: Looping over arrays
`for (auto v in values)` goes through every element of an array, and `for (auto& v in values)` gives a pointer to each element so the loop can change them. See [for-in loops](#forin).
:::
</script>

<script type="text/x-dsdoc" data-id="expressions" data-group="Basics" data-title="Operators and expressions">
DScript has C's operators with C's precedence, so expressions read and evaluate the way a C programmer expects. In addition, the words `and`, `or` and `not` can be used for `&&`, `||` and `!`, which some find easier to read in long conditions.

| Precedence (high to low) | Operators |
|---|---|
| postfix | `a(b)` `a[i]` `s.f` `p->f` `x++` `x--` |
| unary | `-` `!` `not` `~` `*` `&` `++x` `--x` `cast<T>()` `sizeof` |
| multiplicative | `*` `/` `%` |
| additive | `+` `-` |
| shift | `<<` `>>` |
| comparison | `<` `<=` `>` `>=` |
| equality | `==` `!=` |
| bitwise | `&`, then `^`, then `\|` |
| logical | `&&` / `and`, then `\|\|` / `or` |
| conditional | `?:` |
| assignment | `=` `+=` `-=` `*=` `/=` `%=` `&=` `\|=` `^=` `<<=` `>>=` |

::: How integer arithmetic works
Integer arithmetic is done on 32 bits. Before an operation, smaller integers are widened to 32 bits (`i8` and `i16` keep their sign, unsigned types are zero-extended), and the result is a `u32` if either operand is a `u32`, an `i32` otherwise. When the result is stored into a smaller type, it is truncated to fit. Division, remainder, right shift and comparisons are unsigned when the operands are `u32` (or pointers), and signed otherwise, so the type of your operands decides how negative values behave.
:::

::: Logical operators short-circuit
`&&` and `||` (and their word forms `and` and `or`) evaluate their right side only when needed: in `p != null && p->ready`, the second part runs only if `p` isn't null. This is why they can't be overloaded for structs: an overloaded operator would always evaluate both sides.
:::

::: sizeof
`sizeof(x)` gives the size in bytes of a type or of a value's type, and `sizeof<T>` is another way to write it for types. Both are `u32` compile-time constants, so they can be used in array sizes and other constants.
:::

::: Casts
DScript has four casts: `cast<T>(v)` for ordinary conversions, `bitcast<T>(v)` to reinterpret the bits of a value, `static_cast<T>(v)` for conversions within a class hierarchy, and `dynamic_cast<T*>(p)` for checked conversions down a hierarchy. See [Conversions and casts](#conversions).
:::

::: Operators on structs
Structs can be assigned and passed by value, and with [operator overloading](#operators) any of the operators above (except the logical ones, `&` and `?:`) can be given a meaning for a struct or class.
:::

::: Ranges
`a..b` describes the numbers from `a` up to `b - 1`. It isn't a general expression, but it appears in [for-in loops](#forin) and in [switch](#switch) cases.
:::
</script>

<script type="text/x-dsdoc" data-id="conversions" data-group="Basics" data-title="Conversions and casts">
Some conversions are so common and so safe that the compiler does them on its own: between integer types, from integers to floats, from `null` to any pointer, and from a class to a class it extends. Everything else requires a cast, which makes the conversion visible in the code.

```ds
var w: u32 = byte;                      // integer types convert freely
var f: f32 = count;                     // integers convert to f32
var p: Point* = null;
var n = cast<i32>(f);                   // f32 to integer: truncates
var bits = bitcast<u32>(1.0f);          // 0x3F800000: the same bits
var d = static_cast<Dog*>(animal);      // down a class hierarchy (unchecked)
var c = dynamic_cast<Cat*>(animal);     // checked: null if it isn't a Cat
```

::: Implicit conversions
These conversions happen automatically wherever a value of another type is expected:
- between integer types and enums (the value is truncated or extended as needed), and from integers to `f32`;
- from `null` (and the constant `0`) to any pointer, from arrays to pointers to their elements, between `void*` and any pointer, and from `T*` to `const T*`;
- from a class pointer to a pointer to a class it extends or an interface it implements;
- user-defined conversions: [implicit constructors and operator cast](#implicit-conversions).
:::

::: cast<T>
`cast<T>(v)` converts between integers, `f32`, pointers and sub pointers, but not between `f32` and pointers, which would be meaningless. Converting an `f32` to an integer truncates toward zero and saturates: values out of range become the type's nearest limit, and NaN becomes 0. `cast<bool>(f)` is the same as `f != 0.0`. `cast<T*>(constant)` makes a constant address, which can even be a field's default value. For structs, `cast<T>` uses the struct's conversions (its `operator cast`), and `cast<S>(value)` builds an `S` from the value with one of its constructors.
:::

::: bitcast<T>
`bitcast<T>(v)` reads the same bits as a value of another type, without converting anything: `bitcast<f32>(0x3F800000)` is `1.0`, and `bitcast<u32>(1.0f)` is `0x3F800000`. Both types must have the same size. It works for integers, `f32`, pointers, sub pointers, and even structs and arrays as values (`bitcast<u32>(pixel)`, `bitcast<Pixel>(0xAABBCCDDu).r`). It can't produce an array or a `bool`, because a bool built from arbitrary bits might be neither true nor false. The first byte of a struct or array is the most significant one. Bitcasts of constants are constants.
:::

::: static_cast<T>
`static_cast<T>(v)` performs any conversion that would happen automatically, converts numbers to numbers, and converts a class pointer down its hierarchy: from a base class to a derived class, or from an interface to the class that implements it. It doesn't check that the object really is of that class; when you're not sure, use `dynamic_cast`. A plain `cast<>` between pointers to related classes is an error, because the classes' parts aren't always at the same address and only `static_cast` knows how to adjust the pointer.
:::

::: dynamic_cast<T*>
`dynamic_cast<T*>(p)` asks the object itself what it is, and gives a pointer to its `T` part, or `null` if it isn't a `T`. `T` can be any class up the object's chain of classes or any interface it implements, which also makes it possible to go from one interface to another. The pointer must point at a class with virtual subs or interfaces, because the information comes from the object's table. See [Casts between classes](#class-casts).
:::
</script>

<script type="text/x-dsdoc" data-id="floats" data-group="Basics" data-title="Floating point">
`f32` is an IEEE 754 single precision floating point number. It supports the arithmetic operators and comparisons, integers convert to it automatically, and float expressions with constants are computed while compiling.

```ds
var f: f32 = 1.5;
var g = f * 2 + 1;              // 4.0: the integers convert to f32
var i = cast<i32>(g / 3.0f);    // 1: the conversion truncates
```

::: Operators on floats
Floats support `+`, `-`, `*` and `/` (dividing by zero gives an infinity rather than an error), unary `-`, all the comparisons, `!`, `&&`, `||`, `?:`, `++` and `--` (which add or subtract 1.0), and the compound assignments `+=`, `-=`, `*=` and `/=`. The remainder operator, the bitwise operators and shifts don't apply to floats.
:::

::: Comparisons and conditions
Comparisons follow IEEE 754: every comparison involving NaN is false, except `!=`, which is true, and `-0.0 == 0.0` is true. Used as a condition, an `f32` is true unless it is `0.0` or `-0.0`; NaN counts as true.
:::

::: Conversions to and from integers
Integers convert to `f32` automatically, in arithmetic, assignments and arguments. Going from `f32` to an integer requires a `cast`, because it loses information: the value is truncated toward zero, out-of-range values saturate at the type's limits, and NaN gives 0. When an overloaded sub is called with an integer argument, the compiler prefers the integer overload over the float one.
:::

::: Constants and bits
Expressions made of constants are computed while compiling, also for floats (`const HALF: f32 = 1.0 / 2;`), in struct constants and in default values. To look at or build a float's bits, use `bitcast<u32>(f)` and `bitcast<f32>(bits)`.
:::
</script>

<script type="text/x-dsdoc" data-id="control" data-group="Control flow" data-title="if, loops and blocks">
DScript's control flow statements are C's: `if` and `else`, `while`, `do ... while`, and the three-part `for` loop. On top of those there are the [for-in loop](#forin) over ranges, [switch](#switch) (also as a value), [defer](#defer), [errors](#errors) (`throws`, `try`, `catch`), and `if constexpr`, which decides between branches while compiling.

```ds
if (n > 0) { ... } else if (n < 0) { ... } else { ... }
while (running) { ... }
do { ... } while (again);
for (var i: u32 = 0; i < count; i++) { ... }
for (auto x in 0..10) { ... }           // see for-in loops
```

::: What can be a condition
A condition can be an integer or a `bool`, a pointer (true when it isn't null), an `f32` (true when it isn't zero), or a struct that has an implicit conversion to `bool` (see [Implicit conversions](#implicit-conversions)). As in C, there's no need to compare with zero explicitly.
:::

::: break and continue
`break` leaves the innermost loop, or the innermost `switch`. `continue` jumps to the next iteration of the innermost loop (for a `for` loop, it runs the step first). Both of them run the [defers](#defer) and the destructors of the blocks they leave, so resources are released correctly however a loop is exited.
:::

::: Blocks and scopes
Braces make a block, and a block is also a scope: the locals declared in it exist until its closing brace, where their destructors run if they have any. The variable declared in a `for` loop's first part belongs to the loop and ends with it.
:::

::: return
`return value;` ends the sub and gives its result; `return;` ends a sub without a result. The value is computed first, and only then do the defers and destructors of the sub's blocks run, so the returned value can safely use locals that are about to be destroyed.
:::

::: if constexpr
`if constexpr (condition)` is evaluated while compiling: only the chosen branch is compiled, and the other branch isn't even checked. It's mainly used in templates, where a branch may use features that some instances don't have. See [if constexpr](#if-constexpr).
:::
</script>

<script type="text/x-dsdoc" data-id="forin" data-group="Control flow" data-title="for-in loops and ranges">
`for (auto x in range)` runs its body once for every element of a range. A range can be a span of numbers written `a..b`, an array, or any struct that provides a small set of methods (begin, end, next, get), which makes your own containers usable in for-in loops.

```ds
for (auto i in 0..10) { }          // 0 to 9 (the end is excluded); i is an i32
for (auto i in 0..count) { }       // i has count's type
for (auto v in values) { }         // an array: v is a copy of each element
for (auto& v in values) *v *= 2;   // v is a pointer to each element
for (var p: Point in points) { }   // the element's type written out
for (auto item in list) { }        // a struct that is a range
```

::: Copies and pointers
With `auto x`, the loop variable is a copy of each element, so changing it doesn't change the range. With `auto& x`, it is a pointer to the element, which lets the loop change elements in place (`*x = ...`, or `x->field` for structs). `for (var x: T in range)` and `for (var x: T* in range)` write the type explicitly instead.
:::

::: Number ranges
`a..b` goes from `a` up to `b - 1`; the end is excluded, so `0..count` visits exactly `count` values. Both ends are evaluated once, before the loop starts, and the loop variable has their integer type. The same half-open ranges are used in [switch](#switch) cases.
:::

::: Making a struct a range
A struct is a range when it has these methods, where the cursor `C` is any integer or pointer (an index, a node pointer, ...) and `T` is the element type:

```ds
sub begin() -> C            // the cursor of the first element
sub end() -> C              // the cursor one past the last (compared with !=)
sub next(var c: C) -> C     // the cursor after c
sub get(var c: C) -> T*     // a pointer to the element at c
```

For example, a linked list can be traversed with node pointers, ending at `null`:

```ds
struct Chain {
    var head: Node*;
    inline sub begin() -> Node* { return this->head; }
    inline sub end() -> Node* { return null; }
    inline sub next(var n: Node*) -> Node* { return n->next; }
    inline sub get(var n: Node*) -> Item* { return &n->item; }
}
```

When the cursor is itself a pointer to the elements (`begin()` and `end()` return `T*`), `next` and `get` can be left out: the loop uses `c + 1` and `c`.
:::

::: How the loop runs
A for-in loop is compiled as an ordinary `for` loop over the cursor: the range is evaluated once, `end()` is evaluated once, and `break` and `continue` work as usual. With inline methods, it costs about what a handwritten loop would. The range methods can be `priv`: a for-in loop can still use them while other code can't, which lets a container hand out cursors only through loops.
:::

::: in is not a keyword
`in` only has a meaning inside a for-in loop's parentheses, so it can still be used as a name everywhere else.
:::
</script>

<script type="text/x-dsdoc" data-id="switch" data-group="Control flow" data-title="switch">
`switch` chooses which block to run depending on a value. Each case lists the values it handles, case values are known while compiling, and each case has its own block. By default a case ends the switch when its block ends, so there's no accidental fallthrough of the kind that causes so many bugs in C. If you want C's behavior, write `fall` after the value.

```ds
switch (key) {
    is 'q' or 27 { quit(); }                // several values
    is 'a'..'z' + 1 { letter(key); }        // a range (end excluded)
    is Keys.Enter { enter(); }              // constants, enum members, constexpr calls
    else { other(); }                       // when no case matches
}
```

::: fall: C-style fallthrough
With `fall`, a case runs into the next case's block when it ends, unless it uses `break`:

```ds
switch (n) fall {
    is 1 { setup(); }                       // then continues into is 2's block
    is 2 { run(); break; }                  // break stops here
    else { idle(); }
}
```

Because every case has its own block, the locals of one case end at its closing brace, even when execution continues into the next case. This removes the classic C problem of variables declared in one case being visible, but uninitialized, in the next.
:::

::: Case values
The values of a case can be literals, constants, enum members, or calls to constexpr or consteval subs. A constexpr call that can't be computed while compiling is an error. Each value must be a valid value of the switched type (`is 300` on a `u8` is an error), and a value can appear in only one case; overlapping ranges are errors too. The word `or` separates a case's values, so a value is an expression without `||` or `or`: if you really need one, put it in parentheses.
:::

::: The switched value
The value of a switch can be an integer, a character, a `bool` or an enum. Since enums are their integer type, enum members and integers mix freely: `switch (n) { is Color.Red { } }` works on an integer `n`, and integer cases work on an enum value, without casts.
:::

::: else
`else` handles every value that no case lists. It must be the last case. Without `else`, values that no case handles simply skip the switch.
:::

::: break and continue inside a switch
`break` leaves the switch, as in C. `continue` belongs to the loop around the switch, if there is one, and goes to that loop's next iteration.
:::

::: Switching on enums without else
When every case value of a switch is a member of the same enum and there is no `else`, the compiler warns about the enum's members that no case handles. This catches the common mistake of adding a member to an enum and forgetting to handle it in a switch.
:::

::: How a switch is compiled
The compiler chooses the best code for each switch. A few values are compared one after the other. When the values are dense (they fill at least half of the range between the smallest and the largest), the switch jumps through a table, which takes the same time whatever the value. Sparse values are found with a binary search. Switches also work inside constexpr subs.
:::

::: is and fall are not keywords
`is` and `fall` only mean something inside a switch, so they remain usable as names everywhere else.
:::

::: switch as a value
Where an expression is expected, a switch gives a value: each case writes its value after `=>`, and the cases are separated by commas.

```ds
var name: string = switch (c) {
    is Color.Red => "red",
    is Color.Green or Color.Blue => "cool",
};                                          // every member of the enum: no else needed

var width: i32 = switch (ch) {
    is 'a'..'z' + 1 => 1,
    is '\n' => { return 0; },               // a block instead of a value: it must leave
    else => -1
};
```

The values must have one type, with the same rules as the two values of `?:`: numbers of different types give the wider type, two pointers must point at the same type, and `null` goes with any pointer. Struct values work too, as long as every case gives the same struct. Instead of a value, a case can have a block, which must leave at its end with `return`, `throw`, `break` or `continue`; `break` and `continue` belong to the loop around the switch.

A switch used as a value needs `else`, unless its cases cover every member of an enum (a value that is none of them gets the last case's value). It can't use `fall`, and unlike a switch statement it isn't evaluated inside constexpr subs.
:::
</script>

<script type="text/x-dsdoc" data-id="defer" data-group="Control flow" data-title="defer">
`defer statement` schedules a statement to run when the block it's in is left, whichever way it is left: by reaching its end, by `return`, by `break` or by `continue`. Several defers in the same block run in the reverse order of their declaration. This keeps cleanup code next to the code that needs it, instead of repeating it before every exit.

```ds
sub copy(var path: string) -> i32 {
    var f: File* = open(path);
    defer close(f);                 // runs on every way out of the sub
    if (f->size == 0)
        return 0;                   // close(f) runs here
    for (var i: u32 = 0; i < f->size; i++) {
        var b: u8* = alloc(16);
        defer release(b);           // runs at the end of every iteration
        ...
    }
    return 1;                       // and here
}
```

::: When the deferred code runs
On `return x;`, the value `x` is computed first, then the defers run, and then the sub returns, so a defer can release something the return value was computed from. A defer sees the variables declared before it, with the values they have when the defer runs (not when it was declared).
:::

::: Rules
`return`, `break` and `continue` can't be used to jump out of a deferred statement. A defer can't be the whole body of an `if` or a loop on its own, because it would end immediately; put it in a block: `if (c) { defer ...; }`. The deferred code is generated at every exit of its block, so a long defer in a sub with many returns makes the sub bigger; for long cleanup, call a sub from the defer.
:::

::: Defers and destructors
Locals that have [destructors](#destructors) are destroyed in exactly the same way, as if a defer calling their destructor had been written right after their declaration. Defers and destructors interleave correctly: everything runs in the reverse order of declaration.
:::
</script>

<script type="text/x-dsdoc" data-id="errors" data-group="Control flow" data-title="Errors: throws, try, catch">
A sub that can fail says so in its signature with `throws E`, where `E` is an enum whose members are the errors. Every call of such a sub must handle the error right where the call is, and the compiler checks it. There are no exceptions flying around: an error is returned to the caller, and the caller decides.

```ds
enum ParseError { Empty, BadDigit };

sub parse(var s: string) -> u32 throws ParseError {
    if (s[0] == 0)
        throw ParseError.Empty;             // leaves the sub: defers and destructors run
    ...
    return n;
}

sub sum(var a: string, var b: string) -> u32 throws ParseError {
    return try parse(a) + try parse(b);     // try: an error is thrown on to our caller
}

var n: u32 = parse(s) catch 0;              // a value to use when it fails
var k: i32 = parse(s) catch (e) switch (e) { is ParseError.Empty => -1, else => -2 };
var m: u32 = parse(s) catch (e) {           // a block, with the error
    log(e);
    return 0;                               // (it must leave: the call has a value)
};
save(file) catch { retry(); }               // no value: the block can just end
```

::: throws
`throws E` comes after the result type (`-> T throws E`), or after the parameters when there is no result (`sub save() throws E`). It works for methods, virtual subs (an override must throw the same errors), lambdas and sub types (`sub(string) -> u32 throws E`). It is part of the sub's type, so a sub pointer's type must say it too. Constructors, destructors, operators, interrupt subs, `main`, constexpr and consteval subs can't throw, and neither can a sub that returns a reference.
:::

::: throw
`throw x;` leaves a sub that throws with the error `x`, which converts to the enum (normally `throw E.Member;`). Just like `return`, it destroys the sub's temporaries, runs its defers and destructors, and destroys its `own` parameters on the way out. It can't be used inside a defer.
:::

::: try
`try f(...)` passes an error on: when the call fails, the sub it's written in fails with the same error. That sub must throw the same enum. When the error goes through, the temporaries of the expression being computed are destroyed too, so `make().size() + try parse(s)` doesn't leak the result of `make()`.
:::

::: catch
`f(...) catch value` gives a value to use when the call fails. The value converts to the call's type, which can also be a struct. `catch (e) value` names the error first: `e` is a constant of the enum's type.

`catch` binds tightly: its value is a single operand, such as `catch -1`, `catch (e) (x + 1)` or `catch switch (e) { ... }`. This way `parse(s) catch 0 == 5` compares the result with 5, as it reads. `catch (e)` names the error only when the value that follows doesn't start with an operator, so a negative value is written `catch (e) (-1)`.

`f(...) catch { ... }` and `catch (e) { ... }` run a block when the call fails. If the call has a value, the block must leave at its end with `return`, `throw`, `break` or `continue`, since there would be no value to go on with. For a call without a value, the block can end normally, and the code continues after the call. A statement that ends with a catch block doesn't need a `;` after it.
:::

::: What it costs
The caller clears an 8-byte error slot in its frame and passes its address to the sub as a hidden argument. A sub that fails writes the error there and a 1, and the caller checks that 1 right after the call. That's all: there are no tables and no stack unwinding, and errors work the same in the BIOS, the kernel and user programs.
:::
</script>

<script type="text/x-dsdoc" data-id="subs" data-group="Subs" data-title="Subs">
A sub is DScript's function: `sub name(parameters) -> result { body }`. Parameters are written like variable declarations, the result type comes after an arrow, and a sub without `-> type` returns nothing. Subs can be overloaded, have default values for their parameters, be called before they are declared, and be stored in sub pointers.

```ds
sub add(var a: i32, var b: i32) -> i32 { return a + b; }
sub greet(var name: string, var times: u32 = 1) { ... }    // a default value
sub later(var x: i32) -> i32;                               // a declaration only

greet("Ada");               // times is 1
greet("Ada", 3);
```

::: Parameters
Each parameter is written `var name: type`, or `const name: type` when the sub promises not to change it; the word `var` can be left out. Parameters can be integers, floats, bools, pointers, sub pointers, structs (which are passed by value: the sub gets its own copy, see [Structs by value](#struct-values)) and [references](#references). Arrays are passed as pointers.
:::

::: Default values
A parameter with a default value can be left out by the caller. Once a parameter has a default, the parameters after it need one too, so that arguments can be matched from left to right. Default values are constants: numbers, constant expressions, enum members, `null` or string literals.
:::

::: Declarations without a body
`sub later(var x: i32) -> i32;` declares a sub whose body is somewhere else, later in the source or in a library. Because DScript lets you use anything before its declaration, you rarely need this; it's mainly useful to document an interface at the top of a file.
:::

::: Results
A sub can return an integer, float, bool, pointer, sub pointer, struct (by value: the caller gets a new value) or a [reference](#references). Large structs are returned efficiently: the caller provides the space for the result, and returning a local moves it there without copying.
:::

::: The kinds of subs
Beyond plain subs, DScript has [overloads](#overloading) (one name, several parameter lists), [inline subs](#inline) (expanded at each call), [variadic subs](#variadic) (taking any number of extra arguments), [constexpr and consteval subs](#constexpr-subs) (computed while compiling), [lambdas](#lambdas) (subs written as values), and the methods of [structs](#methods) and [classes](#classes).
:::
</script>

<script type="text/x-dsdoc" data-id="overloading" data-group="Subs" data-title="Overloading">
Several subs can share the same name as long as their parameters differ. When you call an overloaded name, the compiler picks the sub whose parameters fit the arguments best, so one name can handle several types naturally.

```ds
sub show(var n: i32) { ... }
sub show(var s: string) { ... }
sub show(var p: Point) { ... }

show(42);   show("hi");   show(origin);
```

::: How the best sub is chosen
For each candidate, the compiler looks at how each argument converts to its parameter. An exact type is best; then comes widening with the same signedness (`u16` to `u32`); then other integer conversions; then integer to `f32`. For class pointers, the nearest base class is better than one further up the hierarchy. User-defined conversions ([implicit constructors and operator cast](#implicit-conversions)) come after all the built-in ones. The candidate with the best conversions wins; if two candidates are equally good, the call is ambiguous and the compiler asks you to add a cast.
:::

::: Overloads and sub pointers
When an overloaded name is used as a value, such as when assigning it to a sub pointer, the pointer's type decides which overload is meant: `var f: sub(u8) -> i32 = twice;` takes the `twice` that has a `u8` parameter.
:::

::: Variadic subs and default values
A sub that takes the arguments as they are wins over a variadic sub that would put them in its `...`. Parameters with default values count as given when they're left out.
:::

::: Overloads in templates
Overloaded subs in one template are distinguished by their arguments, including their number, even when the template's parameters are given explicitly: `pick<u32>(1, 2)` and `pick<u32>(1, 2, out)` call different subs.
:::
</script>

<script type="text/x-dsdoc" data-id="references" data-group="Subs" data-title="References">
A reference, written `ref T` in a parameter or result type, refers to a `T` that lives somewhere else. The sub works directly on the caller's value, without a copy and without the `&` and `*` that a pointer would need. `const ref T` is the read-only version, which also accepts plain values, making it the natural way to pass big structs without copying them.

```ds
sub bump(var x: ref i32) { x++; }                   // changes the caller's variable
sub area(var r: const ref Rect) -> u32 { ... }      // no copy, and r can't change
sub at(var i: u32) -> ref i32 { return g_cells[i]; }

var n: i32 = 1;
bump(n);                    // n is now 2 (no & needed)
area(Rect.new(2, 3));       // const ref also takes values
at(4) = 7;                  // the call is what it refers to
```

::: What a ref T parameter takes
A `ref T` parameter takes a variable of type `T`, or of a class derived from `T`: something in memory that may be changed, such as a variable, a field, an array element, `*p`, or another reference. Literals, call results and constants are errors, because changing them would make no sense; the error message suggests `const ref` when that's what you need.
:::

::: What a const ref T parameter takes
A `const ref T` parameter takes everything a `ref T` takes, plus constants and values: literals, call results, `T.new(...)`, and anything that converts to `T`. When the argument is a value rather than something in memory, it is placed in a temporary that lives until the end of the statement, and the reference refers to that temporary.
:::

::: Using a reference in the sub
Inside the sub, a reference parameter behaves exactly as the `T` it refers to. Reading it reads the caller's value, assigning it (`x = 5`) changes the caller's value, `&x` gives the caller's address, and calling methods on it works as usual. For a class, virtual subs called through a reference run the object's own version, just as through a pointer.
:::

::: Returning references
A sub returning `ref T` gives back what the result refers to, so the call can be assigned, changed and have its address taken. This is what makes `sub operator[](var i: u32) -> ref T` work for `a[i] = x`. The result must refer to something that still exists after the sub returns: a global, a field reached through `this` or a pointer, `*p`, or a reference parameter. Returning a reference to a local, a by-value parameter or a computed value is an error, because it would refer to something that no longer exists.
:::

::: References and class hierarchies
A `ref Base` parameter takes an object of any class derived from `Base`, either through `ex` or through `impl`, and refers to the object's `Base` part. Virtual subs called through it run the object's own versions.
:::

::: How references work, and their limits
Underneath, a reference is passed as a pointer, so it costs the same as passing a `T*`. `ref T` and `T*` are still different parameter types, which matters for overloads and for sub pointer types (`sub(ref i32)`). Templates deduce `T` from the argument of a `ref T` parameter. References exist only as parameters and results: there are no reference variables, reference fields or arrays of references, and reference parameters can't have default values. `ref` is a keyword only in types, so it can still be used as a name.
:::
</script>

<script type="text/x-dsdoc" data-id="lambdas" data-group="Subs" data-title="Lambdas and sub pointers">
A sub pointer is a value that holds a sub, so that code can decide at run time which sub to call. A lambda is a sub written directly where a value is expected, without a name; its value is a sub pointer. Together they let you pass behavior around: callbacks, comparison functions, tables of handlers.

```ds
var op: sub(i32, i32) -> i32 = add;                     // a named sub
var twice = sub(var x: u32) -> u32 { return x * 2; };   // a lambda
map(values, 3, sub(var x: u32) -> u32 { return x * x; });
var n = sub(var a: i32, var b: i32 = 10) -> i32 { return a * b; }(4);   // called right away: 40
op(1, 2);                                               // calls add
```

::: Sub pointer types
A sub pointer's type is written `sub(T1, T2) -> R`, or without `-> R` for a sub that returns nothing. An array of sub pointers needs parentheses around the element type: `(sub(i32) -> i32)[4]`. A sub's name and `&name` both give its pointer. Struct fields can hold sub pointers and can even have a sub as their default value: `var area: sub(Shape*) -> u32 = square_area;`.
:::

::: Lambdas
A lambda's parameters, default values and result work exactly as in a named sub. A lambda is compiled like any other sub, so it costs nothing more than one. It can be stored, passed as an argument, or called immediately where it's written.
:::

::: Lambdas don't capture
A lambda can use globals, constants, other subs and its own parameters, but not the local variables or parameters of the sub it is written in: there are no closures. Trying to use one is an error that suggests passing it as a parameter instead. A lambda can, however, use the constants and static variables of the sub around it, since those don't depend on a particular call.
:::

::: Methods as sub pointers
A method can be used as a sub pointer too: `Counter::add` is a sub whose first parameter is the struct pointer (`this`), so its type is `sub(Counter*, i32) -> i32`.
:::
</script>

<script type="text/x-dsdoc" data-id="inline" data-group="Subs" data-title="inline subs">
An `inline sub` behaves exactly like a normal sub, but every direct call to it is replaced by a copy of its body. There's no call and no return: the arguments are copied into hidden locals of the caller, and the body runs in place. This removes the cost of calling for small subs that are used often.

```ds
inline sub square(var x: i32) -> i32 { return x * x; }
var y = square(a + 1);      // the parameter is a copy: a doesn't change
```

::: When inline helps
Inline subs suit small, frequently called helpers: accessors, tiny calculations, wrappers. Since every call adds a copy of the body to the program, making big subs inline mostly makes the program bigger without making it noticeably faster.
:::

::: Inline subs as values
When an inline sub is used as a sub pointer, or called through a class's table because it's virtual, it also gets a real compiled copy that can be called normally. Otherwise it has no code of its own, although the compiler still checks its body.
:::

::: Restrictions
An inline sub can't call itself, directly or through other inline subs, because expanding it would never end. `main` can't be inline. The compiler can also be told to treat every inline sub as a normal one, which makes the generated code easier to follow in a debugger (see [Compiler options](#tc-options)).
:::
</script>

<script type="text/x-dsdoc" data-id="variadic" data-group="Subs" data-title="Variadic subs">
A sub whose parameter list ends with `...` accepts any number of additional arguments of any scalar type, like `printf` in C. With `...typed`, the type of each additional argument is passed along too, so the sub can handle them correctly without relying on a format string.

```ds
sub sum(var count: u32, ...) -> i32 {
    var total: i32 = 0;
    var arg: i32* = cast<i32*>(va_start());
    for (var i: u32 = 0; i < va_count(); i++)
        total += *(arg - i);        // each argument is 4 bytes below the previous one
    return total;
}

sum(3, 10, 20, 30);                 // 60
```

::: Reading the extra arguments
Three built-ins, usable only inside the variadic sub itself, describe the extra arguments. `va_count()` is how many extra arguments the call passed. `va_start()` is the address of the first one; each following argument is 4 bytes lower in memory. With `...typed`, `va_types()` is the address of their type codes, laid out the same way, with these values: Bool 1, I8 2, U8 3, I16 4, U16 5, I32 6, U32 7, F32 8, Pointer 9, String 10, Sub 11. All three built-ins return `u32`. Libraries usually wrap them in a more convenient argument reader.
:::

::: How extra arguments are passed
Each extra argument takes one 32-bit slot. Integers smaller than 32 bits, and bools, are widened (signed ones to `i32`, unsigned ones to `u32`), an `f32` is passed as its bits, arrays are passed as pointers, and structs can only be passed by pointer. Passing an overloaded sub's name requires a cast, so the compiler knows which overload is meant.
:::

::: Rules
When a non-variadic overload fits the arguments, it is chosen over a variadic one. Sub pointer types can be variadic too: `sub(string, ...typed) -> u32`. Variadic subs can't have default values, can't be inline, and `main` can't be variadic. Methods and lambdas can be.
:::
</script>

<script type="text/x-dsdoc" data-id="constexpr-subs" data-group="Subs" data-title="constexpr and consteval subs">
A `constexpr sub` is computed by the compiler whenever all its arguments are compile-time constants: the call is replaced by its result, and no code runs at all. With arguments that aren't constants, it's an ordinary call. A `consteval sub` goes further: it is always computed while compiling (it's an error if that's not possible) and has no code in the program. This lets you compute tables, sizes and configuration values with real code instead of macros.

```ds
constexpr sub fact(var n: u32) -> u32 { return n <= 1 ? 1 : n * fact(n - 1); }
consteval sub mask(var bits: u32) -> u32 { return (1u << bits) - 1; }

var table: u8[fact(4)];                 // an array size: 24
constexpr ORIGIN: Point = make(3, 4);   // a struct constant from a constexpr sub
var x = fact(n);                        // n is a variable: an ordinary call
const m = mask(4);                      // 15, computed while compiling
```

::: What they can do while compiling
While being computed by the compiler, a constexpr or consteval sub can use locals and parameters, loops, `if` and `switch`, recursion up to 256 calls deep, structs (by value, with methods and `this`), arrays, pointers to its own variables, strings, floats, constants, constant arrays and struct constants, and calls to other constexpr or consteval subs.
:::

::: What they can't do
They can't use global variables (as opposed to constants), arbitrary memory addresses, subs that aren't constexpr, sub pointers, variadic arguments, `defer`, virtual calls, or objects that have destructors or tables, and they can run at most 4 million steps. A constexpr call that needs any of these simply becomes an ordinary call at run time. For a consteval sub, it's an error that explains what couldn't be done and where.
:::

::: Results
The result of a compile-time call can be a number, a `bool`, an `f32`, `null`, or a struct, which is then stored as read-only data in the program (its pointer fields must be null). A call that returns a pointer is not replaced, since the compiler's addresses don't exist in the running program.
:::

::: Methods and other rules
Methods can be constexpr or consteval too, and can be called on struct constants. A consteval sub has no address, so it can't be used as a sub pointer, and calls to it with arguments that aren't constants are only allowed inside another consteval sub. Libraries carry the bodies of their constexpr subs, so programs can compute them too.
:::
</script>

<script type="text/x-dsdoc" data-id="structs" data-group="Structs" data-title="Structs">
A struct groups related values, its fields, into one type. A DScript struct is exactly its fields, packed one after the other in the order they're declared, with no hidden data and no padding. Structs can also have methods, constructors, a destructor, static members, constants and operators, but none of these change the struct's size or layout.

```ds
struct Point {
    var x: i32;
    var y: i32 = 7;                     // a default value
    sub length2() -> i32 { return this->x * this->x + this->y * this->y; }
}

var p: Point = { 3, 4 };
var q: Point;                           // zeroed, then the defaults: q.y == 7
p.x = 5;
var r: Point* = &p;
r->y = 1;
```

::: Fields
A field is declared like a variable, with `var`, a name and a type, optionally followed by a default value. A field can be any type: a number, a pointer, an array, another struct, a sub pointer. Default values must be constants (numbers, constant expressions, pointers made from constants, strings, or a sub for a sub pointer field). Fields can also be `const`, `priv` or `readonly`; see [Access](#access).
:::

::: Layout and size
Fields are stored in declaration order without padding, so `sizeof(Point)` is exactly 8 bytes, and a struct can describe a binary format or a hardware register block field for field. To check a layout while compiling, put a `static_assert` in the struct: `static_assert(sizeof(Packet) == 6);`.
:::

::: How structs start
A local struct variable without a value is zeroed, and then every field with a default value gets it. A struct initialized with a list (`{ 3, 4 }`) takes the listed values in order, and the remaining fields get their defaults. A constructor call (`var p: Point(1, 2);`) runs after the defaults are in place. Globals start the same way.
:::

::: What else a struct can contain
Subs written in a struct are its [methods](#methods), and `sub new(...)` is its [constructor](#constructors). `static` members belong to the struct as a whole ([Static members](#static-members)), `sub del()` is its [destructor](#destructors), and operators can be [overloaded](#operators). Structs and enums can be nested inside it ([Nested and nameless structs](#nested-structs)).
:::

::: Constants in structs
`constexpr NAME = value;` inside a struct declares a constant that belongs to the struct and takes no memory in its instances. It can be used as `Struct.NAME`, `Struct::NAME`, `x.NAME` on an instance, or just `NAME` inside the struct's subs.
:::

::: Structs and classes
A struct can't extend another type and has no virtual subs: those are what [classes](#classes) add, while still keeping the struct's guarantee of having no hidden data when they don't need it.
:::
</script>

<script type="text/x-dsdoc" data-id="methods" data-group="Structs" data-title="Methods">
A sub written inside a struct is a method of that struct. It's called on a struct value with `x.m()` or on a pointer with `p->m()`, and inside the method, `this` is a pointer to the struct it was called on. Methods are not stored in the struct, so adding methods never changes its size or layout.

```ds
struct Counter {
    var value: i32;
    var step: i32 = 1;
    sub add(var n: i32) -> i32 { this->value += n; return this->value; }
    sub add() -> i32 { return this->add(this->step); }     // methods can be overloaded
    readonly sub get() -> i32 { return this->value; }      // doesn't change the struct
}

var c: Counter;
c.add(5);
var p: Counter* = &c;
p->add();
```

::: Using this
Inside a method, fields and other methods are reached through `this`: `this->value`, `this->add(...)`. A struct's fields and methods can't share a name, so there's never any doubt about what `this->x` means. Methods are always defined inside the struct, and only named structs can have methods.
:::

::: readonly methods
A `readonly sub` promises not to change the struct: its `this` is a `const` pointer, so the method can't assign fields or call methods that aren't readonly. Only readonly methods can be called on a constant, or through a `const` pointer, which is why getters should be readonly. A readonly method and a normal one can even share the same name and parameters: the readonly one is used on constants, the normal one on variables.
:::

::: Calling a method like a sub
A method can also be called with its full name and an explicit `this`: `Counter::add(&c, 5)` is the same as `c.add(5)`. `Counter::add` used as a value is a sub pointer whose first parameter is the struct pointer.
:::

::: Methods and dynamic dispatch
A struct's methods are always called directly. When the method to call should depend on the object's actual type, use [virtual subs](#virtual) in a class, or store sub pointers in fields.
:::
</script>

<script type="text/x-dsdoc" data-id="access" data-group="Structs" data-title="Access: priv, readonly, const">
By default every member of a struct is public. Three words restrict that: `priv` keeps a member to the struct's own subs, `readonly` lets everyone read a field but only the struct's subs change it, and `const` makes a field unchangeable once the struct has been built. Classes add `prot` and `friend`, described in [prot and friend](#class-access).

```ds
struct Account {
    priv var balance: i32;              // only Account's subs can use it
    readonly var owner: string;         // everyone can read it, only Account can write it
    const id: u32;                      // set once, when an Account is built
    sub new(var id: u32) { this->id = id; }
    priv sub audit() { ... }
}
```

::: priv
A `priv` member can only be used by the struct's own subs: its methods, its static subs, and lambdas written inside them. They can use it on any instance of the struct, not just on `this`. From outside, a list initializer (`{ ... }`) can only set the fields that come before the first private one, and the private fields of a struct constant can only be read inside the struct.
:::

::: readonly fields
A readonly field can be read by everyone, but outside the struct, assigning it, using `++` or `--` on it, and changing something inside it (`s.head.x = 1`, `s.cells[0] = 1`) are errors; taking its address gives a `const` pointer. Initializing it with its default or a list, and copying the whole struct, are still allowed. The protection covers the field itself, so if the field is a pointer, what it points at can still be changed. A field is either `priv` or `readonly`, never both, because `priv` already prevents changes from outside.
:::

::: const fields
A `const` field gets its value when the struct is built, from its default value, a list initializer, or the constructor (`this->id = id;` inside `new` is the only place it can be assigned), and never changes afterwards. Because of this, a struct with a const field, even one nested inside another field or an array, can't be assigned as a whole; create a new variable instead.
:::

::: Private types and statics
The same `priv` applies to nested types and static members: `priv struct`, `priv enum`, `priv static var` and `priv constexpr` can only be used by the struct and the types nested in it.
:::
</script>

<script type="text/x-dsdoc" data-id="static-members" data-group="Structs" data-title="Static members">
Static members belong to the struct itself rather than to each instance. A static sub has no `this` and is called through the struct's name, which makes structs useful as groups of related functions. A static field exists exactly once, shared by every instance, which suits counters, registries and caches.

```ds
struct Counter {
    static var count: u32 = 0;
    readonly static var created: u32;
    var id: u32;
    sub new() { count++; created++; this->id = created; }
    static sub reset() { Counter.count = 0; }
}

Counter.reset();            // or Counter::reset()
Counter.count += 1;
var a: Counter();           // a.count is the same variable as Counter.count
```

::: Static subs
A static sub is called as `Struct.name(...)` or `Struct::name(...)`. This also applies inside the struct's own subs, because a struct's subs aren't found by their name alone. A struct can contain nothing but static subs, acting as a named group of functions.
:::

::: Static fields
A `static var` or `static const` in a struct is a single variable for the whole struct, reachable as `Struct.count`, `Struct::count`, `x.count` or `p->count` (where `x` only provides the type), or just `count` inside the struct's subs. Static fields aren't part of the struct's size, of list initializers or of copies. `priv` and `readonly static var` restrict them the same way as fields, and `static var p: Point(1, 2)` calls a constructor before `main`.
:::

::: Static members in templates and classes
Each instance of a struct template has its own static fields, so `Pool<u8>.made` and `Pool<u32>.made` are different variables. A class inherits the static subs, static fields and constants of the class it extends, so `Derived.make()` works when `make` is declared in the base.
:::
</script>

<script type="text/x-dsdoc" data-id="constructors" data-group="Structs" data-title="Constructors">
A struct's constructor is the method `sub new(...)`. It runs when a variable is declared with arguments in parentheses (`var p: Point(1, 2);`), after the fields have received their zeroes and default values, so the constructor only needs to set what differs. `Point.new(...)` builds a value with the constructor, usable anywhere an expression is.

```ds
struct Point {
    var x: i32;
    var y: i32 = 7;
    sub new(var x: i32, var y: i32) { this->x = x; this->y = y; }
    sub new(var v: i32 = 0) { this->x = v; }        // constructors can be overloaded
}

var p: Point(1, 2);
var q: Point();                     // q.x == 0, q.y == 7
var r = Point.new(3, 4);            // a value
draw(Point.new(5));                 // as an argument
```

::: Where constructors run
A constructor runs only where it's asked for. `var p: Point;` without parentheses, list initializers, arrays of structs and struct fields don't call a constructor; they rely on zeroes and default values. A variable declared with a constructor call can't also have a value. Global variables with a constructor call are built before `main` in the order of the source, and `static var s: Point(5);` builds its variable once, before `main`.
:::

::: T.new(args)
`Point.new(args)` is an expression that builds a temporary `Point` with the matching constructor. It behaves like a call's result: it's moved into a variable it initializes, passed directly to a sub, returned, or destroyed at the end of its statement if nothing keeps it. For a struct without constructors, `Plain.new()` gives a value with only its default values.
:::

::: Rules
The arguments of a declaration's constructor call see the names around the declaration, so in `var x: Point(x);`, the `x` in the arguments is the outer one. `priv sub new` makes a struct that only its own subs can build, which is useful for factories. `new` is otherwise a method like the others and can even be called again on an existing value (`p.new(3)`), which builds it again: the fields get their default values back, then the constructor runs. A constructor can't be `static` and doesn't return a value.
:::

::: Copy constructors
A constructor taking a reference or pointer to its own type, `sub new(var o: const ref T)`, is the copy constructor, used whenever a value of the struct is copied. See [Destructors, copies and moves](#destructors).
:::

::: Constructors in classes
Constructors aren't inherited: each class has its own. A derived class's constructor first builds the part of the object that belongs to the class it extends; see [Classes](#classes).
:::

::: Implicit constructors
A constructor marked `implicit`, such as `implicit sub new(var s: string)`, can also convert a value of its parameter's type into the struct automatically, wherever the struct is expected. See [Implicit conversions](#implicit-conversions).
:::
</script>

<script type="text/x-dsdoc" data-id="nested-structs" data-group="Structs" data-title="Nested and nameless structs">
