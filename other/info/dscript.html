Each analysis compiles the program that the file belongs to, without generating code, using the unsaved contents of open files. A file with a `main` sub is a program; any other file is checked as part of the closest program that includes it, or on its own. Errors are reported one per declaration or sub (the first in each). Since the line being typed rarely compiles, completion analyzes the program without it.
:::

::: Completion and templates
Completion offers the names visible where you type, from the innermost scope out, as well as the members after `.` and `->`, what a namespace or struct contains after `::`, and only types where a type is expected. `priv` members show up only inside their struct's subs. Code inside templates is understood too: dsls analyzes a template's body with stand-in arguments, so hover and completion work while writing the template itself, and instances such as `Array<u32>.` complete with their real members.
:::

::: Zed
Install the extension from `editors/zed` with the command `zed: install dev extension`; Zed needs Rust installed through rustup to build it. `.ds` files open as DScript, `.dss` files as dasm, and the inside of `low { }` blocks is highlighted as dasm. Zed finds `dsls` on the `PATH`, or through the `lsp.dsls.binary.path` setting. `editors/README.md` describes how to change the grammars.
:::
</script>

<script type="text/x-dsdoc" data-id="tc-dragonvm" data-group="Toolchain" data-title="DragonVM-specific features">
A few language features exist only because DScript programs run on DragonVM, where they're also used to write firmware and kernels: low blocks of raw assembly, interrupt subs, atomic blocks and `debug_print`. They're part of the language as `dsc` implements it, but they tie code to DragonVM's CPU.

```ds
sub print(var text: string) {
    low {
        mov R9, $text
        mov R10, 0x0C
        int 0x30
    }
}

interrupt sub on_timer() { g_ticks++; }        // ends with rti

atomic sub take_ticks() -> u32 {               // interrupts disabled inside
    var t: u32 = g_ticks;
    g_ticks = 0;
    return t;
}
```

::: low blocks
`low { ... }` contains dasm assembly, copied line by line into the generated code, except for `$name`s that refer to DScript things: `$var` is a variable's value, loaded into S1 or S2 before the line and stored back after it if it's the line's destination; `&$var` is its address; `[$var]` or `*$var` is the memory a pointer variable points at; `$sub` is a sub's address; `$CONST` and `$Enum.Member` are values. Other `$name`s are left alone, as labels of the low code itself. At most two DScript variables can be used per line. Low blocks can be written in subs and at the top level (for helper routines with labels). The code may use every register, but with `-O` it must name every register it changes, so the compiler keeps its variables elsewhere.
:::

::: interrupt subs
`interrupt sub name() { ... }` is a sub meant to be installed as an interrupt handler: it ends with `rti` instead of `ret`, takes no parameters and returns nothing. It can't be called directly, only installed, and lambdas can be interrupt subs too (`install(0x41, interrupt sub() { ticks++; });`).
:::

::: atomic
`atomic { ... }` runs a block with interrupts disabled and restores the previous state on every way out of it: the end of the block, `return`, `break` and `continue`. Because it restores the saved state rather than simply enabling interrupts, atomic blocks can be nested and used where interrupts are already disabled. `atomic sub` makes a sub's whole body atomic. While interrupts are disabled, the CPU ignores every interrupt, software ones included, so an `int` written in a low block inside an atomic block is an error. Defers inside the block run before interrupts are restored. Atomic blocks can't be used in inline subs.
:::

::: debug_print
`debug_print(text)` prints a string to the host's terminal (drun's or ddb's output), not to the machine's screen, for tracing code that runs without any display. See [Debugging with ddb](#tc-debug).
:::

::: Assertions on DragonVM
`assert` calls the global `__assert_fail` (see [The failure handler](#assert-handler)). DragonOS programs get one by importing the stdlib: it prints `Assertion failed: <condition> (<file>:<line>): <message>` and ends the process with exit code 134. libcore and the SDK deliberately don't define one. Programs without the stdlib, such as a BIOS, a boot loader or a kernel, write their own, for example by calling the SDK's `dr::assert_fail_halt`, which prints to the host's terminal and stops the machine (with `-g`, ddb stops first):

```ds
sub __assert_fail(var file: string, var line: u32, var condition: string, var message: string) {
    dr::assert_fail_halt(file, line, condition, message);
}
```

A kernel might show its panic screen instead.
:::
</script>

<script type="text/x-dsdoc" data-id="libcore" data-group="Library" data-title="libcore">
libcore is DScript's core library: freestanding utilities that any program can use, on any platform, because it touches no hardware and makes no system calls. It covers text and number conversions, strings, memory helpers, math, small containers, random numbers and more.

{{soon}}
</script>

<script type="text/x-dsdoc" data-id="keywords" data-group="Reference" data-title="Keywords">
These words are reserved and can't be used as names:

```ds
var auto const constexpr consteval constinit sub template struct enum alias namespace
return if else while do for switch break continue defer throws throw try catch
null true false cast bitcast static_cast dynamic_cast sizeof
inline static priv readonly operator implicit
class interface ex impl friend prot virt pure override final abstract
assert static_assert and or not void
```

::: Words with a meaning in one place only
Some words only mean something in a specific place and remain ordinary names everywhere else: `in` (for-in loops), `is` and `fall` (switch), `ref` (in types), `post` (`operator post++`), `optional` and `where` (template headers), `typed` (`...typed`), and `value_type`, `base_type` and `absolute_base_type` (type functions).
:::

::: Built-in names
A few names have a predefined meaning without being keywords: `va_count`, `va_start` and `va_types` in variadic subs, the condition built-ins in `where` and `if constexpr` (see [where](#where)), `this` in methods, `main` as the program's entry, and `__assert_fail` as the assertion handler.
:::
</script>

<script type="text/x-dsdoc" data-id="limitations" data-group="Reference" data-title="Limitations">
DScript is still growing. These features don't exist yet, along with the usual way to work around their absence:

- No `goto`: use loops, `break`, `continue`, `defer` and early returns.
- No unions: use `bitcast` to reinterpret values, or a byte array with accessors.
- No 64-bit floating point.
- Lambdas don't capture variables of the sub around them: pass what they need as parameters.
- `#define` has no stringizing or token pasting.
- Arrays are passed by pointer (structs are passed by value; wrap an array in a struct to pass it by value).
- References are only parameters and results, not variables or fields: use pointers there.
- Destructors aren't called through interface pointers (`i->del()`): call them through a class pointer.
- No `using namespace`.
</script>

<script>
(function () {
	"use strict";

	// ===== the topics =====
	const topics = [...document.querySelectorAll('script[type="text/x-dsdoc"]')].map((s, i) => ({
		id: s.dataset.id, group: s.dataset.group, title: s.dataset.title, src: s.textContent, index: i,
	}));
	const byId = new Map(topics.map(t => [t.id, t]));
	const groups = [];
	for (const t of topics) {
		let g = groups.find(x => x.name === t.group);
		if (!g) groups.push(g = { name: t.group, topics: [] });
		g.topics.push(t);
	}

	// ===== a small markup renderer =====
	const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
	const slug = s => s.toLowerCase().replace(/<[^>]+>/g, "").replace(/&[a-z]+;/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

	const KW = new Set(("var auto const constexpr consteval constinit sub template struct enum alias namespace return if else while do for switch break " +
		"continue defer null true false cast bitcast static_cast dynamic_cast sizeof inline static priv readonly operator implicit class interface ex " +
		"impl friend prot virt pure override final abstract assert static_assert and or not this is fall ref in where optional post new del").split(" "));
	const TY = new Set("i8 u8 i16 u16 i32 u32 f32 bool void string char int uint float value_type base_type absolute_base_type".split(" "));
	function highlight(code) {
		const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(#[a-z]+\b)|(\b0x[0-9A-Fa-f_]+[uU]?\b|\b0b[01_]+[uU]?\b|\b\d[\d_]*(?:\.\d*)?(?:[eE][+-]?\d+)?[fuU]?\b)|([A-Za-z_]\w*)(\s*\()?/g;
		let out = "", last = 0, m;
		while ((m = re.exec(code))) {
			out += esc(code.slice(last, m.index));
			if (m[1]) out += '<span class="t-co">' + esc(m[1]) + "</span>";
			else if (m[2]) out += '<span class="t-st">' + esc(m[2]) + "</span>";
			else if (m[3]) out += '<span class="t-pp">' + esc(m[3]) + "</span>";
			else if (m[4]) out += '<span class="t-nu">' + esc(m[4]) + "</span>";
			else {
				const w = m[5], call = m[6] || "";
				if (KW.has(w)) out += '<span class="t-kw">' + w + "</span>" + esc(call);
				else if (TY.has(w) || /^[A-Z][a-z0-9]/.test(w) && !call) out += '<span class="t-ty">' + w + "</span>" + esc(call);
				else if (call) out += '<span class="t-fn">' + w + "</span>" + esc(call);
				else out += w;
			}
			last = re.lastIndex;
		}
		return out + esc(code.slice(last));
	}

	function inline(text) {
		// `code` first (its content as is), then **bold**, *em*, [text](#link)
		return text.split(/(`[^`]+`)/g).map(part => {
			if (part.length > 1 && part[0] === "`" && part[part.length - 1] === "`")
				return "<code>" + esc(part.slice(1, -1)) + "</code>";
			let s = esc(part);
			s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
			s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
			return s;
		}).join("");
	}

	function dedent(src) {
		const lines = src.replace(/^\n+/, "").replace(/\s+$/, "").split("\n");
		let min = Infinity;
		for (const l of lines) if (l.trim()) min = Math.min(min, l.match(/^\t*/)[0].length);
		return lines.map(l => l.slice(min === Infinity ? 0 : min));
	}

	// Blocks of lines -> HTML.
	function blocks(lines) {
		let html = "", i = 0;
		const isSpecial = l => /^```/.test(l) || /^\|/.test(l) || /^- /.test(l) || /^> /.test(l) || /^## /.test(l) || /^\{\{\w+\}\}$/.test(l.trim());
		while (i < lines.length) {
			const line = lines[i];
			if (!line.trim()) { i++; continue; }
			if (/^```/.test(line)) {
				const code = [];
				for (i++; i < lines.length && !/^```/.test(lines[i]); i++) code.push(lines[i]);
				i++;
				html += '<pre><button class="copy" type="button">Copy</button><code>' + highlight(code.join("\n")) + "</code></pre>";
			} else if (/^\|/.test(line)) {
				const rows = [];
				for (; i < lines.length && /^\|/.test(lines[i]); i++) rows.push(lines[i]);
				const cells = r => r.replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
				const head = cells(rows[0]), body = rows.slice(/^\|[\s|:-]+\|$/.test(rows[1] || "") ? 2 : 1);
				const showHead = head.some(c => c);
				html += "<table>" + (showHead ? "<thead><tr>" + head.map(c => "<th>" + inline(c) + "</th>").join("") + "</tr></thead>" : "") +
					"<tbody>" + body.map(r => "<tr>" + cells(r).map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>";
			} else if (/^- /.test(line)) {
				let items = [];
				for (; i < lines.length && (/^- /.test(lines[i]) || /^  \S/.test(lines[i])); i++) {
					if (/^- /.test(lines[i])) items.push(lines[i].slice(2));
					else items[items.length - 1] += " " + lines[i].trim();
				}
				html += "<ul>" + items.map(t => "<li>" + inline(t) + "</li>").join("") + "</ul>";
			} else if (/^> /.test(line)) {
				const note = [];
				for (; i < lines.length && /^> /.test(lines[i]); i++) note.push(lines[i].slice(2));
				html += '<div class="note"><p>' + inline(note.join(" ")) + "</p></div>";
			} else if (/^## /.test(line)) {
				html += "<h2>" + inline(line.slice(3)) + "</h2>";
				i++;
			} else if (/^\{\{\w+\}\}$/.test(line.trim())) {
				html += "{{" + line.trim().slice(2, -2) + "}}";
				i++;
			} else {
				const para = [];
				for (; i < lines.length && lines[i].trim() && !isSpecial(lines[i]); i++) para.push(lines[i].trim());
				html += "<p>" + inline(para.join(" ")) + "</p>";
			}
		}
		return html;
	}

	// A topic: its always shown part, and its sections ("::: Title" ... ":::").
	function parse(topic) {
		if (topic.parsed) return topic.parsed;
		const lines = dedent(topic.src);
		const lead = [], sections = [];
		let cur = null;
		for (const l of lines) {
			const m = l.match(/^:::\s*(.*)$/);
			if (m) {
				if (m[1]) { cur = { title: m[1].trim(), lines: [] }; sections.push(cur); }
				else cur = null;
				continue;
			}
			(cur ? cur.lines : lead).push(l);
		}
		const seen = new Set();
		topic.parsed = {
			lead: blocks(lead),
			sections: sections.map(s => {
				let id = slug(s.title) || "section";
				while (seen.has(id)) id += "-2";
				seen.add(id);
				return { title: s.title, id, html: blocks(s.lines), text: s.lines.join("\n") };
			}),
			leadText: lead.join("\n"),
		};
		return topic.parsed;
	}

	// ===== the sidebar =====
	const side = document.getElementById("side");
	const savedClosed = (() => { try { return JSON.parse(localStorage.getItem("ds-closed") || "[]"); } catch (e) { return []; } })();
	side.innerHTML = groups.map(g =>
		'<div class="group' + (savedClosed.includes(g.name) ? " closed" : "") + '" data-group="' + esc(g.name) + '">' +
		'<button type="button"><span class="chev">▾</span>' + esc(g.name) + "</button><ul>" +
		g.topics.map(t => '<li><a href="#' + t.id + '" data-id="' + t.id + '">' + esc(t.title) + "</a></li>").join("") +
		"</ul></div>").join("");
	side.addEventListener("click", e => {
		const b = e.target.closest(".group > button");
		if (b) {
			b.parentElement.classList.toggle("closed");
			const closed = [...side.querySelectorAll(".group.closed")].map(x => x.dataset.group);
			try { localStorage.setItem("ds-closed", JSON.stringify(closed)); } catch (err) { /* (not saved) */ }
		}
		if (e.target.closest("a")) document.body.classList.remove("nav-open");
	});
	document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.toggle("nav-open"));

	// ===== a page =====
	const page = document.getElementById("page");
	function cardsHtml() {
		const blurbs = {
			"Basics": "Types, literals, variables, constants, enums, pointers, operators",
			"Control flow": "if, loops, for-in, switch, defer, assert",
			"Subs": "Functions, overloads, references, lambdas, compile-time evaluation",
			"Structs": "Fields, methods, access, constructors, values",
			"Classes and interfaces": "Inheritance, virtual subs, interfaces, destructors, operators",
			"Templates": "Generic code, conditions, if constexpr",
			"Source organization": "The preprocessor and #import",
			"Assertions": "assert, its failure handler, NDEBUG, static_assert",
			"Toolchain": "dsc, output formats, static and shared libraries, drun, ddb, dsls",
			"Reference": "Keywords and limitations",
		};
		return '<div class="cards">' + groups.filter(g => blurbs[g.name]).map(g =>
			'<a class="card" href="#' + g.topics[0].id + '"><b>' + esc(g.name) + "</b><span>" + esc(blurbs[g.name]) + "</span></a>").join("") + "</div>";
	}
	const soonHtml = '<div class="soon"><b>Coming soon</b>libcore is still small and changes often: its documentation will be written here once it settles.</div>';

	function show(id, sectionId, terms) {
		const t = byId.get(id) || topics[0];
		const p = parse(t);
		const fill = h => h.replace("{{cards}}", cardsHtml()).replace("{{soon}}", soonHtml);
		const prev = topics[t.index - 1], next = topics[t.index + 1];
		page.innerHTML =
			'<div class="crumb">' + esc(t.group) + "</div><h1>" + esc(t.title) + "</h1>" +
			'<div class="lead">' + fill(p.lead) + "</div>" +
			(p.sections.length ? '<div class="more-bar"><h2>More</h2><button type="button" id="toggleAll">Expand all</button></div>' +
				p.sections.map(s => '<details class="sec" id="' + t.id + "--" + s.id + '"><summary>' + inline(s.title) + '</summary><div class="body">' + fill(s.html) + "</div></details>").join("") : "") +
			'<nav class="pager">' +
			(prev ? '<a class="prev" href="#' + prev.id + '"><small>← Previous</small>' + esc(prev.title) + "</a>" : "") +
			(next ? '<a class="next" href="#' + next.id + '"><small>Next →</small>' + esc(next.title) + "</a>" : "") + "</nav>";
		document.title = t.title + " · DScript";
		for (const a of side.querySelectorAll("a")) a.classList.toggle("active", a.dataset.id === t.id);
		const active = side.querySelector("a.active");
		if (active) {
			active.closest(".group").classList.remove("closed");
			const r = active.getBoundingClientRect(), sr = side.getBoundingClientRect();
			if (r.top < sr.top || r.bottom > sr.bottom) active.scrollIntoView({ block: "center" });
		}
		const toggle = document.getElementById("toggleAll");
		if (toggle) toggle.addEventListener("click", () => {
			const all = [...page.querySelectorAll("details.sec")];
			const open = !all.every(d => d.open);
			all.forEach(d => d.open = open);
			toggle.textContent = open ? "Collapse all" : "Expand all";
		});
		if (sectionId) {
			const d = document.getElementById(t.id + "--" + sectionId);
			if (d) {
				d.open = true;
				requestAnimationFrame(() => {
					d.scrollIntoView({ block: "start", behavior: "smooth" });
					d.classList.add("flash");
					setTimeout(() => d.classList.remove("flash"), 1500);
				});
			}
		} else
			window.scrollTo(0, 0);
		if (terms && terms.length) markTerms(page, terms);
	}

	// Highlights the search's words in the page (text only, not in tags).
	function markTerms(root, terms) {
		const re = new RegExp("(" + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
		const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
			acceptNode: n => n.parentElement.closest("button, .pager, summary") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
		});
		const nodes = [];
		while (walker.nextNode()) nodes.push(walker.currentNode);
		for (const n of nodes) {
			if (!re.test(n.nodeValue)) continue;
			re.lastIndex = 0;
			const span = document.createElement("span");
			span.innerHTML = esc(n.nodeValue).replace(re, "<mark>$1</mark>");
			n.replaceWith(...span.childNodes);
		}
	}

	page.addEventListener("click", e => {
		const b = e.target.closest(".copy");
		if (!b) return;
		const code = b.parentElement.querySelector("code").textContent;
		const done = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1200); };
		if (navigator.clipboard) navigator.clipboard.writeText(code).then(done, () => {});
	});

	// ===== routing: #topic or #topic/section =====
	let pendingTerms = null;
	function route() {
		const h = decodeURIComponent(location.hash.slice(1));
		const [id, sec] = h.split("/");
		show(byId.has(id) ? id : "intro", sec, pendingTerms);
		pendingTerms = null;
	}
	window.addEventListener("hashchange", route);

	// ===== search =====
	// (the text as read: markup gone, code kept; -> * # stay, they are in the language)
	const plain = s => s.replace(/```\w*/g, " ").replace(/^(> |- |## )/gm, "").replace(/`|\*\*|\\\|/g, m => m === "\\|" ? "|" : " ")
		.replace(/^\||\|$/gm, " ").replace(/ \| /g, " ").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/\s+/g, " ").trim();
	let index = null;
	function buildIndex() {
		index = [];
		for (const t of topics) {
			const p = parse(t);
			index.push({ t, sec: null, title: t.title, text: plain(p.leadText) });
			for (const s of p.sections) index.push({ t, sec: s, title: s.title, text: plain(s.text) });
		}
	}
	function search(q) {
		if (!index) buildIndex();
		const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
		if (!terms.length) return { terms, hits: [] };
		const hits = [];
		for (const e of index) {
			const title = e.title.toLowerCase(), topicTitle = e.t.title.toLowerCase(), text = e.text.toLowerCase();
			let score = 0, ok = true;
			for (const term of terms) {
				let s = 0;
				if (title === term) s += 60;
				else if (title.startsWith(term)) s += 30;
				else if (title.includes(term)) s += 18;
				if (topicTitle.includes(term)) s += e.sec ? 4 : 12;
				const n = text.split(term).length - 1;
				if (n) s += Math.min(n, 6) * 2 + (new RegExp("\\b" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).test(text) ? 3 : 0);
				if (!s) { ok = false; break; }
				score += s;
			}
			if (ok) hits.push({ e, score: score + (e.sec ? 0 : 2) });
		}
		hits.sort((a, b) => b.score - a.score);
		return { terms, hits: hits.slice(0, 30) };
	}
	function snippet(text, terms) {
		const lower = text.toLowerCase();
		let at = -1;
		for (const t of terms) { const i = lower.indexOf(t); if (i >= 0 && (at < 0 || i < at)) at = i; }
		const start = Math.max(0, at - 40);
		let s = (start > 0 ? "…" : "") + text.slice(start, start + 140);
		let h = esc(s);
		for (const t of terms) h = h.replace(new RegExp("(" + esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>");
		return h;
	}

	const q = document.getElementById("q"), results = document.getElementById("results");
	let sel = 0, current = [];
	function renderResults() {
		const r = search(q.value);
		current = r.hits;
		sel = 0;
		if (!q.value.trim()) { results.classList.remove("open"); return; }
		results.innerHTML = r.hits.length ? r.hits.map((h, i) => {
			const e = h.e;
			const href = "#" + e.t.id + (e.sec ? "/" + e.sec.id : "");
			return '<a class="result' + (i === 0 ? " sel" : "") + '" href="' + href + '" data-i="' + i + '">' +
				'<div class="r-title">' + snippet(e.title, r.terms) + "</div>" +
				'<div class="r-path">' + esc(e.t.group) + " › " + esc(e.t.title) + (e.sec ? " › " + esc(e.sec.title) : "") + "</div>" +
				'<div class="r-snip">' + snippet(e.text, r.terms) + "</div></a>";
		}).join("") : '<div class="empty">Nothing found for “' + esc(q.value) + "”</div>";
		results.classList.add("open");
	}
	function openResult(i) {
		const h = current[i];
		if (!h) return;
		pendingTerms = search(q.value).terms;
		const target = "#" + h.e.t.id + (h.e.sec ? "/" + h.e.sec.id : "");
		results.classList.remove("open");
		q.blur();
		if (location.hash === target) route(); else location.hash = target;
	}
	q.addEventListener("input", renderResults);
	q.addEventListener("focus", () => { if (q.value.trim()) renderResults(); });
	q.addEventListener("keydown", e => {
		const items = results.querySelectorAll(".result");
		if (e.key === "ArrowDown" || e.key === "ArrowUp") {
			e.preventDefault();
			if (!items.length) return;
			items[sel].classList.remove("sel");
			sel = (sel + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length;
			items[sel].classList.add("sel");
			items[sel].scrollIntoView({ block: "nearest" });
		} else if (e.key === "Enter") {
			e.preventDefault();
			openResult(sel);
		} else if (e.key === "Escape") {
			q.value = "";
			results.classList.remove("open");
			q.blur();
		}
	});
	results.addEventListener("click", e => {
		const a = e.target.closest(".result");
		if (!a) return;
		e.preventDefault();
		openResult(+a.dataset.i);
	});
	document.addEventListener("click", e => { if (!e.target.closest(".search-wrap")) results.classList.remove("open"); });
	document.addEventListener("keydown", e => {
		if (e.key === "/" && document.activeElement !== q && !/input|textarea/i.test(document.activeElement.tagName)) {
			e.preventDefault();
			q.focus();
			q.select();
		}
	});

	// ===== theme =====
	const root = document.documentElement;
	try { const t = localStorage.getItem("ds-theme"); if (t) root.dataset.theme = t; } catch (e) { /* (default) */ }
	document.getElementById("themeBtn").addEventListener("click", () => {
		const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
		root.dataset.theme = dark ? "light" : "dark";
		try { localStorage.setItem("ds-theme", root.dataset.theme); } catch (e) { /* (not saved) */ }
	});

	route();
})();
</script>
</body>
