<script type="text/x-dsdoc" data-id="intro" data-group="Start" data-title="Introduction">
DScript is a compiled, statically typed language in the C family: subs (functions), structs and pointers like C, plus namespaces, overloading, templates, classes with virtual subs and interfaces, references, operators, destructors, compile-time evaluation and a preprocessor. This reference describes the language itself.

```ds
namespace Geo {
    struct Vec {
        var x: i32;
        var y: i32;
        sub operator+(var o: const ref Vec) -> Vec { return Vec.new(this->x + o.x, this->y + o.y); }
        sub new(var x: i32, var y: i32) { this->x = x; this->y = y; }
    }
}

sub main() -> i32 {
    var a = Geo::Vec.new(1, 2);
    var b = a + Geo::Vec.new(3, 4);
    return b.x + b.y;               // 10
}
```

Pick a topic on the left, or start here:

> Every topic shows the essentials first. The boxes under **More** open the details, one at a time. Press `/` to search.

<script type="text/x-dsdoc" data-id="program" data-group="Start" data-title="A program">
A program is a list of top-level declarations: subs, globals, constants, types, namespaces, templates. Execution starts at `main`. Everything can be used before it is declared: there are no forward declarations to write.

```ds
const GREETING = "hello";

sub main() -> i32 {
    return length(GREETING);    // declared below: fine
}

sub length(var s: string) -> i32 {
    var n: i32 = 0;
    while (s[n] != 0) n++;
    return n;
}
```

::: main
`main` takes no parameters, or the program's arguments; it returns an `i32` (its result) or nothing:

```ds
sub main() -> i32 { ... }
sub main() { ... }                                  // returns void
sub main(var argc: u32, var argv: string*) -> i32 { ... }   // the arguments (argv[argc] is null)
```

Global variables (and their constructors) are set up before `main` runs, in the order of the source.
:::

::: Comments
```ds
// to the end of the line
/* a block
   comment */
```
:::

::: Declarations at a glance
```ds
var count: u32 = 0;                 // a global variable
const LIMIT = 10;                   // a constant
enum Color { Red, Green, Blue }     // an enum
alias Handler = sub(i32) -> void;   // a name for a type
struct Point { var x: i32; var y: i32; }
class Dog ex Animal impl Pet { ... }
sub add(var a: i32, var b: i32) -> i32 { return a + b; }
namespace Gfx { ... }
template(T) { ... }
```
Each has its own topic: [variables](#variables), [constants](#constants), [enums](#enums), [aliases](#aliases), [structs](#structs), [classes](#classes), [subs](#subs), [namespaces](#namespaces), [templates](#templates).
:::

::: Statements at a glance
`var` / `auto` / `const` declarations, `if` / `else`, `while`, `do ... while`, `for`, `for (x in range)`, `switch`, `break`, `continue`, `return`, blocks, expressions, `defer`, `assert`, `static_assert`, `if constexpr`. See [Control flow](#control).
:::
</script>

<script type="text/x-dsdoc" data-id="types" data-group="Basics" data-title="Types">
DScript's types are C's, with sizes fixed on every platform. Structs are packed: a struct's size is the sum of its fields.

| Type | Size | |
|---|---|---|
| `i8` `u8` `i16` `u16` `i32` `u32` | 1, 2, 4 | signed / unsigned integers |
| `f32` | 4 | IEEE 754 single precision float |
| `bool` | 1 | `true` / `false` |
| `T*` | 4 | a pointer (`void*`: to anything) |
| `string` | 4 | the same as `u8*` (zero-terminated text) |
| `T[N]` | N × size of T | an array |
| `struct` / `class` | sum of its fields | see [Structs](#structs), [Classes](#classes) |
| `sub(T1, T2) -> R` | 4 | a sub pointer |
| enums | their integer type's | `i32` unless given: `enum Kind: u8 { ... }` |

::: Other names
`char` is `u8`, `int` is `i32`, `uint` is `u32`, `float` is `f32`. `alias` makes your own names: see [Aliases](#aliases).
:::

::: Arrays without a size
In a declaration with a value, `T[]` takes the value's size: `{ 1, 2, 3 }` makes 3 elements, `"text"` 5 bytes (with the final 0). See [Arrays](#arrays).
:::

::: Nameless structs
`struct { fields }` is a type wherever a type goes: `var cursor: struct { var x: i32; var y: i32; };`. See [Nested and nameless structs](#nested-structs).
:::

::: Type expressions
A few type forms are computed when compiling: `value_type(expr)` (the type of a value), `base_type(T)` and `absolute_base_type(T)` (classes). See [Type functions](#type-functions).
:::
</script>

<script type="text/x-dsdoc" data-id="literals" data-group="Basics" data-title="Literals">
```ds
42   0x2A   0b101010   1_000_000            // integers (underscores between digits)
123u   0xFFu                                // u: unsigned (a u32)
1.5   2.   1e-3   2.5e+4   3f   0.5f        // f32
'a'   '\n'   '\x41'                         // characters (a u8)
"text"   "two " "parts"                     // strings (adjacent ones are joined)
true   false   null
```

::: Integer literal types
A literal is an `i32`, or a `u32` if it doesn't fit (`0xFFFFFFFF`). With the `u` / `U` suffix it is a `u32` whatever its value, as `unsigned int` in C: `var h = 2166136261u;` is a `u32`, and `x - 1u` stays unsigned.
:::

::: Escapes
In characters and strings: `\n \t \r \0 \\ \' \"` and `\xNN` (a byte in hex).
:::

::: f32 literals
A `.`, an exponent or the `f` suffix makes an `f32`. There is no 64-bit float type. See [Floating point](#floats).
:::
</script>

<script type="text/x-dsdoc" data-id="variables" data-group="Basics" data-title="Variables">
`var name: type = value;` declares a variable; with a value, the type can be left out. `auto` says explicitly that the type comes from the value.

```ds
var count: u32 = 0;
var ratio = 0.5;            // f32, from the value
auto name = "dscript";      // string
var buffer: u8[64];
var origin: Point(0, 0);    // built by Point's constructor
```

::: Globals and locals
Variables at the top level (or in a namespace) are globals: they live for the whole program and are set up before `main`. Variables in a sub are locals, visible from their declaration to the end of their block.
:::

::: Initial values
A local scalar without a value is not initialized. A local struct is zeroed and gets its fields' default values. Globals are zero unless given a value.
:::

::: auto
`auto x = value;` requires a value and no `: type` (both are errors). It works for variables (locals, globals, `for`, `static`), not parameters or fields. An integer literal gives `i32` (`auto n = 5;`), `5u` a `u32`.
:::

::: static locals
`static var calls: u32 = 0;` in a sub is a variable that lives for the whole program (set once, before `main`) but is only visible in its block. Each sub has its own. Its value can't use the sub's locals or parameters.
:::

::: Shadowing
An inner declaration hides an outer one of the same name (a local hides a constant, and the other way around). Two declarations of one name in the same block are an error.
:::

::: Constructor calls
`var p: Point(1, 2);` calls the struct's constructor on the new variable. See [Constructors](#constructors).
:::
</script>

<script type="text/x-dsdoc" data-id="constants" data-group="Basics" data-title="Constants">
`const` declares something that never changes once it has its value. If the value is known when compiling, it is a compile-time constant; otherwise it is a variable that cannot change. `constexpr` insists on a compile-time value.

```ds
const LIMIT = 10;                       // a compile-time constant
const MASK: u32 = 0xFF;
const VERSION = "1.4";                  // a string constant
const START = read_clock();             // computed when the program runs
constexpr SIZE = 4 * 1024;              // must be known when compiling
constinit g_hits: u32 = SIZE;           // a variable whose initial value is known when compiling
```

::: const parameters and locals
`const` goes anywhere `var` does: globals, locals, parameters (`sub f(const n: u32)`: the sub can't change `n`), fields (see [Access](#access)). A local `const` whose value isn't a compile-time constant is computed every time its declaration runs.
:::

::: constexpr and constinit
- `constexpr NAME = value;` must be a compile-time constant (an error otherwise): it costs nothing when the program runs.
- `constinit` (globals only) is a `var` whose initial value must be known when compiling: no code runs to set it, but it can change.
:::

::: Struct constants
A `const` with a struct type is a group of compile-time values; reading a field is like reading a constant.
```ds
const Origin: Point = { 3, 4 };             // the fields in order (the rest: defaults, then 0)
const Layout: struct {                      // no value: the fields' defaults
    var base: u32 = 0x1000;
    var size: u32 = 0x400;
};
const END = Layout.base + Layout.size;      // usable in other constants, array sizes...
```
- Fields can be integers, floats, pointers (`null`, `cast<T*>(constant)`) and nested structs; not arrays or strings.
- Used as a value (`var c = Origin;`, `&Origin`, passed to a sub, calling a readonly method), it is a read-only copy stored once.
- A struct constant whose values aren't constants is a variable that never changes.
:::

::: String constants
`const NAME = "text";` is used exactly like the literal: in values, default values, `u8[]` initializers and other constants. Its address is not a number known when compiling, so it can't be used in integer constant expressions.
:::

::: Constant arrays
```ds
const Primes: u16[] = { 2, 3, 5, 7, 11 };
const Names: string[] = { "red", "green", "blue" };
const Table: Entry[] = { { 'a', "alpha" }, { 'b', "beta" } };
```
Stored once, never written: assigning an element is an error. With values computed when the program runs, a `const` array is a constant variable; `constexpr` arrays must be constant.
:::

::: Local constants
In a sub, a `const` with a compile-time value is stored like a top-level one (only visible in its block). `static const` is a `const` computed once, before `main`.
:::

::: Constants and pointers
A constant's address is a `const` pointer (`&START` is a `const u32*`). See [Pointers](#pointers).
:::
</script>

<script type="text/x-dsdoc" data-id="enums" data-group="Basics" data-title="Enums">
An enum names integer constants. Its members are used as `Enum.Member`.

```ds
enum Color { Red, Green = 5, Blue }         // Blue == 6
enum Kind: u8 { Command, Data = 0x80 }      // a typed enum: 1 byte

var c: Color = Color.Blue;
var k: Kind = Kind.Data;
```

::: The enum's type
An enum is its integer type: `i32` unless given (`enum E: u16 { ... }`, any of i8, i16, i32, u8, u16, u32). Its values must fit that type. So enum members and integers mix freely, in both directions, with no casts (also in [switch](#switch) cases).
:::

::: In namespaces and structs
An enum declared in a namespace or a struct is named from there: `Gfx::Color.Red`, `List::Kind.Empty`. Inside, just `Kind.Empty`. `priv enum` in a struct is only usable there.
:::
</script>

<script type="text/x-dsdoc" data-id="aliases" data-group="Basics" data-title="Aliases">
`alias Name = type;` gives a type another name. It is the same type, not a new one.

```ds
alias Handler = sub(i32) -> void;
alias Word = u32;
alias Pair = struct { var key: u8; var value: i32; };
alias Con = Gfx::Console;           // also for structs and enums: Con::make(), Con.Errors.Bad
```

::: Aliases of structs and enums
An alias of a struct or enum works as that struct or enum, scopes included: with `alias Con = Gfx::Console;`, `Con::Cell`, `Con::make()` and `Con.make()` all work; with `alias C = Gfx::Color;`, `C.White`.
:::
</script>

<script type="text/x-dsdoc" data-id="namespaces" data-group="Basics" data-title="Namespaces">
A namespace groups declarations under a name. From outside, its names are `Namespace::name`.

```ds
namespace Gfx {
    const ROWS = 25;
    enum Color: u8 { Black, White = 15 }
    namespace Text {                            // nested: Gfx::Text
        sub print(var s: string) { ... }
        sub clear(var c: Color = Color.Black) { ... }
    }
}
namespace Gfx::Text {                           // reopened, anywhere
    sub lines() -> i32 { return ROWS; }         // Gfx::ROWS
}

Gfx::Text::print("hi");
var c: Gfx::Color = Gfx::Color.White;
```

::: Name lookup
A name is looked up from the innermost namespace outwards, then globally: in `Gfx::Text`, `print` finds `Gfx::Text::print`, then `Gfx::print`, then `print`. `::name` is the global one.
:::

::: :: and .
`::` is for scopes (namespaces, a struct's static subs, nested types); `.` for values (enum members, fields of struct constants): `Gfx::Color.White`.
:::

::: What a namespace holds
Any top-level declaration: subs, globals, constants, enums, aliases, structs, classes, templates, other namespaces. A namespace and another declaration can't have the same full name. There is no `using namespace`.
:::
</script>

<script type="text/x-dsdoc" data-id="pointers" data-group="Basics" data-title="Pointers">
`T*` points at a `T`. `&x` takes an address, `*p` reads or writes what `p` points at, `p->field` reaches a struct's field through a pointer.

```ds
var n: i32 = 5;
var p: i32* = &n;
*p = 7;                     // n == 7
var q: void* = p;           // void* takes any pointer...
var r: i32* = q;            // ...and converts back
var none: Point* = null;
```

::: Pointer arithmetic
`p + n` and `p - n` move by `n` elements, `p - q` counts the elements between them, and `p[i]` is `*(p + i)`.
:::

::: const pointers
`const T*` can't change what it points at (it can point elsewhere). In a declaration, `const` before the name is about the variable; in a type, about the target:
```ds
var p: const u8* = text;    // *p = 'x' is an error; p = other is fine
const q: u8* = buffer;      // *q = 'x' is fine; q = other is an error
const r: const u8* = text;  // neither
```
- `T*` converts to `const T*`; the other way needs a cast.
- Through a `const T*`, `*p`, `p[i]` and `p->field` can't be changed (one level, as in C).
- `&` of something that can't change (a constant, a const or readonly field, through a const pointer) is a `const` pointer.
:::

::: Pointers to pointers and to subs
`u8**`, `Point**`... and sub pointers `sub(i32) -> i32` (see [Lambdas and sub pointers](#lambdas)). `const u8**` is a pointer to a `const u8*`.
:::

::: References
For parameters and results, `ref T` refers to a value without writing `&` and `*`. See [References](#references).
:::
</script>

<script type="text/x-dsdoc" data-id="arrays" data-group="Basics" data-title="Arrays and initializers">
`T[N]` holds `N` values of type `T`. Arrays convert to a pointer to their first element.

```ds
var a: i32[5] = { 1, 2, 3 };            // the rest is 0
var grid: u8[4][8];                     // 4 rows of u8[8]
var name: u8[16] = "text";
var primes: u16[] = { 2, 3, 5 };        // 3 elements, from the value
sizeof(a)                               // 20
```

::: Initializer lists
`{ ... }` initializes arrays and structs, nested as needed:
```ds
var p: Point = { 10, 20 };
var q: Point = { 5 };                   // q.y gets its default value
var r: Rect = { { 1, 2 }, { 5, 6 } };
var rows: Point[2] = { { 1, 2 }, { 3, 4 } };
```
Fields not listed get their default value (or zero). Outside a struct, `{ ... }` can only set fields before the first private one.
:::

::: Strings in arrays
A string literal initializes a `u8` / `i8` array: `var buf: u8[16] = "text";` (the rest is 0). It must fit (the final 0 may be left out when the text fills the array exactly).
:::

::: Passing arrays
Arrays are passed to subs as pointers (`sub sum(var a: i32*, var n: u32)`), and can't be assigned as a whole. Structs, unlike arrays, are passed by value: see [Structs by value](#struct-values).
:::

::: Loops over arrays
`for (auto v in values)` goes through an array; `for (auto& v in values)` gives pointers to the elements. See [for-in](#forin).
:::
</script>

<script type="text/x-dsdoc" data-id="expressions" data-group="Basics" data-title="Operators and expressions">
DScript has C's operators and precedence, plus `and`, `or`, `not` as words for `&&`, `||`, `!`.

| Precedence (high to low) | Operators |
|---|---|
| postfix | `a(b)` `a[i]` `s.f` `p->f` `x++` `x--` |
| unary | `-` `!` `not` `~` `*` `&` `++x` `--x` `cast<T>()` `sizeof` |
| multiplicative | `*` `/` `%` |
| additive | `+` `-` |
| shift | `<<` `>>` |
| comparison | `<` `<=` `>` `>=` |
| equality | `==` `!=` |
| bitwise | `&`, then `^`, then `\|` |
| logical | `&&` / `and`, then `\|\|` / `or` (short-circuit) |
| conditional | `?:` |
| assignment | `=` `+=` `-=` `*=` `/=` `%=` `&=` `\|=` `^=` `<<=` `>>=` |

::: Integer arithmetic
Arithmetic is 32-bit: smaller types are widened first (`i8`, `i16` sign-extended), the result is `u32` if an operand is `u32`, `i32` otherwise; values are truncated when stored. Division, `%`, `>>` and comparisons are unsigned on `u32` (and pointers), signed otherwise.
:::

::: sizeof
`sizeof(type or value)` and `sizeof<type>` are `u32` constants.
:::

::: Casts
`cast<T>(v)`, `bitcast<T>(v)`, `static_cast<T>(v)` and `dynamic_cast<T*>(p)`: see [Conversions and casts](#conversions).
:::

::: Struct values
Structs can be assigned, compared through their operators, passed and returned by value. With [operator overloading](#operators), any operator can mean something for a struct.
:::

::: Range expressions
`a..b` (from `a` to `b - 1`) appears in [for-in loops](#forin) and [switch](#switch) cases.
:::
</script>

<script type="text/x-dsdoc" data-id="conversions" data-group="Basics" data-title="Conversions and casts">
Some conversions happen by themselves; the rest are written with a cast.

```ds
var w: u32 = byte;                      // integer types convert freely
var f: f32 = count;                     // integers to f32
var p: Point* = null;
var n = cast<i32>(f);                   // f32 to integer: truncates
var bits = bitcast<u32>(1.0f);          // 0x3F800000: the same bits
var d = static_cast<Dog*>(animal);      // down a class hierarchy (unchecked)
var c = dynamic_cast<Cat*>(animal);     // checked: null if it isn't a Cat
```

::: Implicit conversions
- between integer types (and enums), and integers to `f32`;
- `null` (and `0`) to pointers, arrays to pointers, `void*` to and from any pointer, `T*` to `const T*`;
- a class pointer to a pointer to a class it extends or an interface it implements;
- user conversions: implicit constructors and `operator cast` (see [Implicit conversions](#implicit-conversions)).
:::

::: cast<T>
Conversions between integers, `f32`, pointers and sub pointers (not between `f32` and pointers). `f32` to an integer truncates toward zero and saturates (NaN gives 0); `cast<bool>(f)` is `f != 0.0`. `cast<T*>(constant)` is a constant address. On a struct, `cast<T>` uses its conversions (`operator cast`), and `cast<S>(value)` builds an `S` with a constructor taking one value.
:::

::: bitcast<T>
The same bits read as another type of the same size (nothing is converted): `bitcast<f32>(0x3F800000)` is `1.0`. Integers, `f32`, pointers, sub pointers, and structs and arrays as values (`bitcast<u32>(pixel)`); not to an array or a `bool`. The first byte is the most significant (big endian). Constants give constants.
:::

::: static_cast<T>
A conversion that happens anyway, numbers to numbers, and a class pointer to a pointer to a class derived from it (or from an interface to the class implementing it). It isn't checked: the object must be one. `cast<>` between pointers to related classes is an error, because it wouldn't find the right part of the object; use `static_cast`.
:::

::: dynamic_cast<T*>
Asks the object itself: a pointer to its `T` part (a class up its chain, or an interface it implements, also from one interface to another), or `null`. The pointer must point at a class with virtual subs or interfaces. See [Casts between classes](#class-casts).
:::
</script>

<script type="text/x-dsdoc" data-id="floats" data-group="Basics" data-title="Floating point">
`f32` is an IEEE 754 single precision float. It works with the arithmetic operators and comparisons, and integers convert to it implicitly.

```ds
var f: f32 = 1.5;
var g = f * 2 + 1;              // 4.0 (the integers convert)
var i = cast<i32>(g / 3.0f);    // 1: truncated
```

::: Operators
`+ - * /` (division by zero gives an infinity), unary `-`, comparisons, `! && ||`, `?:`, `++ --` (by 1.0), `+= -= *= /=`. Not `%`, the bitwise operators or shifts.
:::

::: Comparisons and conditions
Comparisons follow IEEE: every comparison with NaN is false except `!=`, and `-0.0 == 0.0`. As a condition, an `f32` is true unless it is `0.0` or `-0.0` (NaN is true).
:::

::: Conversions
Integers convert to `f32` implicitly. An `f32` converts to an integer only with `cast`: toward zero, saturating at the type's limits (NaN gives 0). An overloaded sub called with an integer prefers its integer overload.
:::

::: Constants and bits
Float expressions fold when compiling (`const HALF: f32 = 1.0 / 2;`). To look at the bits: `bitcast<u32>(f)` and `bitcast<f32>(bits)`.
:::
</script>

<script type="text/x-dsdoc" data-id="control" data-group="Control flow" data-title="if, loops and blocks">
```ds
if (n > 0) { ... } else if (n < 0) { ... } else { ... }
while (running) { ... }
do { ... } while (again);
for (var i: u32 = 0; i < count; i++) { ... }
for (auto x in 0..10) { ... }           // see for-in
```

::: Conditions
A condition is an integer, a `bool`, a pointer or an `f32` (true when not zero / not null), or a struct with an implicit conversion to `bool`.
:::

::: break and continue
`break` leaves the innermost loop (or [switch](#switch)); `continue` goes to the next iteration of the innermost loop. Both run the [defers](#defer) and destructors of the blocks they leave.
:::

::: Blocks and scopes
`{ ... }` is a block: its locals end at its `}` (their destructors run there). A `for` loop's variable ends with the loop.
:::

::: return
`return value;` (or `return;` in a sub without a result). The value is computed first, then the defers and destructors of the sub run.
:::

::: if constexpr
`if constexpr (condition) { ... } else { ... }` decides when compiling: only the chosen branch is compiled, the other one isn't even checked. See [if constexpr](#if-constexpr).
:::
</script>

<script type="text/x-dsdoc" data-id="forin" data-group="Control flow" data-title="for-in loops and ranges">
`for (auto x in range)` runs the body for every element of a range: numbers `a..b`, an array, or a struct that is a range.

```ds
for (auto i in 0..10) { }          // 0 to 9 (the end is excluded); i: i32
for (auto i in 0..count) { }       // i: count's type
for (auto v in values) { }         // an array: v is a copy of each element
for (auto& v in values) *v *= 2;   // v: a pointer to each element
for (var p: Point in points) { }   // the type written
for (auto item in list) { }        // a struct that is a range
```

::: A struct as a range
A struct is a range when it has these methods (a cursor `C` is any integer or pointer: an index, a node pointer...):
```ds
sub begin() -> C            // the cursor of the first element
sub end() -> C              // one past the last (compared with !=)
sub next(var c: C) -> C     // the cursor after c
sub get(var c: C) -> T*     // the element at c
```
```ds
struct Chain {              // a linked list: node pointers, null at the end
    var head: Node*;
    inline sub begin() -> Node* { return this->head; }
    inline sub end() -> Node* { return null; }
    inline sub next(var n: Node*) -> Node* { return n->next; }
    inline sub get(var n: Node*) -> Item* { return &n->item; }
}
```
A cursor that points at the elements (`begin()` / `end()` return `T*`) needs no `next` / `get`.
:::

::: How it runs
It is a `for` loop over the cursor: the range and `end()` are evaluated once; `break` and `continue` work as usual. With inline methods it costs what a handwritten loop does. `begin` / `end` / `next` / `get` may be `priv`: a for-in still uses them.
:::

::: Ranges a..b
`a..b` goes from `a` to `b - 1`; both are evaluated once, and the variable has their (integer) type. The same half-open ranges are used by [switch](#switch) cases. `in` is only a word there: it can still be a name elsewhere.
:::
</script>

<script type="text/x-dsdoc" data-id="switch" data-group="Control flow" data-title="switch">
`switch` picks a case by value. Case values are known when compiling, each case has its own block, and by default a case ends the switch: there is no accidental fallthrough.

```ds
switch (key) {
    is 'q' or 27 { quit(); }                // several values
    is 'a'..'z' + 1 { letter(key); }        // a range (end excluded)
    is Keys.Enter { enter(); }              // constants, enum members, constexpr calls
    else { other(); }
}
```

::: fall: C-style fallthrough
With `fall`, a case runs into the next one unless it breaks:
```ds
switch (n) fall {
    is 1 { setup(); }                       // then runs is 2's block
    is 2 { run(); break; }
    else { idle(); }
}
```
The previous case's locals end at its `}`, also when the next case runs.
:::

::: Case values
- Literals, constants, enum members, constexpr / consteval calls (one that can't be computed is an error).
- Each must be a value of the switch's type (`is 300` on a `u8` is an error), and a value can be in one case only (overlapping ranges too).
- `or` separates the values, so a value is an expression without `||` / `or` (parentheses for one).
- `else` is the last case; it runs when no case has the value.
:::

::: The switched value
An integer, a character, a `bool` or an enum. Enum members and integers mix freely: `switch (n) { is Color.Red { } }` works, and so does the reverse.
:::

::: break and continue
`break` leaves the switch; `continue` belongs to the loop around it.
:::

::: Enums without else
A switch on one enum's members without `else` warns about the members no case has.
:::

::: How it is compiled
A few values are compared one by one; dense values (filling at least half their span) jump through a table; sparse ones are found by a binary search. A switch also works in constexpr subs.
:::

::: is and fall
`is` and `fall` are only words inside a switch: they can still be names elsewhere.
:::
</script>

<script type="text/x-dsdoc" data-id="defer" data-group="Control flow" data-title="defer">
`defer statement` runs that statement when the block it is in is left, on every way out: the end of the block, `return`, `break` and `continue`. Several defers run in reverse order.

```ds
sub copy(var path: string) -> i32 {
    var f: File* = open(path);
    defer close(f);                 // runs on every way out
    if (f->size == 0)
        return 0;                   // close(f) runs here
    for (var i: u32 = 0; i < f->size; i++) {
        var b: u8* = alloc(16);
        defer release(b);           // at the end of every iteration
        ...
    }
    return 1;                       // and here
}
```

::: Order and values
`return x` computes `x` first, then the defers run, then the sub returns. A defer sees the variables declared before it, as they are when it runs.
:::

::: Rules
`return`, `break` and `continue` can't jump out of a defer. A defer can't be the whole body of an `if` / `while`: it needs a block (`if (c) { defer ...; }`). The deferred code is generated at every exit, so a long one in a sub with many returns makes it bigger.
:::

::: Defers and destructors
Locals with [destructors](#destructors) are destroyed the same way, as if deferred right after their declaration.
:::
</script>

<script type="text/x-dsdoc" data-id="asserts" data-group="Control flow" data-title="assert and static_assert">
`assert(condition)` checks a condition when the program runs; `static_assert(condition)` checks one when compiling.

```ds
assert(p != null);
assert(count < MAX, "too many entries");        // an optional message
static_assert(sizeof(Header) == 16, "Header changed size");
```

::: What a failed assert does
When the condition is false, the program calls the global `__assert_fail(file, line, condition, message)`: the condition as written, and the message or `""`. The program decides what happens: it defines that sub. Without it, an `assert` is an error.
```ds
sub __assert_fail(var file: string, var line: u32, var condition: string, var message: string) {
    ... report it, then stop ...
}
```
:::

::: NDEBUG
With `NDEBUG` defined (`#define(NDEBUG)`, or as a compiler option), asserts are only checked by the compiler: no code, the conditions don't run, and no `__assert_fail` is needed.
:::

::: static_assert
`static_assert(condition, "message")` stops the compilation if the condition is false (`static_assert failed: message`). It works at the top level and in namespaces, in a struct (with its layout: `static_assert(sizeof(Packet) == 6)`), in a sub, and in a template's body, where it is checked for each instance with its parameters.
:::
</script>

<script type="text/x-dsdoc" data-id="subs" data-group="Subs" data-title="Subs">
A sub is a function: `sub name(parameters) -> result { body }`. Without `-> type` it returns nothing.

```ds
sub add(var a: i32, var b: i32) -> i32 { return a + b; }
sub greet(var name: string, var times: u32 = 1) { ... }    // a default value
sub later(var x: i32) -> i32;                               // a declaration
greet("Ada");
greet("Ada", 3);
```

::: Parameters
`var name: type`, or `const name: type` (the sub can't change it); the `var` can be left out. Parameters are integers, floats, pointers, sub pointers, structs (passed by value, see [Structs by value](#struct-values)) and [references](#references); arrays are passed as pointers.
:::

::: Default values
A parameter with a default value is optional; the ones after it need one too. Defaults are constants (or string literals).
:::

::: Declarations
`sub later(var x: i32) -> i32;` declares a sub defined elsewhere (later in the source, or in a library). It is rarely needed: everything can be used before its declaration.
:::

::: Results
A sub returns an integer, float, pointer, sub pointer, struct (by value) or a [reference](#references). `main` returns `i32` or nothing.
:::

::: Kinds of subs
- [Overloads](#overloading): one name, several parameter lists.
- [inline subs](#inline): generated at every call.
- [Variadic subs](#variadic): `...` after the parameters.
- [constexpr / consteval subs](#constexpr-subs): computed when compiling.
- [Lambdas](#lambdas): subs as values.
- Methods of [structs](#methods) and [classes](#classes).
:::
</script>

<script type="text/x-dsdoc" data-id="overloading" data-group="Subs" data-title="Overloading">
Several subs can share a name if their parameters differ. The call picks the one whose parameters fit the arguments best.

```ds
sub show(var n: i32) { ... }
sub show(var s: string) { ... }
sub show(var p: Point) { ... }
show(42);   show("hi");   show(origin);
```

::: How the best one is chosen
An exact type is best, then widening with the same signedness (`u16` to `u32`), then other integer conversions, then integer to `f32`; a class pointer prefers the nearest base. User conversions ([implicit](#implicit-conversions) constructors and casts) come after every built-in one. A tie is an error ("ambiguous call"): add a cast.
:::

::: Sub pointers and overloads
A sub's name used as a sub pointer picks the overload by the pointer's type: `var f: sub(u8) -> i32 = twice;`.
:::

::: Variadic and defaults
A sub that takes the arguments without `...` wins over a variadic one. Defaults count as given arguments.
:::

::: In templates
Overloads in one template are told apart by their arguments, also when the template's parameters are given: `pick<u32>(1, 2)` and `pick<u32>(1, 2, out)`.
:::
</script>

<script type="text/x-dsdoc" data-id="references" data-group="Subs" data-title="References">
`ref T` (for parameters and results) refers to a `T` somewhere else: no copy is made, and the parameter is used as the `T` itself.

```ds
sub bump(var x: ref i32) { x++; }                   // the caller's variable changes
sub area(var r: const ref Rect) -> u32 { ... }      // no copy, and r can't change
sub at(var i: u32) -> ref i32 { return g_cells[i]; }

var n: i32 = 1;
bump(n);                    // n == 2 (no & to write)
area(Rect.new(2, 3));       // const ref: values too
at(4) = 7;                  // the call is what it refers to
```

::: What ref T takes
A variable of type `T` (or a class derived from it): something in memory that may change, such as a variable, a field, an array element, `*p` or another reference. Values (literals, call results) and constants are errors.
:::

::: const ref T
Also takes constants and values: literals, call results, `T.new(...)`, anything that converts to `T`. A value is put in a temporary that lives until the statement ends. It's the way to pass big structs without copying them.
:::

::: In the sub
The parameter is the `T` it refers to: reading it, assigning it (`x = 5` changes the caller's), `&x` (the caller's address), calling methods (on a class: the object's own virtual subs).
:::

::: ref results
`-> ref T`: the call is what the result refers to, so it can be assigned, changed and have its address taken (`sub operator[](var i: u32) -> ref T` makes `a[i] = x` work). It must refer to something that lives on: a global, a field through `this` or a pointer, `*p`, a reference parameter. A reference to a local, a value parameter or a value is an error.
:::

::: Classes and interfaces
A `ref Base` takes an object of any class derived from it (`ex` or `impl`), pointing at its `Base` part; virtual subs called through it are the object's own.
:::

::: Under the hood and limits
A reference is passed as a pointer. `ref T` and `T*` are different parameter types (for overloads and sub pointer types: `sub(ref i32)`); templates deduce `T` from a `ref T` parameter's argument. References are only parameters and results: no reference variables, fields or arrays, no default values for them. `ref` is only a word in a type: it can still be a name.
:::
</script>

<script type="text/x-dsdoc" data-id="lambdas" data-group="Subs" data-title="Lambdas and sub pointers">
A sub pointer holds a sub; a lambda is a sub written as a value.

```ds
var op: sub(i32, i32) -> i32 = add;                 // a named sub
var twice = sub(var x: u32) -> u32 { return x * 2; };   // a lambda
map(values, 3, sub(var x: u32) -> u32 { return x * x; });
var n = sub(var a: i32, var b: i32 = 10) -> i32 { return a * b; }(4);   // 40
op(1, 2);
```

::: Sub pointer types
`sub(T1, T2) -> R` (no `-> R`: returns nothing). Arrays of them need parentheses: `(sub(i32) -> i32)[4]`. `&add` and `add` both give the pointer. Sub pointers can be fields, with a sub as default value: `var area: sub(Shape*) -> u32 = square_area;`.
:::

::: Lambdas
Parameters, defaults and the result work as in a named sub. A lambda costs what a named sub does.
:::

::: No captures
A lambda captures nothing: it can use globals, constants, subs and its own parameters, but not the locals or parameters of the sub around it (an error: pass them as parameters). It can use that sub's constants and static variables.
:::

::: Methods as sub pointers
`Counter::add` is a sub pointer whose first parameter is the struct pointer: `var f: sub(Counter*, i32) -> i32 = Counter::add;`.
:::
</script>

<script type="text/x-dsdoc" data-id="inline" data-group="Subs" data-title="inline subs">
`inline sub` works like a sub, but every direct call puts its body in place: no call, the arguments copied into hidden locals of the caller.

```ds
inline sub square(var x: i32) -> i32 { return x * x; }
var y = square(a + 1);      // the parameter is a copy: a is not changed
```

::: When to use it
For small, often-called subs (accessors, tiny math). Every call adds the body's code, so big inline subs make the program bigger.
:::

::: As a sub pointer
An inline sub used as a sub pointer, or called through a class's table, also gets real code; otherwise it has none (but it is still checked).
:::

::: Not allowed
Recursion (also through other inline subs), `inline sub main`.
:::
</script>

<script type="text/x-dsdoc" data-id="variadic" data-group="Subs" data-title="Variadic subs">
A sub whose parameters end with `...` takes more arguments, of any scalar type. With `...typed`, each argument's type is passed too.

```ds
sub sum(var count: u32, ...) -> i32 {
    var total: i32 = 0;
    var arg: i32* = cast<i32*>(va_start());
    for (var i: u32 = 0; i < va_count(); i++)
        total += *(arg - i);        // each one 4 bytes below the previous
    return total;
}
sum(3, 10, 20, 30);
```

::: va_count, va_start, va_types
In the sub itself: `va_count()` is how many extra arguments the call gave; `va_start()` the address of the first (the next ones are each 4 bytes lower); `va_types()` (`...typed` only) the address of their type codes, laid out the same way: Bool 1, I8 2, U8 3, I16 4, U16 5, I32 6, U32 7, F32 8, Pointer 9, String 10, Sub 11. All three are `u32`.
:::

::: The extra arguments
Each is one 32-bit slot: smaller integers (and `bool`) are widened (signed to `i32`, unsigned to `u32`), an `f32` is passed as its bits, arrays as pointers, structs only by pointer. An overloaded sub's name needs a cast.
:::

::: Rules
A sub without `...` that fits wins over a variadic one. Sub pointer types can have `...` too: `sub(string, ...typed) -> u32`. Not with default values, on inline subs or `main`. Methods and lambdas can be variadic.
:::
</script>

<script type="text/x-dsdoc" data-id="constexpr-subs" data-group="Subs" data-title="constexpr and consteval subs">
A `constexpr sub` is computed when compiling whenever its arguments are compile-time constants: its value replaces the call. A `consteval sub` is always computed when compiling, and has no code in the program.

```ds
constexpr sub fact(var n: u32) -> u32 { return n <= 1 ? 1 : n * fact(n - 1); }
consteval sub mask(var bits: u32) -> u32 { return (1u << bits) - 1; }

var table: u8[fact(4)];                 // an array size: 24
constexpr ORIGIN: Point = make(3, 4);   // a struct constant
var x = fact(n);                        // n is a variable: a normal call
const m = mask(4);                      // 15, when compiling
```

::: What they can do when compiling
Locals, parameters, loops, `if`, `switch`, recursion (up to 256 deep), structs (by value, methods, `this`), arrays, pointers to their own variables, strings, `f32`, constants, constant arrays and struct constants, and other constexpr / consteval subs.
:::

::: What they can't
Globals that are variables, memory addresses, subs that aren't constexpr, sub pointers, `...`, `defer`, virtual calls, objects with destructors or tables, and more than 4 million steps. A constexpr call that does any of that is a normal call; for consteval it is an error saying why and where.
:::

::: Results
A number, `bool`, `f32`, `null`, or a struct (its pointer fields must be null). A call returning a pointer is not replaced.
:::

::: Methods and consteval rules
Methods can be constexpr / consteval too, and called on struct constants. A consteval sub has no address (it can't be a value), and its calls with non-constant arguments are only allowed in another consteval sub.
:::
</script>

<script type="text/x-dsdoc" data-id="structs" data-group="Structs" data-title="Structs">
A struct groups fields. It is exactly its fields, packed in order, with no hidden data.

```ds
struct Point {
    var x: i32;
    var y: i32 = 7;                     // a default value
    sub length2() -> i32 { return this->x * this->x + this->y * this->y; }
}

var p: Point = { 3, 4 };
var q: Point;                           // zeroed, then the defaults: q.y == 7
p.x = 5;
var r: Point* = &p;
r->y = 1;
```

::: Fields
`var name: type`, optionally with a constant default value (integers, floats, pointers, strings, sub pointers). A field can be another struct, an array, a pointer. Also `const` fields and `priv` / `readonly` ones: see [Access](#access).
:::

::: Layout
Fields are packed: `sizeof(Point)` is 8, with no padding. `static_assert(sizeof(Packet) == 6)` in a struct checks a layout.
:::

::: Methods, constructors, statics
Subs written in a struct are its [methods](#methods); `sub new(...)` is its [constructor](#constructors); `static` members belong to the struct itself ([Static members](#static-members)); `sub del()` is its [destructor](#destructors).
:::

::: Constants in structs
`constexpr NAME = value;` in a struct is a constant of the struct: `Struct.NAME`, `Struct::NAME`, `x.NAME`, or `NAME` in its subs.
:::

::: Structs and classes
A struct can't extend anything and has no virtual subs: that's what [classes](#classes) add. Operators can be overloaded in both.
:::
</script>

<script type="text/x-dsdoc" data-id="methods" data-group="Structs" data-title="Methods">
Subs written in a struct are its methods. They are called on a struct (`x.m()`) or a pointer to one (`p->m()`), and get it as `this`, a pointer to the struct.

```ds
struct Counter {
    var value: i32;
    var step: i32 = 1;
    sub add(var n: i32) -> i32 { this->value += n; return this->value; }
    sub add() -> i32 { return this->add(this->step); }     // overloads
    readonly sub get() -> i32 { return this->value; }      // doesn't change the struct
}

var c: Counter;
c.add(5);
var p: Counter* = &c;
p->add();
```

::: this
Fields and other methods are used through `this->`. A struct's fields and methods can't share a name. Methods are defined in the struct (no separate definitions), and only named structs have them.
:::

::: readonly subs
`readonly sub` doesn't change the struct: its `this` is a `const T*`, so it can't change fields or call subs that aren't readonly. Only readonly subs can be called on a constant or through a `const T*`. A readonly and a normal sub may share a name and parameters (one for constants, one for variables).
:::

::: Calling methods as subs
`Counter::add(&c, 5)` calls the method with an explicit `this`; `Counter::add` is a sub pointer whose first parameter is `this`.
:::

::: Methods are not stored
Methods aren't in the struct: its size and layout stay the same. For dynamic dispatch, use [virtual subs](#virtual) in classes, or sub pointer fields.
:::
</script>

<script type="text/x-dsdoc" data-id="access" data-group="Structs" data-title="Access: priv, readonly, const">
Members are public unless marked. `priv` keeps a member to the struct's own subs; `readonly` lets everyone read a field but only the struct change it; `const` fields never change once the struct is built.

```ds
struct Account {
    priv var balance: i32;              // only Account's subs use it
    readonly var owner: string;         // everyone reads, only Account writes
    const id: u32;                      // set once, when it is built
    sub new(var id: u32) { this->id = id; }
    priv sub audit() { ... }
}
```

::: priv
Only the struct's own subs (methods, static subs, lambdas written in them) can use a `priv` member, on any instance. Outside, `{ ... }` can only set the fields before the first private one, and the private fields of struct constants are only readable inside. Classes add `prot` and `friend`: see [prot and friend](#class-access).
:::

::: readonly fields
Outside the struct, assigning a readonly field, `++` / `--` and changing something inside it (`s.head.x = 1`, `s.cells[0] = 1`) are errors; its address is a `const` pointer. Initializing it (default, `{ ... }`) and copying the whole struct are allowed. It protects the field itself: a pointer field's target can still change. A field is either `priv` or `readonly`.
:::

::: const fields
`const id: u32 = 1;` gets its value from its default, `{ ... }`, or the constructor (`this->id = id;` in `new`, the only place it can be assigned). A struct with a const field (also inside a field or an array) can't be assigned as a whole: initialize a new variable instead.
:::

::: Private nested types and statics
`priv struct`, `priv enum`, `priv static var` and `priv constexpr` work the same way: only the struct (and what is nested in it) can use them.
:::
</script>

<script type="text/x-dsdoc" data-id="static-members" data-group="Structs" data-title="Static members">
`static` members belong to the struct itself, not to each instance: static subs have no `this`, and static fields exist once.

```ds
struct Counter {
    static var count: u32 = 0;
    readonly static var created: u32;
    var id: u32;
    sub new() { count++; created++; this->id = created; }
    static sub reset() { Counter.count = 0; }
}

Counter.reset();            // or Counter::reset()
Counter.count += 1;
var a: Counter();           // a.count is the same variable
```

::: Static subs
Called as `Struct.name(...)` or `Struct::name(...)`, also from the struct's own subs (a struct's subs aren't found by their name alone). A struct can have only static subs, as a group of functions.
:::

::: Static fields
`static var` / `static const`: one variable for the struct (`Struct.count`, `Struct::count`, `x.count`, `p->count`, or `count` in its subs). Not part of `sizeof`, `{ ... }` or a copy. `priv` and `readonly static var` work as for fields; `static var p: Point(1, 2)` calls a constructor before `main`.
:::

::: In templates and classes
Each instance of a struct template has its own (`Pool<u8>.made`, `Pool<u32>.made`). A class inherits its base's static subs, fields and constants: `Derived.make()`.
:::
</script>

<script type="text/x-dsdoc" data-id="constructors" data-group="Structs" data-title="Constructors">
`sub new(...)` is a struct's constructor. `var p: Struct(args);` calls it on the new variable, after its fields got their zeroes and default values; `Struct.new(args)` builds a value.

```ds
struct Point {
    var x: i32;
    var y: i32 = 7;
    sub new(var x: i32, var y: i32) { this->x = x; this->y = y; }
    sub new(var v: i32 = 0) { this->x = v; }        // overloads and defaults
}

var p: Point(1, 2);
var q: Point();                     // q.x == 0, q.y == 7
var r = Point.new(3, 4);            // a value
draw(Point.new(5));                 // as an argument
```

::: Where constructors run
Only where written: `var p: Point;`, `{ ... }` lists, arrays and struct fields don't call one. A variable with a constructor call can't also have a value. Globals are built before `main`, in the order of the source; `static var s: Point(5);` once, before `main`.
:::

::: T.new(args)
A value built by the constructor: a temporary, like a call's result (moved into a variable, passed, returned, or destroyed when its statement ends). Without arguments, a struct without constructors gives its default values: `Plain.new()`.
:::

::: Rules
The arguments see the names around the declaration (in `var x: Point(x);`, `x` is the outer one). `priv sub new` makes a struct only its own subs can build. `new` is a method like the others (`p.new(3)` runs it again). It can't be `static` or return a value.
:::

::: Copy constructors
`sub new(var o: const ref T)` (or `const T*`) is the copy constructor, used for copies: see [Destructors, copies and moves](#destructors).
:::

::: Constructors in classes
Constructors aren't inherited; a class's constructor builds its base's part first. See [Classes](#classes).
:::

::: implicit constructors
`implicit sub new(var s: string)` also converts a `string` to the struct where one is expected. See [Implicit conversions](#implicit-conversions).
:::
</script>

<script type="text/x-dsdoc" data-id="nested-structs" data-group="Structs" data-title="Nested and nameless structs">
A struct can declare structs and enums inside it; and `struct { fields }` is a type without a name.

```ds
struct List {
    struct Node { var value: i32; var next: Node*; }    // List::Node
    enum Kind: u8 { Empty, Some }                       // List::Kind
    priv struct Cursor { var at: Node*; }               // only usable in List
    var head: Node*;
    sub kind() -> Kind { return this->head == null ? Kind.Empty : Kind.Some; }
}
var n: List::Node;

var cursor: struct { var x: i32; var y: i32; } = { 3, 4 };
```

::: Nested types
A nested struct is a struct of its own (not a field: `List` only has `head`), named `Outer::Inner`, and just `Inner` inside the outer struct. Its subs can use the private members of the structs around it.
:::

::: Nameless structs
`struct { fields }` works for variables, fields, arrays, pointers, `sizeof`, aliases. Every nameless struct is its own type (as in C): two variables declared with the same fields can't be assigned to each other. To share one, name it (`alias Pair = struct { ... };`).
:::
</script>

<script type="text/x-dsdoc" data-id="struct-values" data-group="Structs" data-title="Structs by value">
Structs are values: they can be assigned, passed and returned. A sub gets its own copy of a struct argument, and a struct result is a new value.

```ds
sub add(var a: Point, var b: Point) -> Point { return Point.new(a.x + b.x, a.y + b.y); }
sub scale(var p: Point, var k: i32) -> Point { p.x *= k; p.y *= k; return p; }

var c = add(a, b);
var d = scale(a, 3).x;          // a result's field
c = d_point;                    // assignment copies
```

::: Cost
Each struct argument and result is a copy: big structs are cheaper as `const ref T` (see [References](#references)) or `T*`.
:::

::: Everywhere
Also for methods, inline subs, sub pointers (`sub(Point, Point) -> Point`), templates and libraries. Variadic extra arguments take structs only by pointer.
:::

::: Copies of structs that own something
Structs with copy constructors, destructors or `operator=` are copied, moved and assigned through them: see [Destructors, copies and moves](#destructors).
:::
</script>

<script type="text/x-dsdoc" data-id="classes" data-group="Classes and interfaces" data-title="Classes">
A class is a struct that can extend another class (or a struct) with `ex`, implement interfaces with `impl`, and have virtual subs. A struct stays exactly its fields; a class adds a table pointer only when it needs one.

```ds
class Animal {
    prot var legs: i32;
    sub new(var legs: i32) { this->legs = legs; }
    virt sub sound() -> string { return "..."; }
}

class Dog ex Animal {
    sub new() { Animal::new(4); }              // the base's part first
    override sub sound() -> string { return "woof"; }
}

var d: Dog();
var a: Animal* = &d;                            // up the hierarchy: implicit
a->sound();                                     // "woof": the object's own
```

::: The declaration
`[abstract | final] class Name ex Base impl I1, I2 friend A, f { ... }`: one base (no multiple inheritance), any number of [interfaces](#interfaces), [friends](#class-access). `abstract class` may have pure subs and is only pointed at; `final class` can't be extended.
:::

::: What a class inherits
Its base's fields (first, at the same offsets), subs, static subs, constants and static fields (`Derived.make()`, `Derived::KIND`, `KIND` in its subs). Nothing inherited can be hidden: a field, or a sub with the same parameters as one of its base, is an error unless that sub is virtual and the new one is marked `override`. A sub with the same name and other parameters is one more overload.
:::

::: Constructors
Constructors aren't inherited. A class's `new` builds its base's part first: `Base::new(...)` (or `Base.new(...)`) as one of its statements; without one, the base's constructor without arguments is called (an error if the base has constructors, none without arguments). A class without a constructor gets an implicit `new()` when it needs one. While the base's constructor runs, the object is of the base's class.
:::

::: Calling the base's subs
`Base::m(args)` (or `Base.m(args)`, the form for templates: `Base<T>.m(args)`) in a class's sub calls the base's `m` on `this`, directly: what an override uses to extend the base's sub.
:::

::: Values and pointers
A class pointer converts to a pointer to a class it extends (the nearest is the better overload). A derived class's value doesn't convert to its base's value (`var a: Animal = dog;` is an error, which avoids slicing): use pointers or references. Pointers to related classes can be compared.
:::

::: Layout
A class with virtual subs has its table pointer first (when its base has none, the base's fields follow it), then a table pointer for each interface it adds, then its fields. An interface is just a table pointer.
:::
</script>

<script type="text/x-dsdoc" data-id="virtual" data-group="Classes and interfaces" data-title="Virtual subs">
A virtual sub is called through the object's table: through a pointer or reference, the object's own class decides which sub runs.

```ds
abstract class Shape {
    pure sub area() -> f32;                     // no body: derived classes give one
    virt sub name() -> string { return "shape"; }
}
class Circle ex Shape {
    var r: f32;
    override sub area() -> f32 { return 3.14159 * this->r * this->r; }
    override final sub name() -> string { return "circle"; }
}
```

::: virt, override, pure, final
- `virt sub` adds a slot to the class's table.
- `override sub` replaces one: a base class's virtual sub, or an interface's. Same parameters and result; both readonly or neither.
- `pure sub ...;` is a slot without a body (only in abstract classes).
- `final` (with `virt` or `override`) stops derived classes from overriding it.
:::

::: When the call goes through the table
Through a pointer or reference (`p->m()`, `this->m()`), the table decides. On a variable (`x.m()`: its type is exact), on a final class or a final sub, the call is direct (and an inline sub stays inline).
:::

::: Abstract classes
An `abstract class` may have pure subs and can't be a value (no variables, fields, parameters or arrays of it): only pointers and references. A class that isn't abstract must give every pure sub (its own, its bases', its interfaces') a body.
:::

::: Rules
Virtual subs can't be static; constructors, consteval subs and method templates aren't virtual. A destructor is virtual by itself in a class with a table.
:::
</script>

<script type="text/x-dsdoc" data-id="interfaces" data-group="Classes and interfaces" data-title="Interfaces">
An interface is a set of subs a class promises to have. It has no fields; its subs are pure (no body), and classes implement them with `impl` and `override`.

```ds
interface Shape {
    sub area() -> i32;
}
interface Named {
    readonly sub name() -> string;
}

class Square impl Shape, Named {
    var s: i32;
    override sub area() -> i32 { return this->s * this->s; }
    override readonly sub name() -> string { return "square"; }
}

var sq: Square;
var shape: Shape* = &sq;                        // a class converts to its interfaces
shape->area();
```

::: Extending interfaces
`interface Scalable ex Shape { sub scale(var k: i32); }`: an interface can extend one interface. A class implementing `Scalable` is also a `Shape`.
:::

::: Helper subs: final
An interface's `final sub` has a body: a helper every implementing class has (not virtual, not in the table). It uses the interface's subs on `this`:
```ds
interface Stringable {
    readonly sub toString() -> String;
    final implicit readonly sub operator cast() -> String { return this->toString(); }
}
var s: String = *shape;         // any Stringable becomes a String
```
:::

::: Interfaces as types
An interface is only pointed at (`Shape*`, `ref Shape`), never a value. Constants (`constexpr`, `static const`) are allowed in it. `dynamic_cast` goes from one interface to another, or to the class.
:::
</script>

<script type="text/x-dsdoc" data-id="class-access" data-group="Classes and interfaces" data-title="prot and friend">
`prot` makes a member usable by the class and the classes derived from it. `friend` gives other structs, classes and subs the access of the class's own subs.

```ds
class Secret friend Spy, peek {
    priv var hidden: i32 = 42;
    prot var half: i32 = 21;            // Secret and its derived classes
}
class Spy {
    static sub look(var s: Secret*) -> i32 { return s->hidden + s->half; }
}
sub peek(var s: Secret*) -> i32 { return s->hidden; }
```

::: prot
For fields, subs, static fields and constants: the class's subs, those of its derived classes, and its friends. `priv` stays the class's own: a derived class's subs can't use its base's `priv` members.
:::

::: friend
`friend A, B::C, f`: those structs, classes and subs can use `priv` and `prot` members and change `readonly` fields. Structs can have friends too. Friendship isn't inherited.
:::
</script>

<script type="text/x-dsdoc" data-id="class-casts" data-group="Classes and interfaces" data-title="Casts between classes">
Up a hierarchy, pointers convert by themselves. Down a hierarchy, `static_cast` trusts you and `dynamic_cast` checks.

```ds
var d: Dog();
var a: Animal* = &d;                        // up: implicit
var p: Pet* = &d;                           // to an interface: implicit
var back = static_cast<Dog*>(a);            // down: unchecked
var cat = dynamic_cast<Cat*>(a);            // checked: null (it's a Dog)
var other = dynamic_cast<Named*>(p);        // one interface to another
```

::: Pointer adjustment
A class's parts aren't always at its start (an interface's table pointer, a base after a table pointer), so conversions move the pointer to the right part; `null` stays `null`. That's why `cast<>` between related class pointers is an error.
:::

::: dynamic_cast
Needs a pointer to a class with virtual subs or interfaces (or an interface). It finds `T` up the object's chain of classes or among its interfaces; an upcast is decided when compiling. While a base's constructor runs, the object counts as the base's class.
:::

::: Comparing pointers
Pointers to related classes can be compared directly (`shape == &square`): the derived one is converted first.
:::
</script>

<script type="text/x-dsdoc" data-id="destructors" data-group="Classes and interfaces" data-title="Destructors, copies and moves">
`sub del()` is a destructor: it runs when a value's life ends. A struct that owns something frees it there, and then copies go through its copy constructor while temporaries are moved instead of copied.

```ds
struct Buffer {
    var data: u8*;
    var size: u32;
    sub new(var size: u32) { this->data = alloc(size); this->size = size; }
    sub new(var o: const ref Buffer) { ... copy o's data ... }     // copy constructor
    sub del() { free(this->data); }
}

sub load() -> Buffer { var b: Buffer(64); ...; return b; }         // moved out
sub main() {
    var b = load();             // moved in: no copy
    var c: Buffer = b;          // copied: the copy constructor
}                               // c, then b, destroyed
```

::: When destructors run
- Locals: when their scope ends (end of block, `return`, `break`, `continue`), the last declared first.
- Temporaries (call results, values passed to subs): when their statement ends; in `&&`, `||`, `?:` only if they were made.
- Globals and static locals: after `main` returns, the last built first.
- A struct's fields after its destructor's body (the last first), then a class's base's destructor; array elements last to first.
- Memory from elsewhere: `p->del()` (with `p->new(...)`).
:::

::: Implicit destructors
A struct whose fields (or base) have destructors gets an implicit `del()` for them. Destructors aren't inherited (each struct has its own), are never static and take nothing. A value built without a constructor is zeroed, so a destructor must accept zeroed fields.
:::

::: Virtual destructors
In a class with a table, `del` is virtual by itself: `p->del()` through a base pointer runs the object's own. While a base's destructor runs, the object is of the base's class again.
:::

::: Copies
A copy (a variable from another, a value passed, a value returned that isn't a local of the sub) uses the copy constructor `sub new(var o: const ref T)` (or `const T*`); without one, member by member if fields have copy constructors; otherwise the bytes. A struct with its own destructor and no copy constructor can't be copied (an error); moves still work.
:::

::: Moves
A call's result (into a variable, passed by value, assigned), `T.new(...)`, and a local returned by its sub are moved: their bytes taken, their destructor not run. There is no `&&` and no `move()`.
:::

::: Assignment
`a = b` uses `operator=` if the struct has one (it may take other types: `sub operator=(var s: string)`); otherwise a struct with its own destructor or copy constructor has its old value destroyed, then gets a copy (nothing when assigned to itself; a call's result is moved in); a struct holding such fields is assigned member by member. A class object keeps its own table.
:::
</script>

<script type="text/x-dsdoc" data-id="operators" data-group="Classes and interfaces" data-title="Operator overloading">
A struct or class can give meaning to operators: `sub operator<op>(...)` in it is a method whose first operand is `this`; a top-level `sub operator<op>(...)` takes all its operands.

```ds
struct Vec {
    var x: i32; var y: i32;
    sub operator+(var o: const ref Vec) -> Vec { ... }   // a + b
    sub operator-() -> Vec { ... }                       // -a
    readonly sub operator==(var o: Vec) -> bool { ... }  // a == b, and a != b
    readonly sub operator<(var o: Vec) -> bool { ... }   // a < b, and > <= >=
    sub operator+=(var o: Vec) { ... }                   // a += b
    sub operator[](var i: u32) -> ref i32 { ... }        // a[i] = 5 works
    sub operator()(var t: i32) -> i32 { ... }            // a(t)
}
sub operator*(var k: i32, var v: Vec) -> Vec { ... }     // 2 * v
```

::: Which operators
`+ - * / % & | ^ << >> == != < <= > >= ! ~ ++ --`, the compound assignments, `[]`, `()` and `->` (those three only as methods), `=` (see [Destructors, copies and moves](#destructors)) and `cast` (see [Implicit conversions](#implicit-conversions)). `-`, `+` and `*` with no operand are unary. `&&`, `||`, `&` (address), `.`, `?:` and `sizeof` keep their meaning.
:::

::: Derived comparisons
`a != b` is `!(a == b)` when there is no `operator!=`; with only `operator<`, `a > b` is `b < a`, `a <= b` is `!(b < a)`, `a >= b` is `!(a < b)`. `a += b` is only `operator+=`, never made from `+` and `=`.
:::

::: ++ and --
`operator++()` is `++a`; `operator post++()` is `a++`.
:::

::: Smart pointers: -> and *
```ds
struct Owner {
    var p: Point*;
    sub operator->() -> Point* { return this->p; }       // o->x, o->sum()
    sub operator*() -> ref Point { return *this->p; }    // *o, *o = v
}
```
`operator->()` takes nothing; `s->x` on a struct value calls it, then goes on with the result (a struct again: its own `operator->`, until a pointer).
:::

::: How an operator is chosen
Like an overloaded sub: the struct's (with those it inherits) and the top-level ones visible from the code or from an operand's namespace. A `T*` / `const T*` parameter takes a struct operand by its address. A top-level operator needs a struct, class or interface operand.
:::

::: In classes, interfaces, templates
Operators are subs: `readonly`, `inline`, `constexpr`, `virt` / `override` (through a pointer, the object's own runs), in interfaces, templates and libraries; never `static`.
:::
</script>

<script type="text/x-dsdoc" data-id="implicit-conversions" data-group="Classes and interfaces" data-title="Implicit conversions">
A struct can convert from other types (an `implicit` constructor) and to other types (`operator cast`). Without `implicit`, those conversions only happen with `cast<T>(...)`.

```ds
class String {
    var text: string;
    implicit sub new(var s: string) { this->text = s; }        // string -> String
    implicit readonly sub operator cast() -> string { return this->text; }   // String -> string
    readonly sub operator cast() -> u32 { ... }                // only with cast<u32>(s)
}

var s: String = "hello";        // the implicit constructor
s = "hi";                       // a temporary, moved in
var t: string = s;              // the implicit operator cast
var n = cast<u32>(s);           // an explicit one
```

::: implicit constructors
`implicit sub new(var x: T)` (one value; the others with defaults) converts a `T` where the struct is expected: a variable's value, an argument, a returned value, an assignment, an operator's operand (also for a `const ref` or `const S*` operator parameter).
:::

::: operator cast
`sub operator cast() -> T` converts the struct to a `T` with `cast<T>(x)` or `static_cast`. With `implicit`, also where a `T` is expected, and to `bool` in conditions, `!`, `&&` and `||`. A struct can have one per type.
:::

::: Rules
One conversion at a time (no chains), after the conversions the types have anyway: an `operator cast() -> u32` also gives an `i32`. Two ways to convert (a constructor and an operator cast) are an error. Overloads prefer every built-in conversion to these.
:::

::: cast<S>(value)
Builds an `S` from the value with any constructor taking one value, implicit or not: a temporary, like a call's result.
:::
</script>

<script type="text/x-dsdoc" data-id="templates" data-group="Templates" data-title="Templates">
`template(T) { ... }` holds structs, classes and subs written for any type `T`. Each use with types makes an instance, compiled like code written for those types.

```ds
template(T) {
    struct Array {
        var data: T[16];
        var count: u32;
        sub push(var v: T) { this->data[this->count] = v; this->count++; }
    }
    sub max(var a: T, var b: T) -> T { if (a > b) return a; return b; }
}

var a: Array<u32>;
a.push(5);
var m = max(3, 7);                  // T deduced: max<i32>
var n = max<u32>(10, 4);            // or given
```

::: Instances
An instance is made the first time it's used, once per set of arguments (`Array<u32>` is one struct wherever it appears). Its subs are compiled only if something uses them: a method that doesn't work for some type is fine as long as nothing calls it. Errors in a template's body say which instance (`in Array<Point>, instantiated at main.ds:12:5`).
:::

::: Deduction
A sub template's parameters are deduced from its arguments (`T`, `T*`, `T[N]`, `ref T`, `Array<T>*`, sub types); a typed argument decides over a literal (`max(x_u32, 5)` gives `T = u32`). The rest are given: `make<u32>()`.
:::

::: Where templates go
In namespaces and in structs: method templates (`template(T) { sub add(var v: T) { ... } }`, called `s.add(1)` / `s.add<u8>(1)`, also `static`: `Struct.make<T>()`). Classes and interfaces too: `class Box ex Base<T> impl Getter<T>`. Inside a class template, `Base<T>.m()` calls the base's sub.
:::

::: Names and >>
`Name<...>` is a template's arguments wherever the name is a template's; `>>` closes two of them.
:::

::: Libraries
A library's templates travel with it as source: a program makes its own instances.
:::

More: [parameters](#template-params), [where conditions](#where), [if constexpr](#if-constexpr), [type functions](#type-functions).
</script>

<script type="text/x-dsdoc" data-id="template-params" data-group="Templates" data-title="Template parameters">
Template parameters can be optional, have defaults, and be values instead of types.

```ds
template(K, optional V) { struct Entry { var key: K; var value: V; } }
template(T, U = T*, N: u32 = 16) { struct Box { ... } }     // Box<u8> is Box<u8, u8*, 16>
template(T, N: u32 = 8) {
    struct Ring { var items: T[N]; readonly sub capacity() -> u32 { return N; } }
}

var r: Ring<u16, 4>;
var e: Entry<u32, i8>;
```

::: Optional parameters
`optional` once: the parameters after it are optional too. An instance gives what it needs; using a parameter that wasn't given is an error where it's used. `is_given(V)` tells (in a `where` or an `if constexpr`).
:::

::: Defaults
A parameter with a default is optional; an instance without it gets the default (and is the same instance as when it's written). A default can use the parameters before it: `N: u32 = sizeof(T) * 4`.
:::

::: Value parameters
`name: type` is a value known when compiling: a number, `bool`, `f32` or struct value, given like a type: `Ring<u8, 16>`, `Grid<SMALL>`, `Grid<config(3, 3)>`. In the template it's a constant (array sizes, conditions, `C.field`). Comparisons in an argument need parentheses: `B<(A > 2)>`.
```ds
struct Config { var width: u32; var height: u32; }
constexpr SMALL: Config = { 4, 2 };
template(C: Config) { struct Grid { var cells: u8[C.width * C.height]; } }
template(T, N: u32) { sub count(var a: T[N]*) -> u32 { return N; } }
var g: Grid<SMALL>;
count(&arr);                    // N deduced from the array's size
```
One instance per value: `Ring<u16, 4>` and `Ring<u16, 4u>` are the same.
:::

::: Types or values
A parameter without a type (`template(T)`) takes a type or a value: `describe<u8>()`, `describe<5>()`. `is_value(T)` tells which, and `value_type(T)` is the value's type. See [Type functions](#type-functions).
:::
</script>

<script type="text/x-dsdoc" data-id="where" data-group="Templates" data-title="where conditions">
`template(T) where condition { ... }`: an instance is made only if the condition holds for its arguments. Several templates can declare the same name with different conditions; the one whose condition holds is used.

```ds
template(T) where is_integer(T) { sub describe(var v: T) -> u32 { return 1; } }
template(T) where is_pointer(T) { sub describe(var v: T) -> u32 { return 2; } }
template(E) where is_base_of(Engine, E) { struct Generator { var e: E; } }
```

::: Condition expressions
Computed when compiling: `and` / `or` / `not` (`&&` / `||` / `!`), comparisons, arithmetic and bitwise operators, constants, `sizeof(T)`, and built-ins whose type arguments are types (`T*`, `Array<u32>`). A false condition's error names the part that failed: `four<u8>: its where is false: sizeof(T) == 4`.
:::

::: Built-ins: kinds of types
| built-in | true when |
|---|---|
| `is_given(T)` | an optional parameter was given |
| `is_value(T)` | given a value, not a type |
| `is_integer(T)` `is_signed(T)` `is_unsigned(T)` | an integer (not `bool`), signed, unsigned |
| `is_float(T)` `is_numeric(T)` `is_bool(T)` | `f32`; an integer or `f32`; `bool` |
| `is_pointer(T)` `is_array(T)` `is_struct(T)` `is_sub(T)` | the kind of type (`is_struct`: also classes) |
| `is_scalar(T)` `is_builtin(T)` | fits a register; a built-in type |
| `is_type(T, U)` `is_one_of(T, A, B, ...)` | the same type; one of them |
| `is_pointer_to(T, U)` `is_convertible(T, U)` | `T` is a `U*`; a `T` converts to a `U` |
| `is_range(T)` | a for-in works on it |
| `size_of(T)` `array_count(T)` | numbers: the size; an array's length |
:::

::: Built-ins: classes
| built-in | true when |
|---|---|
| `is_class(T)` `is_interface(T)` `is_abstract(T)` | a class; an interface; only pointed at |
| `is_base_of(B, D)` | `B` is `D`, a class it extends or an interface it implements |
| `has_base(T)` | `T` extends a class or struct |
| `has_parent(T, P)` | `P` is up `T`'s chain of classes (not `T` itself) |
| `has_common_base(T, U, P)` | `P` is up both chains |
| `has_friend(T, F)` | `T` names `F` as a friend |
:::

::: Built-ins: members
| built-in | true when |
|---|---|
| `has_method(T, name)` | a method (or method template; inherited too) |
| `has_method(T, name, sub(u32) -> i32)` | a method of that sub type (`this` not counted) |
| `has_field(T, name)` `has_field(T, name, u32)` | a field (of that type) |
| `has_priv_method` `has_prot_method` `has_pub_method` | the same, for `priv`, `prot` or public members |
| `has_priv_field` `has_prot_field` `has_pub_field` `has_readonly_field` | the same for fields |
:::
</script>

<script type="text/x-dsdoc" data-id="if-constexpr" data-group="Templates" data-title="if constexpr">
`if constexpr (condition)` decides when compiling. As a statement, only the chosen branch is compiled; around declarations, only the chosen declarations exist.

```ds
template(K, optional V) {
    sub kind() -> u32 {
        if constexpr (is_given(V)) return 20;
        return 10;
    }
    struct Holder {
        var value: K;
        if constexpr (sizeof(K) > 2) { var extra: u32; }   // fields and methods too
    }
}
if constexpr (WIDE) { alias Word = u32; } else { alias Word = u16; }
```

::: As a statement
The branch not chosen isn't even checked: in a template, it can use what this instance doesn't have. It works outside templates too (`if constexpr (sizeof(Point) == 8)`).
:::

::: Around declarations
At the top level, in a namespace, in a struct's body and in a template's body: `if constexpr (c) { declarations } else if constexpr (...) { ... } else { ... }`. Outside templates, conditions use constants and types, decided in the order of the source. A template's sub or struct left out for an instance isn't there for it.
:::

::: Conditions
The same as [where](#where): built-ins, constants, `sizeof`, `and` / `or` / `not`.
:::
</script>

<script type="text/x-dsdoc" data-id="type-functions" data-group="Templates" data-title="Type functions">
A few type forms are computed when compiling, and work anywhere a type goes.

```ds
template(T) {
    sub twice() -> value_type(T) { return T + T; }     // T given a value
    sub parentSize(var x: T*) -> u32 { return sizeof(base_type(T)); }
}
twice<21>();                                // 42, an i32
var b: base_type(Leaf);                     // the class Leaf extends
var root: absolute_base_type(Leaf*) = &leaf;    // a pointer to the first class of its chain
```

::: value_type(expr)
The type of a value; `value_type(T)` for a template parameter given a value (an error for a type). A value keeps its own type: `5` is an `i32`, `5u` a `u32`.
:::

::: base_type(T) and absolute_base_type(T)
`base_type(T)` is the class `T` extends (an error if none: `has_base(T)` tells); `absolute_base_type(T)` is the first class of its chain (`T` itself if it extends none). For a pointer to a class, a pointer to it.
:::
</script>

<script type="text/x-dsdoc" data-id="preprocessor" data-group="Source organization" data-title="Preprocessor">
The preprocessor works on tokens, before compiling: it includes files, imports libraries and replaces defined names.

```ds
#include("util.ds")
#import("gfx")
#define(DEBUG)
#define(MAX(a, b) = ((a) > (b) ? (a) : (b)))
#if(defined(DEBUG) and VERSION > 2)
    ...
#endif
```

::: Directives
| | |
|---|---|
| `#include("file.ds")` | another source file (next to this one first) |
| `#import("name")` | a compiled library (see [Libraries](#libraries)) |
| `#define(NAME = tokens)` `#define(NAME)` `#undef(NAME)` | defines |
| `#define(NAME(a, b) = tokens)` | with parameters |
| `#if(expr)` `#ifdef(NAME)` `#ifndef(NAME)` `#elif(expr)` `#else` `#endif` | conditions |
| `#multiple` | this file may be included many times (first in the file) |
| `#once` | accepted: files are included once by default |
| `#error(message)` `#warning(message)` | stop / warn |
:::

::: #if expressions
Integers, the C operators, `and` / `or` / `not` and `defined(NAME)`. `__DSCRIPT__` is predefined.
:::

::: Defines with parameters
Replaced only where the name is followed by `(`. Arguments are split on commas outside `()`, `[]` and `{}`; their count must match. Arguments are expanded first, then put in place; the result is scanned again. A define is never replaced inside its own expansion, so `#define(log(x) = log(x, 0))` calls the sub `log`. Parenthesize parameters, as in C. No stringizing (`#a`) or pasting (`a ## b`).
:::

::: Defines vs constants
For values, prefer `const` / `constexpr` (typed, scoped, visible to the tools); for compile-time choices of declarations, `if constexpr` uses the language's own constants and `sizeof`.
:::
</script>

<script type="text/x-dsdoc" data-id="libraries" data-group="Source organization" data-title="Libraries (#import)">
A library is compiled once on its own; programs and other libraries `#import` it. There are no header files: the library carries its own declarations.

```ds
#import("gfx")              // gfx's declarations: as if written here

sub main() -> i32 { return Gfx::width(); }
```

::: What an import gives
The library's declarations, once however many times it is imported: names, namespaces, structs, classes, methods, overloads, default values, `priv` / `prot`, constants and enums all work the same. The importing program's own `#define`s don't apply to them.
:::

::: Inline subs, templates, constexpr
Their bodies travel with the library, so programs compile them: inline subs are expanded, templates instantiated, constexpr subs evaluated in the program.
:::

::: Globals and initialization
A library's globals are its own; the ones needing code (and constructors) are set up before the program's, the libraries a library imports first.
:::

::: Libraries importing libraries
A library can import others; they're found again when it's imported.
:::
</script>

<script type="text/x-dsdoc" data-id="libcore" data-group="Library" data-title="libcore">
libcore is DScript's core library: freestanding utilities any program can use (text and number conversions, strings, memory helpers, math, containers, random numbers and more).

{{soon}}
</script>

<script type="text/x-dsdoc" data-id="keywords" data-group="Reference" data-title="Keywords">
Reserved words (they can't be names):

```ds
var auto const constexpr consteval constinit sub template struct enum alias namespace
return if else while do for switch break continue defer
null true false cast bitcast static_cast dynamic_cast sizeof
inline static priv readonly operator implicit
class interface ex impl friend prot virt pure override final abstract
assert static_assert and or not void
```

::: Words that mean something only in one place
`in` (for-in), `is` and `fall` (switch), `ref` (types), `post` (`operator post++`), `optional` and `where` (templates), `typed` (`...typed`), `value_type`, `base_type`, `absolute_base_type`. Elsewhere they are ordinary names.
:::

::: Built-in names
`va_count`, `va_start`, `va_types` (variadic subs), the condition built-ins (see [where](#where)), `this` in methods, `main`, `__assert_fail`.
:::
</script>

<script type="text/x-dsdoc" data-id="limitations" data-group="Reference" data-title="Limitations">
Things DScript doesn't have (yet):

- `goto`, unions, 64-bit floating point.
- Lambdas don't capture the variables of the sub around them.
- `#define` has no stringizing or token pasting.
- Arrays are passed by pointer (structs by value).
- No reference variables or fields (references are parameters and results).
- Destructors aren't called through an interface pointer (`i->del()`).
- No `using namespace`.
</script>

<script>
(function () {
	"use strict";

	// ===== the topics =====
	const topics = [...document.querySelectorAll('script[type="text/x-dsdoc"]')].map((s, i) => ({
		id: s.dataset.id, group: s.dataset.group, title: s.dataset.title, src: s.textContent, index: i,
	}));
	const byId = new Map(topics.map(t => [t.id, t]));
	const groups = [];
	for (const t of topics) {
		let g = groups.find(x => x.name === t.group);
		if (!g) groups.push(g = { name: t.group, topics: [] });
		g.topics.push(t);
	}

	// ===== a small markup renderer =====
	const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
	const slug = s => s.toLowerCase().replace(/<[^>]+>/g, "").replace(/&[a-z]+;/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

	const KW = new Set(("var auto const constexpr consteval constinit sub template struct enum alias namespace return if else while do for switch break " +
		"continue defer null true false cast bitcast static_cast dynamic_cast sizeof inline static priv readonly operator implicit class interface ex " +
		"impl friend prot virt pure override final abstract assert static_assert and or not this is fall ref in where optional post new del").split(" "));
