A struct can declare other structs and enums inside it, which keeps helper types next to the type that uses them and out of the global namespace. Separately, `struct { fields }` written where a type is expected is a struct type without a name, handy for one-off groupings.

```ds
struct List {
    struct Node { var value: i32; var next: Node*; }    // List::Node
    enum Kind: u8 { Empty, Some }                       // List::Kind
    priv struct Cursor { var at: Node*; }               // only usable inside List
    var head: Node*;
    sub kind() -> Kind { return this->head == null ? Kind.Empty : Kind.Some; }
}
var n: List::Node;

var cursor: struct { var x: i32; var y: i32; } = { 3, 4 };
```

::: Nested types
A nested struct is a separate struct, not a field: `List` above only contains `head`. From outside it's named `Outer::Inner` (`List::Node`), and inside the outer struct just `Inner`. A nested struct can have its own fields, methods and nested types, and its subs can use the private members of the structs around it. `priv` makes a nested type usable only inside the outer struct.
:::

::: Nameless structs
`struct { fields }` can be used for variables, fields, arrays, pointers, `sizeof` and aliases, with fields declared exactly as in a named struct. Every nameless struct is its own type, as in C: two variables declared with the same fields can't be assigned to each other, because each declaration creates a new type. To share one type, give it a name with `struct` or with an alias: `alias Pair = struct { ... };`.
:::
</script>

<script type="text/x-dsdoc" data-id="struct-values" data-group="Structs" data-title="Structs by value">
Structs are values in DScript, just like integers. They can be assigned, passed to subs and returned from them. A sub that takes a struct parameter gets its own copy, so changing it doesn't affect the caller, and a sub returning a struct gives the caller a new value.

```ds
sub add(var a: Point, var b: Point) -> Point { return Point.new(a.x + b.x, a.y + b.y); }
sub scale(var p: Point, var k: i32) -> Point { p.x *= k; p.y *= k; return p; }   // its own copy

var c = add(a, b);
var d = scale(a, 3).x;          // a field of a result
c = a;                          // assignment copies every field
```

::: The cost of copies
Each struct passed by value or returned is a copy, which is cheap for small structs but adds up for large ones. To avoid the copy, pass `const ref T` (see [References](#references)) or a pointer. Returning a local struct is not a copy: the local is moved into the caller's result.
:::

::: Where structs by value work
Everywhere: methods, inline subs, sub pointers (`sub(Point, Point) -> Point`), templates with struct parameters, and libraries. The only exception is the extra arguments of variadic subs, which take structs only by pointer.
:::

::: Structs that own something
When a struct has a copy constructor, a destructor or an `operator=`, copying, moving and assigning it go through them, so structs that manage memory or other resources stay correct when used by value. See [Destructors, copies and moves](#destructors).
:::
</script>

<script type="text/x-dsdoc" data-id="classes" data-group="Classes and interfaces" data-title="Classes">
A class is a struct that can take part in object-oriented designs. It can extend one other class (or a struct) with `ex`, implement any number of [interfaces](#interfaces) with `impl`, have [virtual subs](#virtual) that derived classes override, and name [friends](#class-access). Structs keep their guarantee of being exactly their fields; a class adds a hidden table pointer only when it actually needs one, for virtual subs or interfaces.

```ds
class Animal {
    prot var legs: i32;
    sub new(var legs: i32) { this->legs = legs; }
    virt sub sound() -> string { return "..."; }
}

class Dog ex Animal {
    sub new() { Animal::new(4); }              // build the base's part first
    override sub sound() -> string { return "woof"; }
}

var d: Dog();
var a: Animal* = &d;                            // a Dog is an Animal
a->sound();                                     // "woof": the object's own version
```

::: Declaring a class
The full form is `[abstract | final] class Name ex Base impl I1, I2 friend A, f { ... }`. A class extends at most one class (there's no multiple inheritance of classes), but can implement any number of interfaces. An `abstract class` may contain pure subs without bodies and can only be used through pointers and references; a `final class` can't be extended.
:::

::: What a class inherits
A class contains its base's fields first, at the same offsets, followed by its own, and it inherits its base's methods, static subs, constants and static fields: `Derived.make()` and `Derived::KIND` work, and inside its subs `KIND` is found directly. A class can't hide anything it inherits: declaring a field with an inherited name, or a sub with the same parameters as an inherited one, is an error, unless that inherited sub is virtual and the new one is marked `override`. A sub with the same name but different parameters simply adds another overload.
:::

::: Constructors and the base's part
Constructors aren't inherited. A class's constructor must first build the part of the object that belongs to its base, by calling `Base::new(...)` (or `Base.new(...)`) as one of its statements. When it doesn't, the base's constructor without arguments is called automatically before the constructor's body, and if the base only has constructors that need arguments, that's an error. A class without any constructor gets an implicit `new()` when it needs one. While the base's constructor runs, the object counts as an instance of the base class, so virtual calls made there run the base's versions; this is safer, since the derived class's fields aren't set up yet.
:::

::: Calling the base's version of a sub
Inside a class's sub, `Base::m(args)` (or `Base.m(args)`, the form to use in templates as `Base<T>.m(args)`) calls the base class's `m` on `this`, directly rather than through the table. This is how an override extends its base's behavior instead of replacing it.
:::

::: Values, pointers and slicing
A pointer to a class converts automatically to a pointer to any class it extends, and the nearest base is preferred in overloads. A derived class's value, however, doesn't convert to a base class value: `var a: Animal = dog;` is an error, which avoids the "slicing" problem where a copy silently loses the derived part. Work with pointers or references instead. Pointers to related classes can be compared directly.
:::

::: The object's layout
A class with virtual subs starts with a table pointer (when its base has none, the base's fields come right after it), followed by one table pointer for each interface the class adds, followed by its own fields. An interface is just a table pointer. The table holds the class's type, used by `dynamic_cast`, the destructor, and one entry per virtual sub.
:::
</script>

<script type="text/x-dsdoc" data-id="virtual" data-group="Classes and interfaces" data-title="Virtual subs">
A virtual sub is called through the object's table, so when you call it through a pointer or a reference, the object's actual class decides which version runs. That's the basis of polymorphism: code written for a base class works with every class derived from it.

```ds
abstract class Shape {
    pure sub area() -> f32;                     // no body: derived classes provide one
    virt sub name() -> string { return "shape"; }
}

class Circle ex Shape {
    var r: f32;
    override sub area() -> f32 { return 3.14159 * this->r * this->r; }
    override final sub name() -> string { return "circle"; }
}
```

::: virt, override, pure and final
- `virt sub` declares a new virtual sub, adding an entry to the class's table.
- `override sub` replaces an inherited virtual sub: one from a base class, or one declared by an interface the class implements. It must have the same parameters and result, and be readonly if and only if the original is.
- `pure sub ...;` declares a virtual sub without a body, which derived classes must provide. Only abstract classes can have pure subs.
- `final`, together with `virt` or `override`, prevents derived classes from overriding the sub any further.

Requiring `override` catches a classic bug: if a sub meant to override doesn't match the base's signature, the compiler reports it instead of silently creating a new, unrelated sub.
:::

::: When a call goes through the table
A call through a pointer or a reference (`p->m()`, `this->m()`, a `ref` parameter) uses the object's table. A call on a variable (`x.m()`) is direct, because a variable's type is known exactly, and so are calls on final classes and final subs. Direct calls cost nothing extra, and inline subs stay inline when called directly.
:::

::: Abstract classes
An `abstract class` may contain pure subs and can never be a value: there are no variables, fields, parameters or arrays of an abstract class, only pointers and references to it. Every class that isn't abstract must provide a body for every pure sub it inherits, whether from its own declarations, from its base classes or from its interfaces; the compiler lists any that are missing.
:::

::: Rules
Virtual subs can't be static. Constructors, consteval subs and method templates can't be virtual. A destructor is virtual automatically in a class that has a table, so destroying an object through a base pointer always runs the right destructor.
:::
</script>

<script type="text/x-dsdoc" data-id="interfaces" data-group="Classes and interfaces" data-title="Interfaces">
An interface describes a set of subs that classes promise to provide, without saying anything about how. It has no fields, and its subs are pure. A class implements interfaces with `impl` and provides their subs with `override`. Code can then work with any object through the interface, whatever its class.

```ds
interface Shape {
    sub area() -> i32;
}
interface Named {
    readonly sub name() -> string;
}

class Square impl Shape, Named {
    var s: i32;
    override sub area() -> i32 { return this->s * this->s; }
    override readonly sub name() -> string { return "square"; }
}

var sq: Square;
var shape: Shape* = &sq;                        // a class converts to its interfaces
shape->area();
```

::: Extending interfaces
An interface can extend one other interface: `interface Scalable ex Shape { sub scale(var k: i32); }`. A class that implements `Scalable` must provide both `scale` and `area`, and is usable as a `Scalable` and as a `Shape`.
:::

::: Helper subs with final
An interface's subs normally have no body, but a `final sub` in an interface is a helper with a body. Every class implementing the interface has it. It isn't virtual and has no table entry, and it works by calling the interface's other subs on `this`. A typical use is a conversion that every implementing class gets for free:

```ds
interface Stringable {
    readonly sub toString() -> String;
    final implicit readonly sub operator cast() -> String { return this->toString(); }
}
var s: String = *shape;         // any Stringable converts to a String
```
:::

::: Interfaces as types
An interface can only be used through pointers and references (`Shape*`, `ref Shape`); it's never a value on its own. Interfaces can contain constants (`constexpr` and `static const`). `dynamic_cast` can convert from an interface to the class behind it, or from one interface to another.
:::
</script>

<script type="text/x-dsdoc" data-id="class-access" data-group="Classes and interfaces" data-title="prot and friend">
Classes add two ways to control access on top of `priv` and `readonly`. `prot` makes a member usable by the class and by the classes derived from it, which is how a base class shares internals with its descendants without making them public. `friend` gives specific other structs, classes or subs the same access as the class's own subs.

```ds
class Secret friend Spy, peek {
    priv var hidden: i32 = 42;
    prot var half: i32 = 21;            // Secret and its derived classes
}
class Spy {
    static sub look(var s: Secret*) -> i32 { return s->hidden + s->half; }
}
sub peek(var s: Secret*) -> i32 { return s->hidden; }
```

::: prot
`prot` applies to fields, subs, static fields and constants. A protected member can be used by the class's own subs, by the subs of every class derived from it, and by its friends. `priv` stays strictly private: even a derived class's subs can't use their base's `priv` members, so a base class decides exactly what its descendants may touch.
:::

::: friend
`friend A, B::C, f` lists structs, classes and subs that get full access: they can use `priv` and `prot` members and change `readonly` fields, exactly like the class's own subs. Structs can declare friends too. Friendship isn't inherited: a friend of a base class has no special access to its derived classes, and a class derived from a friend isn't a friend.
:::
</script>

<script type="text/x-dsdoc" data-id="class-casts" data-group="Classes and interfaces" data-title="Casts between classes">
Moving up a class hierarchy is always safe, so pointers convert automatically from a class to the classes it extends and to the interfaces it implements. Moving down is only correct if the object really is of the target class, so it requires a cast: `static_cast` when you know it is, and `dynamic_cast` when you want the program to check.

```ds
var d: Dog();
var a: Animal* = &d;                        // up the hierarchy: automatic
var p: Pet* = &d;                           // to an interface: automatic
var back = static_cast<Dog*>(a);            // down: unchecked
var cat = dynamic_cast<Cat*>(a);            // checked: null, because it's a Dog
var other = dynamic_cast<Named*>(p);        // from one interface to another
```

::: Pointers are adjusted
The parts of an object aren't all at its starting address: an interface's table pointer, or a base class placed after a table pointer, sits further in. Conversions between related classes therefore move the pointer to the right part of the object, and leave `null` as `null`. That's why a plain `cast<>` between pointers to related classes is an error: it would keep the address as it is and point at the wrong part.
:::

::: How dynamic_cast decides
`dynamic_cast<T*>(p)` reads the object's type from its table, so `p` must point at a class with virtual subs or interfaces, or at an interface. It looks for `T` among the classes of the object's chain and among its interfaces, and gives a pointer to that part, or `null`. A cast upwards is decided while compiling and costs nothing. While a base class's constructor is running, the object counts as an instance of that base class.
:::

::: Comparing pointers
Pointers to related classes can be compared directly, as in `shape == &square`: the pointer to the derived class is converted first, so the comparison is correct even when the parts are at different addresses.
:::
</script>

<script type="text/x-dsdoc" data-id="destructors" data-group="Classes and interfaces" data-title="Destructors, copies and moves">
A destructor, the method `sub del()`, runs automatically when a value's life ends, which lets a struct release what it owns: memory, handles, locks. Once a struct owns something, copying it byte by byte would be wrong, because two copies would both release the same thing. DScript handles this the way C++ does, but with simpler rules: copies go through the copy constructor, and temporaries are moved instead of copied automatically.

```ds
struct Buffer {
    var data: u8*;
    var size: u32;
    sub new(var size: u32) { this->data = alloc(size); this->size = size; }
    sub new(var o: const ref Buffer) { ... copy o's data ... }     // copy constructor
    sub del() { free(this->data); }
}

sub load() -> Buffer { var b: Buffer(64); ...; return b; }         // moved out
sub main() {
    var b = load();             // moved in: no copy
    var c: Buffer = b;          // copied with the copy constructor
}                               // c, then b, are destroyed
```

::: When destructors run
- Locals are destroyed when their scope ends, at the end of their block or by `return`, `break` or `continue`, the last declared first.
- Temporaries (call results, values passed to subs, `T.new(...)`) are destroyed at the end of their statement; inside `&&`, `||` and `?:`, only if they were actually created.
- Globals and static locals are destroyed after `main` returns, in the reverse order of their construction.
- The fields of a struct are destroyed after its destructor's body, the last field first; then a class's base part is destroyed by the base's destructor. Array elements are destroyed from the last to the first.
- Memory obtained some other way (for example from an allocator) is built with `p->new(...)` and destroyed with `p->del()`. `p->new(...)` first stores the fields' default values and the class tables, exactly as a declaration would, so the memory's old contents don't matter.
:::

::: Building and destroying any type in place
`p->new(...)` and `p->del()` work for every type, so a template can build and destroy its `T` in memory it manages without asking what `T` is:
- `p->new()` on a type without constructors gives it its default values; a number or a pointer becomes 0.
- `p->new(value)` with a value of the type itself makes a copy, exactly as initializing a variable would (the copy constructor, the members' copies, or the bytes); a call's result is moved in instead. For a number or a pointer, `value` is anything that converts to it.
- `p->del()` on a type without a destructor does nothing; on an array, it destroys the elements.

Anything else (a constructor's arguments, a struct's own destructor) is the struct's own method, as before.
:::

::: take(p)
`take(p)` moves the value `p` points at out: its bytes are taken without the copy constructor, and what's left at `p` is no longer a value, so it isn't destroyed there. A struct comes out as a temporary, like a call's result: moved into a variable, or destroyed at the end of the statement if nothing keeps it. This is how a container hands an element back, even one that can't be copied. `p` can't be a `const T*`. `take` is a built-in only where nothing else is named `take`.

```ds
var slot: Unique* = cast<Unique*>(alloc(sizeof(Unique)));
slot->new(make_unique(6));      // moved in
var mine = take(slot);          // moved out: slot is raw memory again
free(slot);                     // no destructor runs for it
```
:::

::: own parameters
A value passed to a normal parameter belongs to the caller, which destroys it when its statement ends. An `own` parameter belongs to the sub instead: the sub destroys it when it ends, so it can keep the value somewhere (a container's `push`). A call's result is handed over without a copy; a variable is copied for the sub. Returning an own parameter moves it out. `own` is part of the sub's type (`sub(own T) -> void`), and an override must have the same own parameters. It isn't a keyword: it only means this right before a parameter's type, so `own::x` is still a name (write `own ns::T`, not `own ::ns::T`).
:::

::: forget(v)
`forget(v)` keeps a local or an own parameter from being destroyed when its scope ends, because what it held was moved somewhere else. It can be anywhere in `v`'s scope, including inside an `if`, a loop or a `defer`: a variable that `forget` takes gets a hidden drop flag, set when it's built and cleared by `forget`, which its destructor checks. On a type without a destructor it does nothing, so templates can use it for any `T`.

```ds
template(T) { struct Stack {
    ...
    sub push(var v: own T) { (&this->items[this->count])->new(take(&v)); forget(v); this->count++; }
    sub pop() -> T { this->count--; return take(&this->items[this->count]); }
} }
```
:::

::: Implicit destructors
A struct whose fields or base class have destructors automatically gets an implicit `del()` that destroys them, so you only write a destructor for what a struct owns directly. Destructors aren't inherited (each struct has its own), are never static, and take no parameters. A value created without a constructor starts zeroed, so a destructor should accept zeroed fields, for example by checking a pointer for null before freeing it.
:::

::: Virtual destructors
In a class that has a table, the destructor is virtual automatically: `p->del()` through a base class pointer runs the destructor of the object's actual class, which then destroys the base's part. While a base class's destructor runs, the object counts as an instance of that base class again.
:::

::: Copies
A copy happens when a variable is initialized from another value, when a value is passed to a sub, or when a sub returns something other than one of its own locals. It uses the struct's copy constructor `sub new(var o: const ref T)` (or `const T*`) if there is one; otherwise, if some fields have copy constructors, the struct is copied member by member, each field in its own way; otherwise its bytes are copied. A struct that has its own destructor but no copy constructor can't be copied at all, which turns a whole class of double-free bugs into compile errors. Moving such a struct still works.
:::

::: Moves
Values that are about to disappear are moved instead of copied: their bytes are taken over and their destructor doesn't run. This happens for a call's result used to initialize a variable, passed by value or assigned; for `T.new(...)`; and for a local returned by its sub. You don't write anything for this: there's no `&&` and no `move()`. (Memory a container manages is moved out of with `take(p)`.)
:::

::: Assignment
`a = b` uses the struct's `operator=` if it has one, and `operator=` may also accept other types (`sub operator=(var s: string)`). Without one, a struct with its own destructor or copy constructor has its old value destroyed and then receives a copy; nothing happens when a value is assigned to itself, and a call's result is moved in rather than copied. A struct that merely contains such fields is assigned member by member. When a class object is assigned, it keeps its own table, so the object never changes its class.
:::
</script>

<script type="text/x-dsdoc" data-id="operators" data-group="Classes and interfaces" data-title="Operator overloading">
Structs and classes can give a meaning to operators, so that code using them reads naturally: `a + b` for vectors, `a == b` for strings, `m[i]` for containers, `p->x` for smart pointers. An operator is declared as `sub operator<op>(...)`. Inside a struct it's a method whose first operand is `this`; at the top level it's a sub that takes all its operands, which allows forms such as `2 * v` where the struct is on the right.

```ds
struct Vec {
    var x: i32; var y: i32;
    sub operator+(var o: const ref Vec) -> Vec { ... }   // a + b
    sub operator-() -> Vec { ... }                       // -a
    readonly sub operator==(var o: Vec) -> bool { ... }  // a == b, and a != b
    readonly sub operator<(var o: Vec) -> bool { ... }   // a < b, and >, <=, >=
    sub operator+=(var o: Vec) { ... }                   // a += b
    sub operator[](var i: u32) -> ref i32 { ... }        // a[i] = 5 works
    sub operator()(var t: i32) -> i32 { ... }            // a(t)
}
sub operator*(var k: i32, var v: Vec) -> Vec { ... }     // 2 * v
```

::: Which operators can be overloaded
The arithmetic, bitwise, shift and comparison operators (`+ - * / % & | ^ << >> == != < <= > >=`), the unary `! ~` and `++ --`, the compound assignments, `[]`, `()` and `->`, as well as `=` (see [Destructors, copies and moves](#destructors)) and `cast` (see [Implicit conversions](#implicit-conversions)). `[]`, `()`, `->`, `=` and `cast` can only be methods. `-`, `+` and `*` with no operand are the unary forms. `&&` and `||` can't be overloaded, because they would lose short-circuit evaluation; `&` (address), `.`, `?:` and `sizeof` keep their built-in meaning too.
:::

::: Comparisons derived for you
When a struct defines `operator==` but not `operator!=`, `a != b` is computed as `!(a == b)`. When it defines only `operator<`, the other orderings are derived: `a > b` is `b < a`, `a <= b` is `!(b < a)`, and `a >= b` is `!(a < b)`. Compound assignments aren't derived, though: `a += b` requires `operator+=`, so that types can implement it efficiently in place.
:::

::: ++ and --
`sub operator++()` defines the prefix form `++a`, and `sub operator post++()` defines the postfix form `a++`. They're separate because the postfix form usually has to return the old value.
:::

::: Smart pointers: -> and *
A struct can behave like a pointer by defining `operator->` and the unary `operator*`:

```ds
struct Owner {
    var p: Point*;
    sub operator->() -> Point* { return this->p; }       // o->x, o->sum()
    sub operator*() -> ref Point { return *this->p; }    // *o, and *o = v
}
```

`operator->()` takes no parameters. When `s->x` is used on a struct value, the compiler calls it and continues with the result; if the result is itself a struct, its own `operator->` is applied, and so on until a pointer is reached.
:::

::: How an operator is chosen
Operators are chosen like overloaded subs: the candidates are the struct's operators (including inherited ones) and the top-level operators visible from the code or from an operand's namespace, and the best match wins. A parameter of type `T*` or `const T*` takes a struct operand by its address, which avoids copies. A top-level operator must have at least one operand that is a struct, class or interface, so the meaning of operators on built-in types can't be changed.
:::

::: Operators are subs
Everything that applies to subs applies to operators: they can be `readonly`, `inline`, `constexpr`, `virt` or `override` (an overridden operator called through a pointer runs the object's own version), and they work in interfaces, templates and libraries. They can't be `static`.
:::
</script>

<script type="text/x-dsdoc" data-id="implicit-conversions" data-group="Classes and interfaces" data-title="Implicit conversions">
A struct can define its own conversions in both directions: from other types, with an `implicit` constructor, and to other types, with an `operator cast`. Conversions marked `implicit` happen automatically wherever the target type is expected; the others only happen when you write `cast<T>(...)`, which is the safer default.

```ds
class String {
    var text: string;
    implicit sub new(var s: string) { this->text = s; }               // string -> String
    implicit readonly sub operator cast() -> string { return this->text; }   // String -> string
    readonly sub operator cast() -> u32 { ... }                       // only with cast<u32>(s)
}

var s: String = "hello";        // uses the implicit constructor
s = "hi";                       // builds a temporary and moves it in
var t: string = s;              // uses the implicit operator cast
var n = cast<u32>(s);           // an explicit conversion
```

::: Implicit constructors
`implicit sub new(var x: T)`, a constructor taking a single value (any other parameters must have defaults), converts a `T` into the struct wherever the struct is expected: in a variable's value, an argument, a returned value, an assignment, or an operator's operand, including operator parameters of type `const ref S` or `const S*`.
:::

::: operator cast
`sub operator cast() -> T` converts the struct to a `T`, by writing `cast<T>(x)` or `static_cast<T>(x)`. Marked `implicit`, it also converts automatically wherever a `T` is expected, and a conversion to `bool` makes the struct usable in conditions and with `!`, `&&` and `||`. A struct can have one operator cast for each target type.
:::

::: The rules that keep conversions predictable
Only one user-defined conversion is applied at a time; they never chain. A built-in conversion may follow one, so an `operator cast() -> u32` can also produce an `i32`. When two different conversions could apply (a constructor of the target and an operator cast of the source), the compiler reports an ambiguity rather than guessing. Overload resolution always prefers built-in conversions over user-defined ones.
:::

::: cast<S>(value)
`cast<S>(value)` builds an `S` from the value with any of its constructors that takes one value, whether marked `implicit` or not. The result is a temporary, like a call's result.
:::
</script>

<script type="text/x-dsdoc" data-id="templates" data-group="Templates" data-title="Templates">
A template is code written once for any type. `template(T) { ... }` contains structs, classes, interfaces and subs that use the parameter `T`, and each use with concrete types creates an instance, compiled exactly like code written by hand for those types. There's no run-time cost: `Array<u32>` is as efficient as a struct written specifically for `u32`.

```ds
template(T) {
    struct Array {
        var data: T[16];
        var count: u32;
        sub push(var v: T) { this->data[this->count] = v; this->count++; }
    }
    sub max(var a: T, var b: T) -> T { if (a > b) return a; return b; }
}

var a: Array<u32>;
a.push(5);
var m = max(3, 7);                  // T is deduced from the arguments: max<i32>
var n = max<u32>(10, 4);            // or given explicitly
```

::: When instances are made
An instance is made the first time it's used, and only once for each combination of arguments: `Array<u32>` is the same struct everywhere in the program. An instance's subs and methods are only compiled if something uses them. So a method that doesn't make sense for some type causes no trouble as long as nothing calls it on that type; if something does, the error appears there. Errors inside a template's body say which instance they belong to and where it was made (`in Array<Point>, instantiated at main.ds:12:5`).
:::

::: Deducing the arguments
When a sub template is called without explicit arguments, they're deduced from the call's arguments: the compiler matches each parameter's type, `T`, `T*`, `T[N]`, `ref T`, `Array<T>*`, sub types, against the argument's type. A typed argument takes precedence over a literal, so `max(x_u32, 5)` deduces `T = u32`. Parameters that can't be deduced are given explicitly: `make<u32>()`.
:::

::: Where templates can go
Templates can be declared at the top level, in namespaces and in structs. In a struct they make method templates (`template(T) { sub add(var v: T) { ... } }`, called `s.add(1)` or `s.add<u8>(1)`, and also as `static` subs: `Struct.make<T>()`). Classes and interfaces can be templates too, and can extend other templates' instances: `class Box ex Base<T> impl Getter<T>`. Inside such a class, `Base<T>.m()` calls the base class's version of a sub.
:::

::: Template names and >>
Wherever a name belongs to a template, `Name<...>` is read as its arguments rather than as comparisons, and `>>` closes two argument lists at once (`Array<Array<u32>>`).
:::

::: Templates in libraries
A library's templates are part of what it exports, as source: a program that uses them creates its own instances, compiled into the program.
:::

::: Alias templates
A template can hold aliases: `Name<args>` is then the type the alias names for those arguments. When it names a struct, it's that struct itself, not a copy of it, so `Name<...>.make()` and static subs work, and both spellings are the same type. This lets a library offer a general template and a shorter name with some arguments fixed:

```ds
template(T, A) { struct BasicVector { ... } }           // any allocator
template(T) { alias Vector = BasicVector<T, MallocAlloc>; }
template(T) { alias PtrTo = T*; }

var v: Vector<u32>;             // BasicVector<u32, MallocAlloc>
```
:::

More on templates: [parameters](#template-params), [where conditions](#where), [if constexpr](#if-constexpr) and [type functions](#type-functions).
</script>

<script type="text/x-dsdoc" data-id="template-params" data-group="Templates" data-title="Template parameters">
Template parameters are more flexible than simple type placeholders. A parameter can be optional, it can have a default, and it can be a value known while compiling rather than a type, which lets a template take sizes, flags and even whole configuration structs.

```ds
template(K, optional V) { struct Entry { var key: K; var value: V; } }
template(T, U = T*, N: u32 = 16) { struct Box { ... } }     // Box<u8> is Box<u8, u8*, 16>
template(T, N: u32 = 8) {
    struct Ring { var items: T[N]; readonly sub capacity() -> u32 { return N; } }
}

var r: Ring<u16, 4>;
var e: Entry<u32, i8>;
```

::: Optional parameters
The word `optional` appears once in a parameter list, and every parameter after it is optional too. An instance gives the arguments it needs; using a parameter that wasn't given is an error at the point where it's used. `is_given(V)` tells whether it was given, in a `where` condition or an `if constexpr`, so a template can adapt.
:::

::: Defaults
A parameter with a default value is optional, and an instance that leaves it out gets the default. Writing the default explicitly makes the same instance: `Box<u8>` and `Box<u8, u8*, 16>` are one type. A default can use the parameters before it, as in `N: u32 = sizeof(T) * 4`.
:::

::: Value parameters
A parameter written `name: type` is a value known while compiling: a number, a `bool`, an `f32` or a struct value. It's given like a type (`Ring<u8, 16>`, `Grid<SMALL>`, `Grid<config(3, 3)>`), and inside the template it's a constant, usable in array sizes, conditions and expressions (`C.width`). The argument can be any constant expression, though a comparison must be in parentheses (`B<(A > 2)>`) so its `>` isn't taken as the end of the argument list.

```ds
struct Config { var width: u32; var height: u32; }
constexpr SMALL: Config = { 4, 2 };
template(C: Config) { struct Grid { var cells: u8[C.width * C.height]; } }
template(T, N: u32) { sub count(var a: T[N]*) -> u32 { return N; } }

var g: Grid<SMALL>;
count(&arr);                    // N is deduced from the array's size
```

There's one instance per value: `Ring<u16, 4>` and `Ring<u16, 4u>` are the same type, since the value is converted to the parameter's type first. Value parameters can be deduced from an array's size (`T[N]`) or from an instance's arguments (`Ring<T, N>*`).
:::

::: Parameters that take types or values
A parameter without a type, as in `template(T)`, accepts either a type or a value: both `describe<u8>()` and `describe<5>()` work. `is_value(T)` tells which one was given, and `value_type(T)` is the value's type. See [Type functions](#type-functions).
:::
</script>

<script type="text/x-dsdoc" data-id="where" data-group="Templates" data-title="where conditions">
A `where` condition limits which arguments a template accepts: `template(T) where condition { ... }` only creates an instance when the condition holds. Several templates can declare the same name with different conditions, and the one whose condition holds is used, which is how DScript expresses specialization.

```ds
template(T) where is_integer(T) { sub describe(var v: T) -> u32 { return 1; } }
template(T) where is_pointer(T) { sub describe(var v: T) -> u32 { return 2; } }
template(E) where is_base_of(Engine, E) { struct Generator { var e: E; } }
```

::: Writing conditions
A condition is an expression computed while compiling. It can use `and`, `or` and `not` (or `&&`, `||` and `!`), comparisons, arithmetic and bitwise operators, constants, `sizeof(T)`, and the built-ins listed below, whose type arguments can be any type (`T*`, `Array<u32>`). When a condition is false, the error names the part that failed, for example `four<u8>: its where is false: sizeof(T) == 4`. If more than one template's condition holds for the same name, that's an error too.
:::

::: Built-ins about kinds of types
| built-in | true when |
|---|---|
| `is_given(T)` | an optional parameter was given |
| `is_value(T)` | given a value rather than a type |
| `is_integer(T)` `is_signed(T)` `is_unsigned(T)` | an integer (not `bool`), signed, unsigned |
| `is_float(T)` `is_numeric(T)` `is_bool(T)` | `f32`; an integer or `f32`; `bool` |
| `is_pointer(T)` `is_array(T)` `is_struct(T)` `is_sub(T)` | the kind of type (`is_struct` includes classes) |
| `is_scalar(T)` `is_builtin(T)` | fits in a register; a built-in type |
| `is_type(T, U)` `is_one_of(T, A, B, ...)` | the same type; one of the listed types |
| `is_pointer_to(T, U)` `is_convertible(T, U)` | `T` is a `U*`; a `T` converts to a `U` |
| `is_range(T)` | a for-in loop can iterate over it |
| `size_of(T)` `array_count(T)` | numbers: the size; an array's element count |
:::

::: Built-ins about classes
| built-in | true when |
|---|---|
| `is_class(T)` `is_interface(T)` `is_abstract(T)` | a class; an interface; only usable through pointers |
| `is_base_of(B, D)` | `B` is `D`, a class `D` extends, or an interface it implements |
| `has_base(T)` | `T` extends a class or a struct |
| `has_parent(T, P)` | `P` is up `T`'s chain of classes (not `T` itself) |
| `has_common_base(T, U, P)` | `P` is up the chains of both `T` and `U` |
| `has_friend(T, F)` | `T` names `F` as a friend |
:::

::: Built-ins about members
| built-in | true when |
|---|---|
| `has_method(T, name)` | a method of that name (or method template; inherited ones too) |
| `has_method(T, name, sub(u32) -> i32)` | a method with that sub type (`this` not counted) |
| `has_field(T, name)` `has_field(T, name, u32)` | a field of that name (and type) |
| `has_priv_method` `has_prot_method` `has_pub_method` | the same as `has_method`, for `priv`, `prot` or public members |
| `has_priv_field` `has_prot_field` `has_pub_field` `has_readonly_field` | the same for fields |
:::
</script>

<script type="text/x-dsdoc" data-id="if-constexpr" data-group="Templates" data-title="if constexpr">
`if constexpr (condition)` is decided while compiling. Used as a statement, only the chosen branch is compiled, and the other one isn't even checked. Used around declarations, only the declarations of the chosen branch exist. This lets a template adapt its code to its arguments, and lets any program choose declarations based on its constants.

```ds
template(K, optional V) {
    sub kind() -> u32 {
        if constexpr (is_given(V)) return 20;
        return 10;
    }
    struct Holder {
        var value: K;
        if constexpr (sizeof(K) > 2) { var extra: u32; }   // fields and methods too
    }
}
if constexpr (WIDE) { alias Word = u32; } else { alias Word = u16; }
```

::: As a statement
Because the branch that isn't chosen isn't checked, it can use things that don't exist for the current instance, such as a method that only some types have. `if constexpr` works outside templates too, for example `if constexpr (sizeof(Point) == 8)`.
:::

::: Around declarations
At the top level, in a namespace, in a struct's body and in a template's body, `if constexpr (c) { declarations } else if constexpr (...) { ... } else { ... }` keeps only the declarations of the chosen branch: the others have no names and no code. Outside templates, the conditions use constants and types, and they're decided in the order of the source, so a later condition can depend on what an earlier one declared. Inside a template, a sub or struct left out by its `if constexpr` simply doesn't exist for that instance.
:::

::: Conditions
The conditions are the same as for [where](#where): the built-ins, constants, `sizeof`, and `and`, `or` and `not`.
:::
</script>

<script type="text/x-dsdoc" data-id="type-functions" data-group="Templates" data-title="Type functions">
A few type forms are computed by the compiler and can be used anywhere a type goes: in declarations, parameter and result types, `sizeof`, casts and conditions. They're mostly useful in templates, where the types involved aren't known in advance.

```ds
template(T) {
    sub twice() -> value_type(T) { return T + T; }     // T given a value
    sub parentSize(var x: T*) -> u32 { return sizeof(base_type(T)); }
}

twice<21>();                                    // 42, an i32
var b: base_type(Leaf);                         // the class Leaf extends
var root: absolute_base_type(Leaf*) = &leaf;    // a pointer to the first class of its chain
```

::: value_type(expr)
`value_type(expr)` is the type of a value. For a template parameter that was given a value, `value_type(T)` is that value's type; using it on a parameter given a type is an error. A value keeps its own type: `5` is an `i32` and `5u` is a `u32`.
:::

::: base_type(T) and absolute_base_type(T)
`base_type(T)` is the class that `T` extends; it's an error if `T` extends nothing, which `has_base(T)` can check first. `absolute_base_type(T)` is the first class of `T`'s chain, the one at the top, or `T` itself when it extends nothing. Given a pointer to a class, both give a pointer to the corresponding class.
:::
</script>

<script type="text/x-dsdoc" data-id="containers" data-group="Library" data-title="Containers and String">
libcore has growable containers written as templates over an allocator, so the same code works in a kernel, a user program or with an arena of your own. An allocator is any struct with `static sub alloc(var size: u32) -> void*` (null when there's no memory) and `static sub free(var p: void*)`. stdlib gives them short names that use `malloc` and `free`, and the SDK's `dr::SystemAllocator` uses the system heap.

| libcore | stdlib | What it is |
|---|---|---|
| `std::BasicVector<T, A>` | `std::Vector<T>` | a growable array |
| `std::BasicStack<T, A>` | `std::Stack<T>` | last in, first out |
| `std::BasicMap<K, V, A>` | `std::Map<K, V>` | keys kept in order (an AVL tree) |
| `std::BasicHashMap<K, V, A>` | `std::HashMap<K, V>` | a hash table |
| `std::BasicString<A>` | `std::String` | a growable text that owns its memory |

```ds
var v: std::Vector<u32>;
v.push(5);                                  // false: no memory
for (auto x in v) { ... }                   // auto& x: a pointer to the element
var last = v.pop();                         // moved out

var ages: std::Map<std::String, u32>;
ages.set("bob", 31);                        // a new entry, or its value replaced
var a: u32* = ages.get("bob");              // null when it isn't there
for (auto& e in ages) { ... e->key ... e->value ... }   // in key order

var s: std::String = "Hello";
s += ", ";
s.appendf("{} times", 3);
std::print(s);                              // a String works where a string is expected
```

::: Values in, values out
Elements, keys and values are values. `push` and `set` take theirs as `own` parameters, so a call's result is moved in and a variable is copied; `pop` and `remove` give them back by moving them out; and the container destroys whatever it still holds. Growing moves elements by their bytes. A type that can't be copied works too: only copying the container itself needs copies of its elements.
:::

::: Running out of memory
When the allocator returns null, the subs that return `bool` return false and leave the container as it was (a value given to them is destroyed).
:::

::: Keys
A `Map` orders its keys with `std::less`, and a `HashMap` uses `std::equals` and `std::hash_of`. Numbers, pointers and enums work as they are. A `string` key (`const u8*`) is compared and hashed by its text, but the map keeps only the pointer, so the text must outlive the entry; `std::String` keys own their text. A struct key needs `operator<` for a `Map`, and `operator==` and `readonly sub hash() -> u32` for a `HashMap`.
:::

::: What each one has
- `BasicVector`: `size`, `capacity`, `empty`, `[i]`, `at`, `front`, `back`, `data`, `push`, `pop`, `insert(i, v)`, `remove(i)` (moved out), `erase(i)` (destroyed), `swap_remove(i)`, `resize`, `reserve`, `shrink`, `clear`, `find(v)`, `contains(v)`, `copy_from`.
- `BasicStack`: `push`, `pop`, `top`, `size`, `empty`, `clear`, `reserve`; a for-in goes from the bottom to the top.
- `BasicMap` and `BasicHashMap`: `set(key, value)`, `get(key) -> V*`, `find(key) -> MapEntry<K, V>*`, `contains`, `remove`, `size`, `empty`, `clear`, `copy_from`; a `Map` also has `first()` and `last()`, a `HashMap` has `reserve(n)` and `capacity()`. A for-in gives `std::MapEntry<K, V>` elements with `key` and `value` (don't change the key). A `HashMap`'s entry pointers stay valid until a new key is added.
- `BasicString`: built from a `string` (implicitly), copied, assigned `= "text"`; `c_str()` (never null) and the implicit conversion to `string`; `len`, `empty`, `[i]`, `append`, `append_n`, `append_char`, `append_int`, `append_uint(v, base)`, `appendf(fmt, ...)` (std::format's syntax), `+=` with a string or a `u8`, `truncate`, `clear`, `reserve`, `find`, `find_char`, `contains`, `starts_with`, `ends_with`, `substr(from, n)`, `==` and `<` with a string, `hash()`.
:::
</script>

<script type="text/x-dsdoc" data-id="assert" data-group="Assertions" data-title="assert">
`assert(condition)` states something that must be true at that point of the program. When the program runs and the condition is false, the assertion fails, and the program reports where and which condition failed instead of continuing in a broken state. Assertions document assumptions in a way the program checks, and they catch bugs close to their cause.

```ds
sub divide(var a: i32, var b: i32) -> i32 {
    assert(b != 0, "division by zero");
    return a / b;
}

assert(p != null);                          // the message is optional
assert(count < MAX && ready);
```

::: The condition and the message
The condition must be an integer, a `bool` or a pointer (true when it isn't zero or null). The optional message must be a string; it's passed to the failure handler together with the condition's text exactly as written in the source, the file and the line, so a failure report can be precise without you repeating any of it.
:::

::: Assertions are not error handling
Assertions are for things that should never happen if the program is correct: violated preconditions, impossible states, broken invariants. Problems that can legitimately occur at run time, such as a missing file or invalid user input, should be handled with normal code, because assertions can be compiled out entirely (see [The failure handler and NDEBUG](#assert-handler)).
:::

::: Side effects in conditions
Since assertions can be removed by defining `NDEBUG`, a condition shouldn't do anything the program depends on. `assert(init())` would skip the initialization in a build without assertions; call `init()` separately and assert its result instead.
:::

::: Checking while compiling instead
When the condition only involves constants, types and sizes, use [static_assert](#static-assert), which checks it while compiling, at no cost when the program runs.
:::
</script>

<script type="text/x-dsdoc" data-id="assert-handler" data-group="Assertions" data-title="The failure handler and NDEBUG">
DScript doesn't decide what a failed assertion does: the program decides. When an assertion fails, the code calls a global sub named `__assert_fail`, which is defined by the program itself or by a library it imports. A program for an operating system might print a message and exit, a kernel might show a panic screen, and firmware might halt the machine. Defining `NDEBUG` removes assertions from a build entirely.

```ds
sub __assert_fail(var file: string, var line: u32, var condition: string, var message: string) {
    print("assertion failed: ");
    print(condition);
    ... report file, line and message, then stop ...
}
```

::: What the handler receives
The handler gets four arguments: the source file, the line number, the condition as it was written in the source, and the assertion's message, or an empty string when the assertion has none. What happens after the handler is up to it; typically it doesn't return, but stops the program.
:::

::: Who defines the handler
The handler is an ordinary global sub, so it can be written in the program, or come from a library the program imports. A platform's runtime library is the natural place for it: it knows how to report an error and end a program on that platform. Freestanding libraries, which can run anywhere, should not define one, so that each program keeps the choice. The handler must be visible wherever `assert` is used: an `assert` with no `__assert_fail` in sight is a compile error, so a missing handler is never discovered at run time. On DragonVM, the DragonOS stdlib provides one; see [Assertions on DragonVM](#tc-dragonvm).
:::

::: Asserts in libraries
A library can use `assert` only if it can see an `__assert_fail` when it is compiled: one it defines itself, or one from a library it imports. Its assertions then call that handler, for every program that uses the library. A library meant to be used by any program, with any handler, should therefore avoid `assert` (or use `static_assert`, which needs no handler).
:::

::: NDEBUG
When `NDEBUG` is defined, either in the source with `#define(NDEBUG)` or with the compiler option `-D NDEBUG`, assertions are only checked by the compiler for correctness. They generate no code, their conditions never run, and no `__assert_fail` is needed. This is how assertions are removed from release builds.
:::
</script>

<script type="text/x-dsdoc" data-id="static-assert" data-group="Assertions" data-title="static_assert">
`static_assert(condition, "message")` checks a condition while compiling. If it's false, compilation stops with `static_assert failed:` followed by the message, or by the condition's text if there's no message. It generates no code and needs no handler, which makes it ideal for checking layouts, sizes, configuration constants and template arguments.

```ds
static_assert(sizeof(u32) == 4);
struct Header {
    var magic: u32;
    var size: u16;
    static_assert(sizeof(Header) == 6, "Header must match the file format");
}
template(T, N: u32) {
    static_assert(N > 0, "a ring holds at least one item");
    struct Ring { var items: T[N]; }
}
```

::: Where it can be written
At the top level and in namespaces, where it's checked after every declaration is known; in a struct's body, where it's checked once the struct's layout is complete, so `sizeof` of the struct itself works; in a sub, at the point where it's written; and in a template's body, where it's checked for each instance with that instance's arguments, the error saying which instance failed.
:::

::: What the condition can use
The condition must be computable while compiling: constants, `sizeof`, enum values, constexpr calls, and in templates the template's parameters and the condition built-ins (see [where](#where)).
:::
</script>

<script type="text/x-dsdoc" data-id="preprocessor" data-group="Source organization" data-title="Preprocessor">
The preprocessor runs before the compiler proper and works on tokens rather than on text. It includes other source files, imports compiled libraries, replaces defined names, and keeps or drops parts of the source depending on conditions. Its directives look like calls, with their arguments in parentheses.

```ds
#include("util.ds")
#import("gfx")
#define(DEBUG)
#define(MAX(a, b) = ((a) > (b) ? (a) : (b)))
#if(defined(DEBUG) and VERSION > 2)
    ...
#endif
```

::: The directives
| | |
|---|---|
| `#include("file.ds")` | includes another source file (searched next to the including file first) |
| `#import("name")` | imports a compiled library (see [Libraries](#libraries)) |
| `#define(NAME = tokens)` `#define(NAME)` `#undef(NAME)` | defines or removes a name |
| `#define(NAME(a, b) = tokens)` | a define with parameters |
| `#if(expr)` `#ifdef(NAME)` `#ifndef(NAME)` `#elif(expr)` `#else` `#endif` | conditional parts |
| `#multiple` | this file may be included more than once (first thing in the file) |
| `#once` | accepted for familiarity: files are included only once by default |
| `#error(message)` `#warning(message)` | stops the compilation, or prints a warning |
:::

::: Files are included once
Unlike C, a file included several times is only included the first time, so there's no need for include guards. A file that really must be included every time (for example, one generating code from defines) says so with `#multiple` as its first line.
:::

::: #if expressions
`#if` and `#elif` evaluate integer expressions with the C operators, `and`, `or` and `not`, and `defined(NAME)`. `__DSCRIPT__` is always defined, and the compiler can define more names (see [Compiler options](#tc-options)).
:::

::: Defines with parameters
A define with parameters is replaced only where its name is followed by `(`; elsewhere the name is left alone. The arguments are split on the commas that aren't inside `()`, `[]` or `{}`, and their number must match. Arguments are expanded first, then put in place of the parameters, and the result is scanned again for more defines. A define is never replaced inside its own expansion, so `#define(log(x) = log(x, 0))` ends up calling the sub `log`. As in C, parenthesize parameters in the replacement, since they're inserted as tokens, not values. There's no stringizing (`#a`) or token pasting (`a ## b`).
:::

::: Defines or constants?
For values, prefer `const` and `constexpr`: they have types, follow scopes and namespaces, and are understood by the tools. For choosing declarations at compile time, `if constexpr` uses the language's own constants and `sizeof`, which `#if` can't see. Defines remain useful for build switches and small textual helpers.
:::
</script>

<script type="text/x-dsdoc" data-id="libraries" data-group="Source organization" data-title="Libraries (#import)">
A library is compiled once, on its own, and then imported by programs and other libraries with `#import("name")`. There are no header files to write or keep in sync: a compiled library carries its own declarations, and importing it makes them visible as if they had been written in the program.

```ds
#import("gfx")              // gfx's declarations, as if written here

sub main() -> i32 { return Gfx::width(); }
```

::: What an import gives
Importing a library makes all its declarations visible: names, namespaces, structs, classes, methods, overloads, default values, `priv` and `prot`, constants and enums, all behaving exactly as in the library. A library is imported only once, however many files import it. The importing program's own `#define`s don't affect the library's declarations.
:::

::: Inline subs, templates and constexpr subs
Some things can't be compiled once in advance, because they're compiled where they're used: inline subs (expanded at each call), templates (instantiated for each set of arguments) and constexpr subs (evaluated while compiling the program). Their bodies travel with the library, so programs compile them as needed.
:::

::: Globals and initialization
A library's globals belong to the library. Those that need code to set them up, including their constructors, are initialized before the program's own globals, and a library's own imports are initialized before it, so everything a library uses is ready when its code runs.
:::

::: Libraries importing libraries
A library can import other libraries. When a program imports it, those libraries are found and imported too.
:::

::: Compiling and linking libraries
How libraries are compiled, how only the parts a program uses are linked, and how they can be shared between programs at run time is described in the toolchain section: [Static libraries](#tc-libs) and [Shared libraries](#tc-shared).
:::
</script>

<script type="text/x-dsdoc" data-id="tc-overview" data-group="Toolchain" data-title="The tools">
DScript programs are compiled by `dsc` and run on **DragonVM**, a virtual machine with its own 32-bit CPU, memory map, devices and firmware. This section describes the toolchain around the language: how to compile programs and libraries, the formats they're written in, how libraries are linked statically or shared at run time, how to run and debug programs, and how editors get language support. It is the only part of this reference that is specific to DragonVM.

| Tool | What it does |
|---|---|
| `dsc` | the DScript compiler: sources to a program (DRX or raw binary) or a library (`.dlib`, `.drl`) |
| `dasm` | the DragonVM assembler; `dsc` contains it, so it's only needed for hand-written assembly (`.dss`) |
| `dsls` | the DScript language server: errors, completion, hover and navigation in editors |
| `drun` | runs a program on a machine without a window, for scripts and tests |
| `dvm` | runs a machine with its window (screen, keyboard) |
| `ddb` | the debugger: a machine with source-level stepping, breakpoints and history |
| `dtools` | utilities for virtual disks and debugger files |

A typical session compiles a program and runs it:

```
dsc hello.ds -L extra/ds/stdlib/lib -o hello.drx
drun config/testMachine.dvm hello.drx --boot
```

::: How dsc works inside
`dsc` reads the source, runs the preprocessor, parses the program, checks it, and generates dasm assembly; then the assembler built into it turns that into machine code, and the linker adds the libraries the program imports. All of this happens in one command, and no intermediate files are written unless you ask for them (`--emit-dasm` saves the generated assembly).
:::

::: Machines
Every DragonVM tool that runs code takes a machine configuration file (`.dvm`) first: it describes the CPU (its clock and its extensions), the memory, the devices and the disks. DScript's generated code needs the CPU extensions `extmov` and `extalu`, and `extfpu` for programs using `f32` (`cpuext = extmov, extalu, extfpu` in the configuration).
:::
</script>

<script type="text/x-dsdoc" data-id="tc-dsc" data-group="Toolchain" data-title="Compiling with dsc">
`dsc` compiles one program, given as its main source file, into one output file. The other files of the program come in through `#include`, and compiled libraries through `#import`; `-I` and `-L` add directories to look in. By default the output is a relocatable DRX program next to the source, with the extension `.drx`.

```
dsc program.ds                                   // program.drx
dsc program.ds -o build/program.drx -L libs      // #import finds libs/<name>.dlib
dsc program.ds -O                                // optimized
dsc program.ds --emit-dasm program.dasm          // also writes the generated assembly
dsc --lib src/*.ds -o lib/mylib.dlib             // a library
```

::: Where included and imported files are found
`#include("file.ds")` looks next to the including file first, then in each `-I` directory, in order. `#import("name")` looks for `name.dlib` next to the importing file, then in each `-L` directory; a path works too (`#import("libs/gfx")`, with `.dlib` added). A library's own imports are found again from where its `.dlib` is, then in the `-L` directories. The older forms `#include(<file.ds>)` and `#import(<name>)` are still accepted and search only the `-I` and `-L` directories.
:::

::: Errors and warnings
Errors are reported with their file, line and column. Errors inside templates also say which instance they belong to and where it was made. Errors inside a define's expansion point at the place where the define is used.
:::

::: What the compiler predefines
`__DSCRIPT__` is always defined. `__RAW__` is defined when compiling with `--raw`, and `__ROM__` with `--rom`, so the source can adapt to how it's built. `-D NAME` and `-D NAME=value` define more names, as `#define` would.
:::
</script>

<script type="text/x-dsdoc" data-id="tc-options" data-group="Toolchain" data-title="Compiler options">
The options of `dsc`, grouped by purpose. Output formats and libraries have their own topics: [Output formats](#tc-output), [Static libraries](#tc-libs) and [Shared libraries](#tc-shared).

| Option | Meaning |
|---|---|
| `-o <file>` | the output file (default: the source's name, with `.drx`, or `.bin` with `--raw`) |
| `-I <dir>` | adds a directory for `#include`, after the including file's own |
| `-L <dir>` | adds a directory for `#import` (`name.dlib`), after the importing file's own |
| `-D <NAME>[=<value>]` | defines a name, like `#define` (`-D NDEBUG` removes asserts) |
| `-O` | optimizes (`-O0`, the default, doesn't) |
| `--no-inline` | compiles inline subs as normal subs |
| `--debug`, `-g` | keeps the debug instructions of low blocks (`debug_break`, ...) |
| `--emit-dasm <file>` | also writes the generated assembly |
| `--save-disassembly <dir or file>` | saves the debugger's disassembly, with the source lines |
| `--verbose` | prints the program's size and relocations |
| `-Wa,<opt>[,<opt>...]` | passes options to the assembler |

::: -O: optimization
With `-O`, each sub is compiled twice. The first pass finds the scalar locals and parameters (integers, bools, floats, pointers, enums) whose address is never taken, and how often each is used, counting uses inside loops more; the second pass keeps the most used ones in CPU registers instead of memory, letting variables whose lifetimes don't overlap share a register. A final pass removes copies between registers that aren't needed. Optimized programs are smaller and noticeably faster; the debugger still shows variables kept in registers. Code written in low blocks is never changed, and registers it names are never used for variables.
:::

::: --no-inline
Compiles every inline sub as a normal sub, so that each call is a real call. The program behaves the same, but its machine code is easier to follow in the disassembly and the debugger, where an inlined body would otherwise be repeated at every call.
:::

::: -Wa: assembler options
`-Wa,<option>[,<option>...]` hands options to the built-in assembler, as `dasm` takes them: `-D` or `--debug` (dasm's debug mode: it keeps the `debug_*` instructions, prints the program's information and saves the disassembly), `--save-disassembly,<file>`, `--save-final-stage,<file>`, `--verbose`, `--verbose-2`, `--verbose-full`, and `-I,<dir>` for `@include` lines in low blocks. `-o` and the options disabling CPU extensions aren't allowed, since the generated code needs those extensions. Note that `dsc`'s own `-D NAME=value` is a define, unrelated to dasm's `-D`.
:::

::: Saving the disassembly for the debugger
`--save-disassembly <path>` writes what the debugger needs to show the program's source: the instructions, which source line each one comes from, and the source files' text. Given a directory, the file is named the way the debugger looks for it. For a DRX, the disassembly is saved at offset 0 together with the program's id, and the debugger moves it to wherever the program is loaded (see [Debugging](#tc-debug)).
:::
</script>

<script type="text/x-dsdoc" data-id="tc-output" data-group="Toolchain" data-title="Output formats: DRX, --raw, --rom">
`dsc` produces three kinds of programs. The default, **DRX**, is a relocatable executable that a loader (an operating system, a boot loader, `drun`) can place anywhere in memory; it's called like a sub and returns when `main` returns. **`--raw`** produces a bare-metal binary that runs at one fixed address and halts the machine when `main` returns, for boot code and kernels. **`--rom`** is a raw binary meant to run from read-only memory, such as the BIOS.

```
dsc program.ds                                         // program.drx
dsc kernel.ds --raw --load 0x01012000 --fixed 1024,0xFF --header KERNEL0_BOOT
dsc bios.ds --rom --fixed 16777216,0xFF                // a 16 MB BIOS image
```

::: DRX: relocatable programs
A DRX is assembled at address 0 and carries a relocation table: the offsets of every 32-bit address in the program. A loader copies the image to its chosen base address, adds the base to the word at each relocation offset, and calls `base + entry`. The header is 32 bytes:

```
0x00  magic 'DRX1'   0x04  header size (32)   0x08  image size    0x0C  entry offset
0x10  reloc count    0x14  reloc table offset 0x18  id (64 bits, high word first; 0: none)
```

The id identifies the build (a hash of the entry, the image and the relocations). The disassembly saved with the program has the same id, which lets the debugger find the right one wherever the program is loaded. A program that links shared libraries is a **DRX2**, which adds a table of the libraries to load and the symbols to fill in; see [Shared libraries](#tc-shared).
:::

::: Starting a DRX
The loader calls the entry with the program's arguments, or with none:

```
push argc        // the number of arguments (argv[0] is the program itself, by convention)
push argv        // string*: argc strings, then null
push 2
call base + entry
```

or `push 0` then `call base + entry` when there are no arguments. The program's start code runs the global initializers and constructors, then calls `main`, passing `argc` and `argv` if `main` takes them (`0` and `null` when the program was called without arguments). `main`'s value is returned in the `RV` register.
:::

::: --raw: bare-metal binaries
A raw binary is assembled for a fixed address, given with `--load <address>` (by default `0x01010000`, the start of RAM), and is started by jumping to its first byte. When `main` returns, it halts the machine with `hlt`, since there's nobody to return to; `main(argc, argv)` always receives `0` and `null`. `--fixed <size>,<fill>` pads the binary to exactly that size with a fill byte (useful for disk sectors or ROM images), and `--header <name>` adds one of the machine's known headers, such as `KERNEL0_BOOT`, which the BIOS checks before booting. Libraries are linked into raw binaries too, before the padding.
:::

::: --rom: programs in ROM
`--rom` builds a raw binary, loaded at `0x00000000` unless `--load` says otherwise, for code that runs from read-only memory. Since nothing stored in the program can be written there, everything that would write into the program is an error: in practice, every global `var`. What remains is ROM-safe: constants, string constants, constant arrays, string literals and code. Changing state goes on the stack (locals) or in RAM through pointers (`var state: State* = cast<State*>(0x01010000);`). `__ROM__` is defined, so shared code can adapt. Low blocks and writes through pointers into the program's own data aren't checked.
:::

::: The generated code
For those reading the machine code: arguments are pushed left to right as 32-bit slots, followed by their count, and the machine's `call` saves the registers and the stack frame (`ret` restores them). Parameter `i` is at `PP - 4 * i`, locals are at negative offsets from `FP`, and the result is returned in `RV`. Registers R1 to R16 hold an expression's temporaries, R17 to R20 are scratch registers, and S1 and S2 carry the DScript variables used in low blocks. A program starts with a jump over its data to the start code, followed by the top-level low blocks, the subs, and the few runtime helpers it uses.
:::
</script>

<script type="text/x-dsdoc" data-id="tc-libs" data-group="Toolchain" data-title="Static libraries">
A library is compiled once, on its own, into a `.dlib` file, with `dsc --lib`. A library has no `main`, and can be made from several source files compiled together. Programs and other libraries then use it with `#import("name")`, and by default `dsc` links it **statically**: the parts of the library that the program uses are copied into the program, which remains a single self-contained file.

```
dsc gfx.ds --lib -o build/gfx.dlib           // a library: no main
dsc src/*.ds --lib -o build/gfx.dlib         // several files, compiled as one, in order
dsc game.ds -L build -o game.drx             // game.ds says #import("gfx")
```

::: What a .dlib contains
A `.dlib` holds the library's code and data (assembled at address 0) and its relocations, the addresses it needs from other libraries (imports), its own symbols (exports), the list of libraries it imports, and its declarations as DScript source, together with where each one is in the library's original files. That last part is what replaces header files: importing the library compiles those declarations, and errors, hover and go-to-definition in the editor point at the library's real sources. The bodies of inline subs, templates and constexpr subs are part of these declarations, since programs compile them.
:::

::: Only what's used is linked
A `.dlib` records where its image can be cut: each sub, global, string and constant array is a separate piece. When linking, `dsc` keeps only the pieces reachable from what the program uses: its calls, the addresses it takes, every library's initialization code, and then whatever those pieces call or point to, in the same library or in another one. Since every address inside a library is a relocation, the kept pieces can be moved together and their addresses fixed. The savings are large: a small shell that links the core libraries is 1.5 KB instead of 32 KB. `--whole-libraries` links libraries entirely instead.
:::

::: How linking works
The program is first assembled with made-up addresses for the library symbols it uses, then assembled again with those addresses moved, which reveals exactly which words hold them. The libraries' kept pieces are then placed after the program (aligned to 16 bytes), and those words are set to the real addresses, becoming relocations in a DRX. The result is still one DRX or raw binary, so nothing changes for loaders, the BIOS or `drun`.
:::

::: Initialization order
Each library's globals are its own. Those that need code to set them up, including constructors, are initialized before the program's globals, and a library's own imports are initialized before the library, so every library is ready by the time anything uses it.
:::

::: DragonVM's libraries
DragonVM comes with three libraries, each built into `extra/ds/<name>/lib`:
- **libcore**: freestanding utilities with no hardware access or system calls, usable by any program (see [libcore](#libcore)).
- **dragon-sdk**: the hardware and the BIOS services, in the namespace `dr`, for programs running in supervisor mode: the BIOS, the boot loader, kernels. It imports libcore.
- **stdlib**: the runtime of DragonOS programs, which run in user mode: system calls, random numbers, the clock, and the assertion handler. It imports libcore.
:::
</script>

<script type="text/x-dsdoc" data-id="tc-shared" data-group="Toolchain" data-title="Shared libraries">
A library can also be compiled as a **shared library** with `dsc --lib --shared`, which writes both the usual `.dlib` and a `.drl`. A program can then link it **dynamically**: instead of copying the library in, it only records which library it needs, and its loader loads the `.drl` when the program starts. One copy of the library's code is shared by every process that uses it, while each process gets its own copy of the library's writable globals. A shell that is 32 KB when linked statically is 659 bytes when linked dynamically.

```
dsc --lib --shared src/*.ds -o lib/mylib.dlib    // lib/mylib.dlib and lib/mylib.drl
dsc prog.ds -L lib --dynamic -o prog.drx         // a DRX2: mylib is linked when it's loaded
drun machine.dvm prog.drx -L lib                 // drun loads lib/mylib.drl and links it
```

::: Choosing static or dynamic
Each imported library is linked either statically or dynamically, and the choice can be made in the source or on the command line:

```
#import("stdlib", dynamic)       // this one dynamic
#import("mylib", static)         // this one static, even with --dynamic
#import("other")                 // the command line decides (static by default)
```

On the command line, `--dynamic` makes every library dynamic, `--dynamic=a,b` only those, and `--static=a,b` keeps those static even with `--dynamic`. From strongest to weakest, what decides is: `--static=` and `--dynamic=`, then the `#import`'s own word, then `--dynamic`, and finally static. With no dynamic library at all, the output is a plain DRX, byte for byte what it would be anyway; with at least one, it's a DRX2. Raw programs have no loader, so their libraries are always static.
:::

::: Dependencies
A dynamic library's own dependencies are dynamic too. Its `.drl` uses the shared copies of the libraries it imports; a static copy of one of them in the program would be a second copy with its own globals, two different states of the same library. A dependency that nobody chose explicitly is made dynamic automatically, and one chosen static is an error that explains what to change. The other direction is fine: a static library can use a dynamic one, in which case the static library's imports become the program's.
:::

::: The ABI check
Both the `.dlib` and the `.drl` record the library's ABI, a hash of its interface. A program records the ABI of each library it links dynamically, and the loader refuses a `.drl` whose ABI differs, because its structs, subs or inline subs may have changed since the program was compiled. Rebuilding the program against the new `.dlib` resolves it.
:::

::: How writable globals stay per process
The library's code, strings and constant arrays are loaded once and never written. Its writable globals are grouped together, and each process gets its own copy of them, made from the library's initial values when the process starts. Each loaded library is given a slot number, the same for every process; each process has a small table with, for each slot, where its copy of that library's globals is. Code in a shared library therefore reaches its writable globals through that table, which the kernel switches along with the running process. A library without writable globals needs no per-process copy at all.
:::

::: Loaders
`drun` contains a complete loader: `-L <dir>` says where the `.drl` files are, and `--link-log` prints what it does. The file formats, the loading steps, the readers available to loaders written in DScript, and the plan for the DragonOS kernel's loader are described in detail in `other/info/dynamic-linking.md`.
:::
</script>

<script type="text/x-dsdoc" data-id="tc-run" data-group="Toolchain" data-title="Running programs">
`drun` runs a program on a machine without opening a window, prints what the program prints, and reports the result of `main`. It's the quickest way to try a program and the tool the test suite is built on. `dvm` runs a machine with its window, screen and keyboard, and boots it like a real computer.

```
drun config/testMachine.dvm program.drx                  // a DRX, loaded at 0x01020000
drun config/testMachine.dvm program.drx --boot           // run the BIOS first (its services then work)
drun config/testMachine.dvm program.drx -- one two       // arguments: argc = 3
drun config/testMachine.dvm kernel.bin --at 0x01012000   // a raw binary needs its address
```

::: drun's options
| Option | Meaning |
|---|---|
| `--at <address>` | where to load the program (DRX: default `0x01020000`; required for raw binaries) |
| `--boot` | runs the BIOS first, so its interrupts and services work |
| `-L <dir>` | where the shared libraries (`.drl`) of a DRX2 are |
| `-- <arguments>` | the program's arguments; `argv[0]` is the program's path |
| `--user` | runs the program in user mode instead of supervisor mode |
| `--max-cycles <n>` | stops after n cycles (default 50 million) |
| `--file <address>:<path>` | puts a file in memory before the program runs |
| `--dump <address>[:n]` | prints n bytes of memory at the end |
| `--screen` | prints the text screen at the end |
| `--quiet` | prints only the program's output |
| `--link-log`, `--drx-events` | traces the dynamic linker, and the programs loaded and unloaded |

`drun` exits with 0 when the machine halted without errors, 1 on errors, and 2 when it ran out of cycles.
:::

::: Supervisor and user mode
By default, programs run in supervisor mode, like the BIOS, a boot loader or a kernel, so privileged instructions work. `--user` runs the program in user mode, the way DragonOS runs its programs; a `hlt` there is privileged, and ends the run.
:::

::: dvm
`dvm <machine.dvm>` starts a machine with its window and boots it from its BIOS and disks. `--force-load <binary> <ram offset>` injects a binary into memory first, which also works for a DRX, which is relocated to that offset.
:::
</script>

<script type="text/x-dsdoc" data-id="tc-debug" data-group="Toolchain" data-title="Debugging with ddb">
`ddb` is DragonVM's debugger: a machine with a window, plus views of the CPU, memory and disassembly, and a console. When a program is compiled with `--save-disassembly`, ddb shows its DScript source: each source line above the instructions generated from it, with breakpoints on lines and subs, stepping line by line, and the full history of execution, so you can step backwards too.

```
dsc program.ds --raw --save-disassembly disassembly/     // a raw binary
dsc program.ds --save-disassembly disassembly/           // a DRX: found wherever it's loaded
ddb config/testMachine.dvm
```

::: Stepping and breakpoints
`sl` (`step-line`, F7) goes to the next source line, entering called subs; `nl` (`next-line`, F8) runs calls, interrupts and inlined subs whole. `break <file>:<line>` stops at a line, or at the next one that has code, and at every copy of an inlined line; the file can be just the end of its path, such as `entry.ds`. `break <sub>` stops at a sub, by its full name or just its last parts when they're unique, and on all its overloads. `where` shows where execution is, and `list [file:line]` shows source. Where a program has no source lines, these commands step one instruction at a time.
:::

::: DRX programs in the debugger
A DRX's disassembly is saved at offset 0, together with the program's id. ddb keeps it aside until a loader tells it where the program was placed, and then shows it there, with its sources, breakpoints and stepping. Loaders built on the SDK do this automatically, and `ddb --force-load program.drx <offset>` does it too. A program rebuilt without saving its disassembly has a new id, so ddb shows no source rather than the wrong source.
:::

::: Libraries in the debugger
Libraries are debugged like the program: a `.dlib` keeps its own disassembly, with its source lines and files, and the program's saved disassembly includes it at the address where the library was linked.
:::

::: Making the code easier to follow
`--no-inline` compiles inline subs as real calls, and leaving out `-O` keeps every variable in memory, so both make stepping through the machine code more direct. `-g` keeps the `debug_break` instructions written in low blocks, which stop the debugger at that point.
:::

::: debug_print
`debug_print("text")` (or any `string`) prints to the host's terminal, `drun`'s or `ddb`'s output, rather than the machine's screen. It's a DragonVM instruction, always assembled, and works for tracing even in code that runs before the screen is set up. At most 4096 bytes are printed per call.
:::
</script>

<script type="text/x-dsdoc" data-id="tc-dsls" data-group="Toolchain" data-title="Editor support (dsls)">
`dsls` is the DScript language server. Editors that speak the Language Server Protocol start it and get errors as you type, completion, hover information (types, signatures, constant values, struct layouts), go to definition, and document and project symbols. A Zed extension comes with the repository, along with tree-sitter grammars for DScript and dasm that provide highlighting and outlines.

```
{
    "args": ["-L", "extra/ds/dragon-sdk/lib"],
    "files": { "extra/ds/bios/entry.ds": ["--rom"] }
}
```

::: Configuring dsls
`dsls` reads `dsls.json` from the workspace root, shown above. `args` lists `dsc` options for every program, and `files` adds options for particular programs. The useful options are `-I`, `-L` (so that `#import` finds compiled libraries), `-D`, `--rom` and `--raw`, with paths relative to the workspace root.
:::

::: How analysis works
