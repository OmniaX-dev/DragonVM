id = "dragonvm"
name = "DragonVM"
description = "DScript and dasm (Dragon assembly): syntax highlighting, outline, brackets, indentation; DScript language server (dsls)"
version = "0.1.0"
schema_version = 1
authors = ["OmniaX-Dev"]

# The grammars live in this repository (editors/tree-sitter-*). Zed fetches `repository` at
# `rev` and compiles `path`/src/parser.c. After changing a grammar: commit it, then run
# ./update-grammar-rev.sh (it sets `rev` to the last commit that changed each grammar).
# To publish: point `repository` at a public URL of this repository (./update-grammar-rev.sh <url>).

[grammars.dscript]
repository = "file:///home/sylar/GitRepos/Dragon/DragonVM"
rev = "b78daea35163af002049ee4a7b90a3909302f7f5"
path = "editors/tree-sitter-dscript"

[grammars.dasm]
repository = "file:///home/sylar/GitRepos/Dragon/DragonVM"
rev = "ed54d2e4782ea534e30d827c4d52859886a0d98b"
path = "editors/tree-sitter-dasm"

# dsls, the DScript language server (bin/dsls; see src/lib.rs for how it is found): errors as
# you type, go to definition, hover, symbols. Configuration: dsls.json in the workspace root.
[language_servers.dsls]
name = "dsls"
languages = ["DScript"]
